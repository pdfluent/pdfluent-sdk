name: Benchmarks

# Parked (#276). The per-pull-request corpus check lives in ci-ephemeral.yml
# and reads corpus/GATE_CORPUS_MANIFEST.json. What is left here is the large
# holdout run, which needs a corpus that no longer exists on any machine this
# repository can reach.

on:
  # The `xfa-corpus` runner this job needs does not exist. There is one
  # self-hosted runner registered on this repository, `xfa-desktop-fast`,
  # labelled `xfa-fast`. Every automatic run of this workflow therefore sat in
  # the queue until GitHub gave up on it a day later, holding a slot and making
  # the pipeline look permanently busy -- while testing nothing.
  #
  # Dispatch-only until there is a runner that can pick it up, or until the
  # corpus reaches a machine that already has one (#276). Better an honest gap
  # than a queue entry that pretends to be a gate.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Parked (#276). This job wants a runner labelled `xfa-corpus`; none is
  # registered, so dispatching it used to leave a run sitting in the queue for
  # days -- and a queued run is not a red run, so nobody saw it. Worse, a
  # permanently non-empty queue switches the instance sweep off entirely.
  #
  # This gate turns that silence into an immediate, legible failure. Delete it
  # the day the corpus runner exists.
  parked:
    # Hosted, not the persistent desktop. workflow_dispatch lets the caller pick
    # any ref, so this job's body comes from that ref -- a branch could replace
    # the failing step and run whatever it liked on the machine that also
    # provisions and reaps. Five seconds of hosted runner on a dispatch nobody
    # should be making is the cheaper side of that trade, and the cost guard
    # already says a dispatch is a decision that may cost.
    runs-on: ubuntu-latest
    steps:
      - name: Say why this cannot run, instead of waiting for a runner
        run: |
          echo "SKIPPED (not a pass): this workflow measures the large holdout" \
               "corpus and there is nothing left to measure. It asks for a" \
               "runner labelled 'xfa-corpus'; none is registered. The corpus" \
               "itself lived on one external disk, which now enumerates but" \
               "refuses every read, and corpus/CI_CORPUS_MANIFEST.json points" \
               "all 500 of its entries at a path on that disk -- so it cannot" \
               "be rebuilt from this repository either." >&2
          echo "SKIPPED (not a pass): the per-pull-request corpus check is not" \
               "waiting on this. It moved to ci-ephemeral.yml and reads the" \
               "gate corpus in corpus/GATE_CORPUS_MANIFEST.json: 500 PDFs from" \
               "three public licensed suites, pinned by SHA-256, fetched on" \
               "every run. This workflow stays parked for the holdout and" \
               "un-parks when a holdout corpus exists again. (#276)" >&2
          exit 1

  benchmark:
    needs: parked
    name: Run Benchmarks
    # Self-hosted runner: consistent hardware for reliable benchmark comparisons.
    # Criterion baseline cache (target/criterion) persists between runs on self-hosted.
    runs-on: [self-hosted, xfa-corpus]
    timeout-minutes: 60
    env:
      # The criterion baseline below is restored by cache key, and restoring it
      # is the comparison. Keyed on `runner.os` alone it hands this run whichever
      # machine last wrote that key -- the same defect as a result file that
      # named a machine it was never on (#283). The class must match the runner
      # label this job asks for, and it must have an entry in
      # benchmarks/BASELINE_HARDWARE.toml.
      BENCH_MACHINE_CLASS: xfa-corpus
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # On PRs: restore the latest master baseline so criterion can compare.
      # Cache key targets master saves; falls back to any master baseline on miss.
      - name: Restore baseline (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: target/criterion
          key: bench-baseline-${{ env.BENCH_MACHINE_CLASS }}-master-${{ github.base_sha }}
          restore-keys: |
            bench-baseline-${{ env.BENCH_MACHINE_CLASS }}-master-

      # The persistent runner hands every job the state the last one left. Clear
      # debris from an aborted build, and fail in seconds if the directory has
      # stopped answering, rather than forty minutes in. (#264)
      # Which of the three it is -- gone, dead or unwritable -- before a build
      # spends forty minutes finding out. Seven GitLab jobs already ask this;
      # these six run cargo on the same persistent machine and did not.
      - name: A mount, a dead disk and a rights problem are told apart
        run: bash scripts/ci/shared_build_dir_is_there.sh
      - name: The shared build directory is there and undamaged
        run: bash scripts/ci/cargo_target_health.sh
      - name: Run benchmarks
        run: |
          cargo bench -p pdf-bench 2>&1 | tee bench-output.txt

      # On master merges: save a new baseline keyed by SHA so the next PR always
      # gets the most recent master result.
      - name: Save baseline (master only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4
        with:
          path: target/criterion
          key: bench-baseline-${{ env.BENCH_MACHINE_CLASS }}-master-${{ github.sha }}

      # Detect >10% regressions and write a markdown table for the PR comment.
      # Criterion outputs: change: [+lo% +mid% +hi%] — we use the median (mid).
      - name: Detect regressions and generate comment
        if: github.event_name == 'pull_request'
        id: detect
        run: |
          python3 - << 'PYEOF'
          import re, sys

          regressions = []
          rows = []
          current_bench = ""

          with open("bench-output.txt") as f:
              for line in f:
                  # Capture benchmark name from lines like: "bench_name   time: ..."
                  m = re.match(r'^(\S.*?)\s{2,}time:', line)
                  if m:
                      current_bench = m.group(1).strip()

                  # Parse: change: [+X% +Y% +Z%] (p = ...)
                  c = re.search(
                      r'change:\s*\[([+-][0-9.]+%)\s+([+-][0-9.]+%)\s+([+-][0-9.]+%)\]',
                      line
                  )
                  if c and current_bench:
                      lo, mid, hi = c.group(1), c.group(2), c.group(3)
                      try:
                          pct = float(mid.rstrip('%'))
                          if pct > 10.0:
                              status = "❌"
                              regressions.append(f"`{current_bench}`: {mid}")
                          elif pct > 0:
                              status = "⚠️"
                          else:
                              status = "✅"
                          rows.append(
                              f"| `{current_bench}` | {mid} | {lo} … {hi} | {status} |"
                          )
                      except ValueError:
                          pass

          with open("bench-comment.md", "w") as f:
              if regressions:
                  f.write("## ❌ Benchmark Regressions Detected (>10%)\n\n")
                  for r in regressions:
                      f.write(f"- {r}\n")
                  f.write("\nPlease investigate before merging.\n\n")
              else:
                  f.write("## ✅ Benchmarks: No Regressions\n\n")

              if rows:
                  f.write("| Benchmark | Median change | Range | Status |\n")
                  f.write("|-----------|--------------|-------|--------|\n")
                  f.write("\n".join(rows) + "\n")
                  f.write(
                      "\n> ❌ regression >10% &nbsp; ⚠️ slower ≤10% &nbsp; ✅ improvement or neutral\n"
                  )
              else:
                  f.write(
                      "_No comparison data available (first run or no baseline found)._\n"
                  )

          if regressions:
              for r in regressions:
                  print(f"::error::Performance regression: {r}")
              sys.exit(1)
          else:
              print("No regressions >10% detected.")
          PYEOF

      # Post or update a single comment on the PR (runs even if detect step failed).
      # `continue-on-error: true` so transient GitHub API HTTP 502s on the
      # comment endpoint do not fail the whole workflow — the regression
      # signal still comes from the `detect` step's exit code, and the full
      # bench result is uploaded as an artifact below.
      - name: Comment PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('bench-comment.md')) return;
            const body = fs.readFileSync('bench-comment.md', 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('Benchmark'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: |
            target/criterion/
            bench-output.txt
          retention-days: 90
