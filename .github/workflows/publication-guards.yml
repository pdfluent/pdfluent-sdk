# The publication and licence guards, on every pull request (#232).
#
# The gap #232 names: a guard exists and nothing runs it at the moment it counts,
# with a stranger watching. Measured before this file: of the 90 gates in
# scripts/ci/local_ci_gate.sh, 13 were reachable from no pull-request workflow at
# all. The pre-push gate runs on a machine an outside contributor never touches.
#
# These eight are the ones that can run anywhere: they read files, compare
# strings and build their own fixtures. No corpus, no tokens, no warm cache.
#
# Their own workflow rather than steps in ci.yml, for the reason
# document-register.yml carries: ci.yml has a workflow-wide `paths-ignore:
# '**.md'`, and half of what these guards watch IS Markdown and TOML.
name: Publication guards

# NO PULL_REQUEST TRIGGER WHILE THIS REPOSITORY IS PRIVATE (#333).
#
# Measured 05-09-2026 08:00: the 2,000 included minutes were gone and the account
# had begun billing an Actions budget. In the fourteen hours after #328 landed,
# this repository still started about 180 hosted jobs -- almost all of them a
# guard running twice, once for the pull request and once for the push that
# followed it, on work the local pre-push gate had already refused to let out.
#
# A pull request here is not a review boundary: there is one contributor, master
# only ever receives fast-forwards of heads that already passed `scripts/ci/
# local_ci_gate.sh`, and that gate runs these same guards before the branch
# reaches the remote at all. So the second run bought nothing and was billed.
#
# THE PUBLIC PHASE, written down so this is a decision and not a habit: when
# `pdfluent/engine` (or its public successor) accepts a pull request
# from anyone but the owner, that pull request IS the review boundary, the local
# gate no longer covers it, and these triggers come back -- with the placement
# rules in orchestration_stays_hosted.py deciding where they run.
on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: publication-guards-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publication-guards:
    name: Publication and licence guards
    # Hosted, and free on a public repository. On a pull request the scripts run
    # are PR-authored code, which stays off the persistent desktop
    # (scripts/ci/pr_code_stays_off_the_desktop.py).
    # The desktop runner, plainly. The per-event expression that used to stand
    # here chose a hosted runner for a pull request; with no pull_request
    # trigger left (#333) its condition can only be true, so the expression
    # described a branch that no longer exists. An expression nobody can reach
    # reads as a rule and enforces nothing.
    #
    # Python file scans, seconds of work, no compilation. The persistent-runner
    # rule in orchestration_stays_hosted.py is about code a caller chooses --
    # a pull request's head or a dispatch ref -- and a push to master is neither:
    # it is already merged.
    runs-on: [self-hosted, xfa-fast]
    steps:
      - uses: actions/checkout@v4
        with:
          # The sweep-exemption test and the sign-off hook test build git
          # repositories and read history; a shallow clone would make them
          # measure a tree that is not the one under review.
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Two guards here parse workflow YAML, and a runner without a preinstall
      # answers a missing pyyaml with ModuleNotFoundError -- a guard that fails
      # for want of a module rather than for want of a finding.
      # `a_job_has_what_its_scripts_import.py` is what noticed.
      - run: pip install --quiet pyyaml
      # Every step runs whatever the others did. A red test must not hide a red
      # tree, and a red tree must not hide a second one.
      - name: The NOTICE guard bites in both directions
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_notice_names_what_exists.py
      - name: NOTICE matches the tree and its second copy
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/notice_names_what_exists.py
      - name: The fetched-asset guard bites in both directions
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_every_fetched_asset_is_registered.py
      - name: Every downloaded asset is registered
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/every_fetched_asset_is_registered.py
      - name: Every docs path cited from scripts/ci resolves
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/docs_references_resolve.py
      - name: The withdrawn-object guard bites in both directions
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_no_withdrawn_object.py
      - name: The sweep exemption cannot be self-granted
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_sweep_exemption.py
      - name: The sign-off hook writes what format.signoff does not
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_prepare_commit_msg_signoff.py
      - name: The reachability guard bites in both directions
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_every_gate_is_reachable_from_a_pull_request.py
      # This one asks whether every gate is reachable from a pull request, so it
      # had better be reachable from a pull request itself. It said so: the first
      # run after wiring it flagged its own two lines.
      - name: Every gate is reachable from a pull request
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/every_gate_is_reachable_from_a_pull_request.py
      - name: The public seeding removes trailers and changes no content
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_seed_public_repo.py
      # Wired 05-09-2026 (#222): booked in every_guard_has_a_job.py as "wired
      # with the other publication guards after #1543" until #1543 landed and
      # nothing wired it. It is the one guard that answers whether the tree
      # that would be published names a document we may not redistribute, and
      # it was red on master the day it was finally run.
      - name: The internal-document guard bites in both directions
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_internal_stays_internal.py
      - name: No internal path or document name reaches the published tree
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/internal_stays_internal.py
      # 154 seconds, measured: it assembles the published tree and greps it. That
      # is real but small on a hosted runner, and it is the check #222 rests on --
      # the whole point of #1696 was that nothing ran it. The build half stays out
      # of here; it is minutes and gigabytes.
      - name: The published tree names no path outside itself
        if: ${{ !cancelled() }}
        run: bash scripts/ci/public_snapshot_audit.sh
      # The API half cannot run here: reading another repository's protection
      # needs `administration:read`, which GITHUB_TOKEN cannot hold at all
      # (measured on #290, same wall every_label_has_a_runner.py hit). So this
      # runs the half that is honest on a runner -- the register against the
      # workflows in this tree -- and says so in its own output. The half that
      # reads the four repositories runs in scripts/ci/local_ci_gate.sh, where
      # `gh` has a keyring.
      - name: The protection guard bites in both directions
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_public_repos_are_protected.py
      - name: Every required check is a job a pull request here reports
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/public_repos_are_protected.py --tree-only
      # No API and no seeding: it reads this tree and docs/PUBLIC_TREE.toml, so
      # unlike the guard above it can say the whole truth on a hosted runner.
      - name: The contribution guard bites in both directions
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_public_contribution_files_are_complete.py
      - name: The files a contributor meets are present, honest, and published
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/public_contribution_files_are_complete.py
