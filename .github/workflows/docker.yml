name: Docker Image

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build multi-arch image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=sha

      - name: Build and export to Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=docker,dest=/tmp/image.tar

      - name: Load Docker image
        run: |
          docker load --input /tmp/image.tar
          docker images ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # A tag name is free text, and `github.ref_name` hands over whatever is
      # left after the prefix is stripped. A tag called `v1.2.$(id)` is a legal
      # ref, matches this workflow's tag trigger, and reaches the shell as a
      # command. Through `env:` it arrives as data. (Codex, #1540)
      - name: Inspect image
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          docker inspect "${REGISTRY}/${IMAGE_NAME}:$(echo "$REF_NAME" | sed 's/^v//')"

      - name: Test CLI
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          docker run --rm "${REGISTRY}/${IMAGE_NAME}:${REF_NAME}" --version

      - name: Test help output
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          docker run --rm "${REGISTRY}/${IMAGE_NAME}:${REF_NAME}" --help

      # Publish step (commented out - uncomment to enable)
