name: Fuzzing

on:
  schedule:
    - cron: '30 4 * * *'    # nightly smoke: build all + 60s on core targets
    - cron: '30 6 * * 0'    # weekly deep: all targets, full duration
  workflow_dispatch:
    inputs:
      duration:
        description: 'Deep-run seconds per target'
        default: '300'
        type: string
      target:
        description: 'Specific fuzz target (blank = all)'
        default: ''
        type: string

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  HCLOUD_SNAPSHOT_ID: '425004761' # xfa-golden-ci-base-v2

jobs:
  # One throwaway instance for the whole workflow. The matrix jobs below queue
  # on it one at a time instead of running in parallel on seven hosted runners:
  # slower, and free. Fuzzing was the largest single line on the Actions bill --
  # 97 minutes across nine jobs in the last 41 runs (#274).
  #
  # Orchestration sits on the desktop. A schedule always runs the workflow file
  # from the default branch, so there is no branch-chosen body here.
  create-runner:
    # Only from the default branch. A schedule always runs master's file, but a
    # dispatch lets the caller pick the ref -- and this job sits on the machine
    # with the corpus, the warm cache and the runner token. Not a boundary
    # against a hostile branch (#268), but it stops the accident.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    # Without this the create action polls for a runner that may never
    # register, holding the one desktop runner while everything else
    # queues behind it. Fifteen minutes of that is what a wedged
    # provisioning looked like (#274).
    timeout-minutes: 10
    runs-on: [self-hosted, xfa-fast]
    outputs:
      label: ${{ steps.create.outputs.label }}
      server_id: ${{ steps.create.outputs.server_id }}
    steps:
      # Forty seconds before spending anything. `cancel-in-progress` kills a
      # superseded run almost at once, so a second push inside this window
      # cancels the first one *before* it has bought a machine. Without it,
      # three pushes five minutes apart bought three instances -- and Hetzner
      # bills a started hour in full, so that is three hours for fifteen
      # minutes of work (#274).
      #
      # Forty seconds against a ten-minute build is a rounding error. Three
      # billed hours is not.
      - name: Let a newer push cancel this one before spending anything
        run: sleep 40

      - name: Create ephemeral Hetzner runner
        id: create
        uses: Cyclenerd/hcloud-github-runner@v1
        with:
          mode: create
          github_token: ${{ secrets.GH_RUNNER_PAT }}
          hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          server_type: cpx42
          location: fsn1
          image: ${{ env.HCLOUD_SNAPSHOT_ID }}

  # Bit-rot gate: every declared target must compile. Cheap, no fuzzing.
  # Runs on every trigger (nightly, weekly, manual).
  build:
    name: Build all fuzz targets
    needs: create-runner
    runs-on: ${{ needs.create-runner.outputs.label }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: Build all targets
        working-directory: fuzz
        run: cargo +nightly fuzz build

  # Nightly smoke: short run on the seven core targets to catch immediate
  # regressions quickly. Runs on the nightly schedule and on manual dispatch.
  smoke:
    name: Smoke ${{ matrix.target }}
    needs: [create-runner, build]
    if: github.event.schedule == '30 2 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ needs.create-runner.outputs.label }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_pdf_parser
          - fuzz_content_stream
          - fuzz_xref
          - fuzz_filters
          - fuzz_data_dom
          - fuzz_formcalc
          - fuzz_som_path
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: Smoke run (60s)
        working-directory: fuzz
        env:
          INPUT_TARGET: ${{ inputs.target }}
        run: |
          TARGET="$INPUT_TARGET"
          if [[ -n "$TARGET" && "$TARGET" != "${{ matrix.target }}" ]]; then
            echo "Skipping ${{ matrix.target }} (only running $TARGET)"
            exit 0
          fi
          cargo +nightly fuzz run ${{ matrix.target }} -- \
            -max_total_time=60 \
            -max_len=65536
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-smoke-crashes-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          retention-days: 30
      - name: Check for crashes
        if: always()
        run: |
          CRASH_DIR="fuzz/artifacts/${{ matrix.target }}"
          if [[ -d "$CRASH_DIR" ]] && [[ $(ls "$CRASH_DIR" 2>/dev/null | wc -l) -gt 0 ]]; then
            echo "CRASHES FOUND in ${{ matrix.target }}:"; ls -la "$CRASH_DIR"; exit 1
          fi
          echo "No crashes found in ${{ matrix.target }}"

  # Weekly deep: full-duration run over all declared targets.
  # Runs on the weekly schedule and on manual dispatch.
  deep:
    name: Deep ${{ matrix.target }}
    needs: [create-runner, build]
    if: github.event.schedule == '30 3 * * 0' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ needs.create-runner.outputs.label }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_pdf_parser
          - fuzz_content_stream
          - fuzz_xref
          - fuzz_filters
          - fuzz_data_dom
          - fuzz_formcalc
          - fuzz_som_path
          - fuzz_content_editor
          - fuzz_text_replace
          - fuzz_redact
          - fuzz_pdfa_convert
          - fuzz_lopdf_roundtrip
          - fuzz_form_fill
          - fuzz_annot_create
          - fuzz_sign
          - fuzz_pdfa_validate
          - fuzz_xfa_extract
          - fuzz_sign_document
          - fuzz_g3_content_stream
          - fuzz_xfa_template
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: Restore fuzz corpus cache
        uses: actions/cache@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_number }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-
      - name: Run fuzzer
        working-directory: fuzz
        env:
          INPUT_DURATION: ${{ inputs.duration || '300' }}
          INPUT_TARGET: ${{ inputs.target }}
        run: |
          DURATION="$INPUT_DURATION"
          TARGET="$INPUT_TARGET"
          if [[ -n "$TARGET" && "$TARGET" != "${{ matrix.target }}" ]]; then
            echo "Skipping ${{ matrix.target }} (only running $TARGET)"
            exit 0
          fi
          echo "Fuzzing ${{ matrix.target }} for ${DURATION}s..."
          cargo +nightly fuzz run ${{ matrix.target }} -- \
            -max_total_time="$DURATION" \
            -max_len=65536
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          retention-days: 30
      - name: Check for crashes
        if: always()
        run: |
          CRASH_DIR="fuzz/artifacts/${{ matrix.target }}"
          if [[ -d "$CRASH_DIR" ]] && [[ $(ls "$CRASH_DIR" 2>/dev/null | wc -l) -gt 0 ]]; then
            echo "CRASHES FOUND in ${{ matrix.target }}:"; ls -la "$CRASH_DIR"; exit 1
          fi
          echo "No crashes found in ${{ matrix.target }}"

  delete-runner:
    needs: [create-runner, build, smoke, deep]
    if: always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    # Without this the create action polls for a runner that may never
    # register, holding the one desktop runner while everything else
    # queues behind it. Fifteen minutes of that is what a wedged
    # provisioning looked like (#274).
    timeout-minutes: 10
    runs-on: [self-hosted, xfa-fast]
    steps:
      # A failed create leaves the outputs empty; a genuinely half-created
      # instance is swept by hetzner-orphan-sweep.yml.
      - name: Delete ephemeral Hetzner runner
        if: needs.create-runner.outputs.server_id != ''
        uses: Cyclenerd/hcloud-github-runner@v1
        with:
          mode: delete
          github_token: ${{ secrets.GH_RUNNER_PAT }}
          hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          name: ${{ needs.create-runner.outputs.label }}
          server_id: ${{ needs.create-runner.outputs.server_id }}
