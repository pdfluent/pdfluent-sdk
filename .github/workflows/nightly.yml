name: Nightly Corpus Test

on:
  schedule:
    # Weekly Sunday at 02:00 UTC (was: '0 2 * * *' daily — CI-COST-06).
    - cron: '0 2 * * 0'
  workflow_dispatch:

env:
  HCLOUD_SNAPSHOT_ID: '425004761' # xfa-golden-ci-base-v2
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # One throwaway instance for this workflow. The jobs below queue on it rather
  # than spreading across hosted runners: free, and a cpx42 has eight cores
  # against a hosted runner's two to four. Orchestration sits on the desktop,
  # which costs nothing (#274).
  create-runner:
    # Only from the default branch: a dispatch can choose the ref, and this
    # job sits on the machine with the corpus and the runner token (#268).
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    # Without this the create action polls for a runner that may never
    # register, holding the one desktop runner while everything else
    # queues behind it. Fifteen minutes of that is what a wedged
    # provisioning looked like (#274).
    timeout-minutes: 10
    runs-on: [self-hosted, xfa-fast]
    outputs:
      label: ${{ steps.create.outputs.label }}
      server_id: ${{ steps.create.outputs.server_id }}
    steps:
      # Forty seconds before spending anything. `cancel-in-progress` kills a
      # superseded run almost at once, so a second push inside this window
      # cancels the first one *before* it has bought a machine. Without it,
      # three pushes five minutes apart bought three instances -- and Hetzner
      # bills a started hour in full, so that is three hours for fifteen
      # minutes of work (#274).
      #
      # Forty seconds against a ten-minute build is a rounding error. Three
      # billed hours is not.
      - name: Let a newer push cancel this one before spending anything
        run: sleep 40

      - name: Create ephemeral Hetzner runner
        id: create
        uses: Cyclenerd/hcloud-github-runner@v1
        with:
          mode: create
          github_token: ${{ secrets.GH_RUNNER_PAT }}
          hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          server_type: cx53
          location: fsn1
          image: ${{ env.HCLOUD_SNAPSHOT_ID }}

  full-corpus-test:
    needs: create-runner
    name: Full Corpus Test Suite
    runs-on: ${{ needs.create-runner.outputs.label }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build all binaries
        run: cargo build --release --workspace

      - name: Run all tests
        run: cargo test --release --workspace

      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Set up Java (for veraPDF oracle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Was `|| true`, followed by putting /opt/verapdf on PATH whether or not
      # anything had landed there and calling the oracle "optional". A tool that
      # is optional is not an oracle; the run downstream then measures whatever
      # its absence happens to look like. The installer verifies the binary
      # answers with the pinned version, and stops if it does not.
      - name: Install veraPDF
        run: |
          bash scripts/ci/install_verapdf.sh /opt/verapdf
          echo "/opt/verapdf" >> "$GITHUB_PATH"

      - name: Run corpus tests (extended matrix)
        run: |
          if [[ -d corpus/ ]] && [[ $(find corpus/ -name '*.pdf' 2>/dev/null | head -1) ]]; then
            ./target/release/xfa-test-runner run \
              --corpus corpus/ \
              --db /tmp/nightly-results.sqlite \
              --workers 2 \
              --timeout 15 \
              --tier full

            # Check for crashes.
            CRASHES=$(sqlite3 /tmp/nightly-results.sqlite \
              "SELECT COUNT(*) FROM test_results WHERE status='crash'" 2>/dev/null || echo "0")
            echo "Crashes: ${CRASHES}"
            if [ "${CRASHES}" -gt 0 ]; then
              echo "REGRESSION: ${CRASHES} crashes detected"
              ./target/release/xfa-test-runner clusters --db /tmp/nightly-results.sqlite || true
              exit 1
            fi

            # Report pass rate.
            TOTAL=$(sqlite3 /tmp/nightly-results.sqlite \
              "SELECT COUNT(*) FROM test_results")
            PASS=$(sqlite3 /tmp/nightly-results.sqlite \
              "SELECT COUNT(*) FROM test_results WHERE status='pass'")
            echo "Pass rate: ${PASS}/${TOTAL}"
          else
            echo "No corpus PDFs found, skipping"
          fi

      - name: Upload corpus results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-corpus-results
          path: /tmp/nightly-results.sqlite
          retention-days: 30
          if-no-files-found: ignore

      - name: Run accuracy report
        run: |
          if [[ -d corpus/ ]] && [[ $(ls corpus/*.pdf 2>/dev/null | wc -l) -gt 0 ]]; then
            mkdir -p reports/accuracy
            cargo run --release --bin accuracy-report -- \
              --corpus corpus \
              --output reports/accuracy/report.json \
              --html
          else
            echo "No corpus PDFs found, skipping accuracy report"
          fi

      - name: Upload accuracy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-accuracy-report
          path: reports/accuracy/
          retention-days: 30
          if-no-files-found: ignore

  benchmarks:
    needs: create-runner
    name: Nightly Benchmarks
    runs-on: ${{ needs.create-runner.outputs.label }}
    env:
      # This job runs on a fresh instance every night, and the step below
      # restores criterion's previous run to compare against. Keyed on
      # `runner.os` that comparison crossed machines silently: last night's
      # numbers came from a different box, so a real regression could clear and
      # a stable build could look regressed (#283). Must match the server_type
      # `create-runner` provisions, and have an entry in
      # benchmarks/BASELINE_HARDWARE.toml.
      BENCH_MACHINE_CLASS: hetzner-cx53
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Restore baseline
        uses: actions/cache@v4
        with:
          path: target/criterion
          key: bench-nightly-${{ env.BENCH_MACHINE_CLASS }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            bench-nightly-${{ env.BENCH_MACHINE_CLASS }}-

      - name: Run benchmarks
        run: |
          cargo bench --package pdf-bench 2>&1 | tee reports/bench-results.txt || true

      - name: Check for regressions
        run: |
          if grep -q "regressed" reports/bench-results.txt 2>/dev/null; then
            echo "WARNING: benchmark regressions detected"
            grep -A2 "regressed" reports/bench-results.txt
          else
            echo "No benchmark regressions"
          fi

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-benchmark-results
          path: |
            reports/bench-results.txt
            target/criterion/
          retention-days: 30
          if-no-files-found: ignore

  desktop-tests:
    needs: create-runner
    name: Nightly Desktop Tests
    runs-on: ${{ needs.create-runner.outputs.label }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Backend tests
        run: cargo test --package pdf-desktop

      - name: Frontend tests
        run: |
          cd crates/pdf-desktop
          npm install
          npx vitest run

  conversion-tests:
    needs: create-runner
    name: Nightly Conversion Quality Tests
    runs-on: ${{ needs.create-runner.outputs.label }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Run conversion tests
        run: |
          cargo test --package pdf-docx
          cargo test --package pdf-xlsx
          cargo test --package pdf-pptx

  # The blocking half of scripts/ci/pr_staleness.py, which until now was a
  # promise. On a pull request the guard reports and returns 0, because one stale
  # branch would otherwise stop every merge including the ones that would clear
  # the backlog -- and its message said "the scheduled run fails on these" while
  # no scheduled run ran it. `return 1` was unreachable code and the sentence was
  # about something that did not exist. (T1 review of #1679)
  #
  # This is that run: weekly, Sunday 02:00 UTC, where failing costs nobody their
  # afternoon.
  #
  # On the desktop rather than the ephemeral instance, and with no `needs`. The
  # instance carries cargo and rustc, not `gh`, and this asks GitHub about pull
  # requests -- it has nothing to do with the corpus and should still run on a
  # night the instance fails to come up. `schedule` is one of the two events
  # orchestration_stays_hosted.py allows on the persistent runner, because the
  # body comes from master and not from a caller's ref.
  #
  # If `gh` is absent or unauthenticated there, this job goes red quoting gh's
  # own line rather than passing: not being able to look at the queue is the
  # state the guard exists to refuse.
  stale-pull-requests:
    name: No pull request has been left to rot (blocking)
    # Pinned to the default branch, because this workflow is dispatchable and
    # this job runs code from the checkout. `gh workflow run --ref <branch>`
    # would otherwise put a branch's version of pr_staleness.py on the machine
    # that holds the corpus, the warm cache and the runner token, with GH_TOKEN
    # in its environment. A dispatch from a feature branch now skips this job
    # entirely; the weekly schedule runs on master, where there is no unmerged
    # code to carry.
    #
    # scripts/ci/orchestration_stays_hosted.py refused this job without the pin,
    # which is how the line got here rather than by anyone remembering.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, xfa-fast]
    steps:
      - uses: actions/checkout@v4
      - name: Stale pull requests fail the weekly run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_STALENESS_BLOCKING: '1'
        run: python3 scripts/ci/pr_staleness.py

  delete-runner:
    # Two jobs left this list, both behind `if: false`, both measuring nothing
    # while reading as coverage.
    #
    # `visual-regression` went with avrt.yml on 31-08-2026: the gold masters it
    # compares against have never existed on any branch. What is missing there
    # is the capability, not the job -- we have no visual regression testing at
    # all, which is #293, and it says what each of the three ways to get it
    # costs.
    #
    # `conformance` goes with this change. It ran the veraPDF wrapper on the
    # same five input fixtures as the workflow this PR removes, with the same
    # `--profile 2b` that made veraPDF print its usage text instead of a
    # verdict. Its replacement grades our own PDF/A output on the pipeline that
    # blocks a merge (#286).
    #
    # Do not re-add either before its issue is decided. A parked job is how the
    # first one stayed invisible for four months (#290).
    needs: [create-runner, full-corpus-test, benchmarks, desktop-tests, conversion-tests]
    if: always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    # Without this the create action polls for a runner that may never
    # register, holding the one desktop runner while everything else
    # queues behind it. Fifteen minutes of that is what a wedged
    # provisioning looked like (#274).
    timeout-minutes: 10
    runs-on: [self-hosted, xfa-fast]
    steps:
      - name: Delete ephemeral Hetzner runner
        if: needs.create-runner.outputs.server_id != ''
        uses: Cyclenerd/hcloud-github-runner@v1
        with:
          mode: delete
          github_token: ${ secrets.GH_RUNNER_PAT }
          hcloud_token: ${ secrets.HCLOUD_TOKEN }
          name: ${ needs.create-runner.outputs.label }
          server_id: ${ needs.create-runner.outputs.server_id }
