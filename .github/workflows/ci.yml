name: CI

# M8-CLEANUP-04 (#1380): only the cheap PR sanity gate runs here.
# Expensive validation (wasm, bindings, desktop, conversion, corpus
# regression) runs off-CI on ephemeral Hetzner runners or a VPS/local
# box via `scripts/validate-expensive.sh`. A manual fallback workflow
# lives at `.github/workflows/expensive-validation.yml`
# (workflow_dispatch only, not required for merge).
#
# check/test/clippy/fmt run on the self-hosted `xfa-fast` runner (the
# desktop) ONLY on push to master — the workspace outgrew the
# ~$0.05/push estimate #1380 was written against, and self-hosted
# minutes are free regardless of duration. artifact-guard/
# license-metadata-guard stay on ubuntu-latest — no compilation,
# near-zero cost either way.
#
# On pull_request nothing here touches the persistent desktop. xfa-fast is a
# desktop, not an isolated ephemeral runner, so a PR's build scripts, proc-macros
# -- or simply the scripts/ci/*.py these jobs execute out of the checkout --
# would run as the runner user with host access. Only merged code (push) reaches
# it.
#
# That was written as a comment first and drifted: by 02-09-2026 every job in
# this file was self-hosted on both events, including the five guard jobs, while
# this header still claimed two were hosted. A workflow added the day before
# inherited the mistake by copying `runs-on` from a neighbour.
#
# So it is a guard now, not a description: scripts/ci/pr_code_stays_off_the_desktop.py
# fails on any pull_request-reachable job that asks for a self-hosted runner
# unconditionally, and its register of exceptions is empty. Do not restate the
# rule below this line -- a second description is a second thing that can drift.
#
# ci-ephemeral.yml's create-runner and reap are the exception that proves it:
# they must run ON the desktop, because creating and reaping instances is host
# work. They pin the base revision on a pull_request instead, so the code they
# execute is merged code even though the machine is the desktop.
#
# See `docs/ci-cost-control.md` for the full rationale.
#
# pdf-desktop is excluded from check/test/clippy because it pulls in
# Tauri/GTK system libs (glib-2.0, gtk-3, webkit2gtk, …) that are not
# installed on github-hosted runners; desktop validation also runs
# off-CI per the policy above.

# NO PULL_REQUEST TRIGGER WHILE THIS REPOSITORY IS PRIVATE (#333).
#
# Measured 05-09-2026 08:00: the 2,000 included minutes were gone and the account
# had begun billing an Actions budget. In the fourteen hours after #328 landed,
# this repository still started about 180 hosted jobs -- almost all of them a
# guard running twice, once for the pull request and once for the push that
# followed it, on work the local pre-push gate had already refused to let out.
#
# A pull request here is not a review boundary: there is one contributor, master
# only ever receives fast-forwards of heads that already passed `scripts/ci/
# local_ci_gate.sh`, and that gate runs these same guards before the branch
# reaches the remote at all. So the second run bought nothing and was billed.
#
# THE PUBLIC PHASE, written down so this is a decision and not a habit: when
# `pdfluent/engine` (or its public successor) accepts a pull request
# from anyone but the owner, that pull request IS the review boundary, the local
# gate no longer covers it, and these triggers come back -- with the placement
# rules in orchestration_stays_hosted.py deciding where they run.
on:
  push:
    branches: [master]

concurrency:
  # ONE RUN PER REF, AND THE NEWEST COMMIT WINS (#350).
  #
  # This block said the opposite until 06-09-2026, for a reason worth keeping in
  # view: on master every ref is the same ref, so each merge cancelled the
  # previous merge's run. Measured 02-09-2026 over the last 30 runs against
  # master: 10 cancelled, 4 failed, 0 succeeded, a run taking 246-1320 s, and 6
  # of the last 11 merges arriving inside 1320 s of the one before. A merge's
  # result was observed only when nobody merged for the length of a run.
  #
  # Giving every push its own group answered that by never cancelling, and the
  # bill arrived four days later: forty to ninety landings a day, one desktop
  # runner, and on 06-09 twenty-nine runs queued at once with the oldest commit
  # under test two hours old. Both shapes lose the same thing -- a per-commit
  # verdict -- and only one of them also blocks the machine.
  #
  # What replaces the per-commit verdict is the two-hourly wave in
  # ci-ephemeral.yml: the whole workspace, on a bought-and-thrown-away instance,
  # against whatever master is at the time. This job is then the fast signal
  # about the newest commit, which is the one anybody would act on anyway.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Incremental state is a cache that only pays back across edits by a person,
  # and CI never edits twice. What it does instead is take up room and break:
  # the 25-08 failure was `failed to move dependency graph from
  # dep-graph.part.bin`, half-written state from a job that had been killed, and
  # it read as a broken crate. Measured 31-08-2026: 23 GB of incremental across
  # four checkouts, on a machine whose real headroom was 9.4 GB. (#264)
  CARGO_INCREMENTAL: 0

jobs:
  guards:
    name: The light guards, in one job
    # Eight jobs became three on 04-09-2026, because eight jobs cost eight
    # checkouts, eight Python setups and eight minimum-minute roundings for work
    # that is seconds of file scanning. Measured on one real pull_request run:
    # step durations of 8s, 10s, 13s, 17s, 21s, 29s, 45s and 48s, billed as
    # eight minutes. The account was at 90% of its hosted minutes with 200+ such
    # runs since 01-09. (#328)
    #
    # WHY MERGING DOES NOT REINTRODUCE #283
    #
    # `baseline-hardware-guard` used to say, right here, that it was its own job
    # so as not to be "two more steps on orchestration-guard" -- that job aborted
    # at step two for thirty runs and left thirty-five guards installed and not
    # executing. That hazard is real and it is now answered per step instead of
    # per job: every guard step below carries `if: ${{ !cancelled() }}`, so a
    # failure stops nothing after it. 116 of the 134 steps in this file already
    # had that condition before the merge; the two that did not were the two
    # baseline steps, and they have it now.
    #
    # The setup steps deliberately do NOT carry it. A checkout or a pip install
    # that fails should stop the job: every guard after it would report on a
    # tree that is not there.
    #
    # WHY TWO GUARDS ARE NOT IN HERE
    #
    # `orchestration-guard` and `commit-identity-guard` are separate jobs
    # because scripts/cos/ff3.sh -- the landing script -- used to filter them
    # BY NAME as permanently red. #592 made the three red steps of the first
    # green for their real reasons (an interpreter that could not start, a
    # remote read by its Mac name, 34 deletions that could never be declared)
    # and took the exclusion out of ff3.sh, so a red in either now blocks a
    # landing like any other. Merging them in is a separate change.
    # The desktop runner, plainly. The per-event expression that used to stand
    # here chose a hosted runner for a pull request; with no pull_request
    # trigger left (#333) its condition can only be true, so the expression
    # described a branch that no longer exists. An expression nobody can reach
    # reads as a rule and enforces nothing.
    #
    # Python file scans, seconds of work, no compilation. The persistent-runner
    # rule in orchestration_stays_hosted.py is about code a caller chooses --
    # a pull request's head or a dispatch ref -- and a push to master is neither:
    # it is already merged.
    runs-on: [self-hosted, xfa-local-checks]
    permissions:
      contents: read
    steps:
      # One checkout for all of them, with full history: two of the merged
      # guards diff the branch against master and report SKIPPED on a shallow
      # clone, which is a guard reporting without measuring (#290).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pyyaml
      - name: No workflow can restore automatic paid provisioning
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/paid_compute_policy.py
      - name: Paid-compute lock rejects missing permission and unsafe workflow mutations
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_paid_compute_policy.py
      - name: Development scope defers only unrelated infrastructure regressions
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_development_gate_scope.py
      - name: A failed remote lane names every gate it failed
        if: ${{ !cancelled() }}
        run: bash scripts/ci/test_the_failed_gates_are_named.sh
      - name: Rig pages are refused off the round machine
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_rig_data_stays_on_the_rig.py
      - name: A failing gate run names what failed, whole, even across a poll
        if: ${{ !cancelled() }}
        run: bash scripts/ci/test_a_failed_run_names_its_gates.sh
      - name: The landing lane runs the snapshot path audit
        if: ${{ !cancelled() }}
        run: bash scripts/ci/test_the_landing_runs_the_snapshot_audit.sh
      # A red audit must name its finding where the log readers look: the
      # gate prints the last fifteen lines and the failed-gates block the
      # first lines saying fail, and the verdict said neither (#636).
      - name: A red snapshot audit names its finding on its last line
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_public_snapshot_check.py
      - name: The landing skips only the script tests a change cannot reach
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_landing_test_scope.py
      - name: No sort comparator in the engine decides equality by a tolerance
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/a_sort_comparator_is_a_total_order.py
      - name: The comparator guard refuses a tolerance and nothing else
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_a_sort_comparator_is_a_total_order.py
      - name: Unchanged automatic waves cannot buy another instance
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_wave_needs_instance.py
      # ---- from baseline-hardware-guard ----
      - name: Every baseline names the machine it came from
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/a_baseline_names_the_machine.py
      - name: The baseline-hardware guard still bites
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_a_baseline_names_the_machine.py
      # The other half of the same rule: a baseline names its machine, and a
      # figure published from one names its run (#169).
      - name: Every published figure names the run it came from
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/a_published_number_names_its_run.py
      - name: The published-figure guard still bites
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_a_published_number_names_its_run.py
      # The improvement loop (#366). The ratchet itself needs the corpus,
      # veraPDF and mutool, so it runs on the wave; its comparison is the half
      # that can go wrong in silence, and that half is fixture-driven and takes
      # a second. Two guards that have never been red have never been tested.
      - name: A quality baseline goes down only with a ticket and a reason
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/loop/a_baseline_only_moves_with_a_ticket.py
      - name: The baseline guard still refuses a number lowered in silence
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/loop/test_a_baseline_only_moves_with_a_ticket.py
      - name: A quality baseline is not older than the code it measures
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/loop/a_baseline_is_not_older_than_what_it_measures.py
      - name: The age guard still goes red on a baseline left behind
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/loop/test_a_baseline_is_not_older_than_what_it_measures.py
      - name: The baseline builder writes a reason where a value moved down
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/loop/test_build_extraction_baseline.py
      - name: The PDF/A ratchet still goes red on each of the four axes
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/loop/test_pdfa_ratchet.py
      # ---- from licence-registry-guard ----
      - name: Every crate's licence matches the canonical register
        if: ${{ !cancelled() }}
        run: python3 scripts/release/license_registry_check.py

      # ---- from promise-guard ----
      # THE STEP IS A FILE NOW (#516). Two jobs beside this one needed cargo
      # and did not have it -- `public-snapshot-build` here, and every run of
      # publication-guards.yml since 09-09 -- while this block got it right in
      # one job. A step that has to be repeated is a step that will be repeated
      # incompletely, so it moved to scripts/ci/cargo_on_path.sh and all three
      # call it.
      - name: Cargo on PATH
        if: ${{ !cancelled() }}
        run: bash scripts/ci/cargo_on_path.sh
      # EVERY GENERATED REGISTER IN ONE QUESTION (#526), and after the step
      # above because the capability register runs `cargo metadata` -- which the
      # guard from #516 said, since nothing in this step's own line says the
      # word. The three `--check` gates further down and the NOTICE copy, asked
      # together so a stale one is named with the others and with the command
      # that writes them all, rather than one gate run at a time.
      - name: Every generated register is current
        if: ${{ !cancelled() }}
        run: bash scripts/ci/regenerate_registers.sh --check
      # Next to its subject: on 11-10 a refused sccache wrapper failed the
      # capability register inside that script and the run still ended exit 0.
      # The test drives stub generators through both modes; milliseconds, no
      # cargo, and it never touches the real registers.
      - name: A failing register generator fails loudly
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_regenerate_registers.py
      # Here rather than with the other guard steps, because it asks
      # `cargo package --list` for all 32 publishable crates and this is the
      # job that has cargo on PATH. It is minutes rather than seconds, which is
      # why the pre-push gate defers it to the landing lane -- but a pull
      # request from outside never runs that lane, and this is the guard that
      # would have stopped the 1.0.0 publish before the first upload (#358).
      - name: No published file names an internal path
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/a_published_file_names_no_internal_path.py
      # In promise-guard because it is the job that already has cargo on PATH,
      # and DEBUG rather than --release: measured profile-independent, the
      # generator produces the same 1090 bytes either way, and debug shares
      # whatever this job has already built.
      #
      # It was briefly in bindings.yml, which builds for the Java binding this
      # fixture belongs to -- and which runs only on `push: tags`. That made the
      # guard release-time-only: drift between generator and committed file
      # would have been caught after the merge, in the publication run. I checked
      # whether that job builds and not whether it RUNS, which is the question I
      # have asked of every other guard this week. (T1 review, #1654)
      # Only when the two things it compares can have moved.
      #
      # This job goes to a hosted runner for pull requests (below), so the step
      # would otherwise be a cold debug build of pdf-manip on every PR to compare
      # 1090 bytes. The guard asks one question: do the committed bytes still
      # match what the generator produces. If neither the generator nor the
      # committed file is in the diff, the answer cannot have changed, and
      # rebuilding to re-confirm it is paying for a fact already established.
      #
      # `dorny/paths-filter` rather than a workflow-level `paths:` because this
      # is one step in a job that must keep running for everything else it does.
      # (T1 review, #1649)
      - name: Did the fixture or its generator move?
        id: fixture-diff
        if: ${{ !cancelled() }}
        # Through `env:`, not interpolated into the script. A `${{ }}` expansion
        # is textual, so a caller-supplied value becomes part of the program
        # rather than an argument to it. Both are shas today, which is why this
        # read as harmless -- and harmless-today is what the guard checks the
        # shape instead of.
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          BASE="$PR_BASE"
          if [ -z "$BASE" ]; then BASE="$PUSH_BEFORE"; fi
          case "$BASE" in ""|0000000000000000000000000000000000000000)
              echo "moved=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          git cat-file -e "$BASE^{commit}" 2>/dev/null || git fetch -q origin "$BASE"
          # Everything the generated bytes can depend on, not only the three
          # files the guard names. The generator writes a PDF through lopdf, so
          # a change to serialisation there moves the output while none of the
          # three has moved -- the check would report moved=false and sleep
          # through exactly the change that breaks it. Manifests and the lock
          # file are here for the same reason: a version bump changes the
          # writer. (codex, #1649)
          # `--quiet` and its exit code, NOT a pipe into grep. Under `pipefail`,
          # `git diff --name-only ... | grep -q .` fails the whole pipeline with
          # 141 as soon as grep stops reading and git takes SIGPIPE -- which is
          # what happens when there are MANY matches, e.g. a bulk edit under
          # crates/lopdf/. The `else` branch then wrote moved=false and skipped
          # the fixture check precisely when the input it guards had changed
          # most. A detector whose failure mode is "too much evidence" is not a
          # detector. (codex, #1649)
          #
          # `git diff --quiet` exits 0 for no change, 1 for a change and 2 on
          # error, so anything that is not a clean "nothing moved" runs the
          # guard. It fails towards checking.
          if git diff --quiet "$BASE"..HEAD -- \
               crates/pdf-manip/examples/java_binding_fixture.rs \
               crates/pdf-java/src/test/resources/binding-fixture.pdf \
               scripts/ci/the_java_fixture_is_the_one_we_generate.py \
               crates/lopdf/ \
               crates/pdf-manip/Cargo.toml \
               crates/pdf-java/Cargo.toml \
               Cargo.toml Cargo.lock; then
            echo "moved=false" >> "$GITHUB_OUTPUT"
          else
            echo "moved=true" >> "$GITHUB_OUTPUT"
          fi
      - name: The Java binding fixture is the one we generate
        if: ${{ !cancelled() && steps.fixture-diff.outputs.moved == 'true' }}
        run: python3 scripts/ci/the_java_fixture_is_the_one_we_generate.py
      # The known-images fixture the four binding suites read: the generator
      # writes it byte-identically twice in a row, and the committed outputs
      # match a fresh generation. Stdlib only, no engine, so it runs here on
      # every push rather than scoped below with the suites that read it.
      - name: The known-images fixture is what its generator writes
        if: ${{ !cancelled() }}
        run: python3 fixtures/gen/test_known_images.py
      # The published npm package, type-checked the way a consumer gets it:
      # packed, installed, and compiled under node16 (ESM and CJS) and bundler,
      # then read by attw. The strict-ts example had run none of this since the
      # beta -- it resolved the package through a tsconfig `paths` entry, which
      # never touches the `exports` map, and nothing in any workflow ran it. On
      # 22-09-2026 it produced twelve type errors and the package was
      # masquerading as CJS for every ESM consumer (#585). This is the slowest
      # step in this job (three npm installs); it is also the only thing that
      # reads what we actually publish.
      - name: The published Node types resolve under every module resolution
        if: ${{ !cancelled() }}
        run: bash scripts/ci/node_types_gate.sh
      # The types gate reads declarations only; it cannot see that index.mjs
      # never re-exported TextEditor (#585). The static half of the Node suites
      # can, and node-bindings.yml runs them only on a tag. Here they run on
      # every push without the native addon: the static tests assert, the
      # addon-dependent suites announce "SKIPPED (not a pass)" on stderr.
      - name: The Node entry points export the same surface
        if: ${{ !cancelled() }}
        working-directory: crates/pdf-node
        run: npx --yes jest@30.3.0 --ci tests/
      # Which exported symbols does no test call? A floor, not a percentage:
      # 191 of 249 is not 100, and a soft job at that number is one everybody
      # scrolls past -- so the floor passes at today's count and fails on a drop.
      - name: Every exported symbol a test calls, still called
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/api_coverage.py
      # And the matcher it reads the tree with. A ratchet on a wrong reading is
      # worse than no ratchet: it lowers a floor on an invented gap, or lets a
      # real one through. Three readings were wrong on 10-09-2026 and nothing
      # said so, because this job is hosted and hosted Actions had been stopped
      # for five days (#333, #510).
      - name: The coverage matcher reads exports and calls correctly
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_api_coverage.py
      # The product question rather than the binding one: does every capability
      # the website and the editor advertise map to a test, and is it reachable
      # from the pdfluent facade at all? OCR, Excel and PowerPoint each had tests
      # in a crate the facade did not depend on.
      - name: Every advertised capability has a test and a route to it
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/feature_promises.py
      # Three hand-written descriptions of what this codebase can do were four
      # months stale at the same time, and each still read as authoritative.
      - name: The capability register matches the code
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/capability_register.py --check
      # A conformance level we say we produce, with nothing that has ever
      # measured it, is a claim rather than a capability. 2b was measured; 1b
      # and 3b were advertised in the C header and on the website. (#443)
      - name: Every PDF/A flavour we claim to produce has a baseline
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/ci/test_a_pdfa_flavour_has_a_baseline.py
          python3 scripts/ci/a_pdfa_flavour_has_a_baseline.py
          python3 scripts/ci/test_pdfa_conformance_gate.py
      # crates/pdf-python sits outside the workspace on purpose; a second
      # Cargo.lock drifting on its own was never the decision. It had 35 packages
      # pinned older than the workspace.
      - name: The Python binding resolves the versions we ship
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/lockfile_agreement.py
      # A ratchet in both directions: a new public function without a test turns
      # it red, and so does one that gains coverage without the file shrinking.
      - name: Test reachability has not slipped
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_reachability.py --check
      - name: The reachability guard can still tell delegation apart
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_reachability_unit.py

  # The offline half of the corpus gates. The measurements themselves need the
  # corpus machine and stay on the mirror with their reason in
  # scripts/ci/mirror_only_guards.toml -- but the arithmetic, the argument
  # handling and the reporting are plain Python, and those are where the two
  # failures in #286 actually lived.
      # ---- from measurement-guard ----
      - name: No test bails out in silence
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_skip_lint.py
      # And the guard on that guard. It decided whether a block was a bail-out
      # by looking for the word `return`, so a macro that returns for you was
      # invisible to it -- read as "not a bail-out" rather than as "announces
      # nothing". A lint that has stopped looking reports exactly what a clean
      # tree reports.
      - name: The skip lint reads a bail-out a macro performs
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_the_skip_lint_reads_a_returning_macro.py
      # And JavaScript (#588). The lint read Rust only, so the Node suites
      # skipped in silence until #585 repaired them by hand. The third fixture
      # is the one that matters: an announcement through console.error must be
      # reported, because jest prints no console output for a skipped suite.
      - name: The skip lint reads JavaScript and is not fooled by console output
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_the_skip_lint_reads_javascript.py
      # The tool a person runs before starting a story. It cannot run as a job
      # -- see its ALLOWED entry -- but the three answers it has to keep apart
      # ("nothing is open", "nothing matches", "I could not look") are ordinary
      # Python and are tested here over a fake `gh`.
      - name: Does this already exist keeps its three answers apart
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_does_this_already_exist.py
      # LC7: the fork line a Rust reader actually sees. The guard reads the
      # provenance table rather than a list of its own, so a new fork turns it
      # red without anybody remembering to update it; its test proves that a
      # mention below the fold is not enough, which is the whole of #219.
      - name: Every forked crate names its upstream in its README
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/every_fork_names_its_upstream.py
      - name: The fork-notice guard bites, and above the fold
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_every_fork_names_its_upstream.py
      # LC5: the divergence measurement. The measurement itself needs a 900 MB
      # clone of upstream and runs by hand; what runs here is the half that can
      # be wrong in silence -- no clone reported as no divergence, a guessed
      # fork point reported as a measured one, an empty table reported as a
      # clean one.
      - name: The divergence measurement says when it did not measure
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_fork_divergence.py
      # The tracker guard's own test, over a repository and a `gh` built in a
      # temporary directory. The guard itself cannot run here -- it needs a
      # tracker token and this repository's history -- and stands in the local
      # gate; what runs here is the case that looks right: a real commit, in the
      # repository, that master never took.
      - name: A closed story is told from a sha master never took
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_a_closed_story_names_a_landed_sha.py
      # Same family, one layer down: `timeout 30 ... || true` threw the exit
      # code away, so a render the timeout killed -- which writes nothing to
      # stderr -- was scored as a clean page by the crash guard.
      - name: A hang is a crash, not a clean render
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_classify_render_outcome.py
      # Counting characters scored a wrecked document at 80.1%: every letter had
      # become an 'x'. This measure counts which of the source's words come back.
      - name: Text retention is measured in words, not characters
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_text_fidelity.py
      # A print function that quietly does nothing leaves the gate saying OK with
      # no figure at all -- and the figure then gets fetched by hand from
      # somewhere else, which is how a wrong one stays on a website for months.
      - name: The retention gate still prints its distribution
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_retention_report.py
      # The extraction rig grades us against two foreign readers, and the ways it
      # could report a comfortable number while being wrong are all arithmetic:
      # a length ratio calls substituted text perfect, an empty oracle scores
      # 100, and a corpus whose buckets overlap excludes documents twice. The
      # corpus run itself needs 500 documents and a release build and lives in
      # the wave; this is the half that runs in a second (#367).
      - name: The extraction axes measure what they claim
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_extraction_axes.py
      # The competitor comparison on the same rig (#390). A table of six tools
      # is wrong in a way no column is wrong on its own: measured on different
      # documents, or on a machine that was busy for one of them. This reads the
      # run files the round left behind and regenerates the document list.
      - name: The extraction comparison is reproducible
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_extraction_comparison.py
      # A ratchet that has never been red has never been tested. Four deliberate
      # single-document regressions, one per axis, plus the rule that a wall
      # clock is only comparable between two quiet runs (STRATEGY_2026H2 4.4.6).
      - name: The extraction ratchet goes red on each of its four axes
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/loop/extraction_ratchet.py --self-test
      # #286: measured.json wrote "govdocs (fixed 300-document sample)" while
      # sample_size said 1000. A conformance figure has to name the sample it
      # came from, and the two gates have to be tellable apart.
      - name: A conformance figure names the sample it came from
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_pdfa_gate_label.py
      # The corpus job handed the text-replacement gate an argument it did not
      # have. It failed on argument parsing in under a second, for months, and
      # the measurement it exists to produce had therefore never run.
      - name: The text-replacement gate accepts what its job passes
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_text_replace_gate.py
      # A cache in front of a validator is the one place where fast quietly turns
      # into wrong, so these check that it declines to answer far more often than
      # that it answers quickly.
      - name: The veraPDF verdict cache declines when it should
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_verapdf_cached.py
      # The corpus disk threw read errors for five hours while its mount stayed
      # in place. `test -d` passed on a cached dentry, and a corpus job ran 68
      # minutes without a line of output.
      - name: The corpus preflight can tell a dead disk from a missing one
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_corpus_preflight.py
      - name: The test fixtures are still well formed
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_fixtures_are_wellformed.py

      # The golden set is 2.4 GB on the runner's own disk and, until 07-09-2026,
      # nowhere else -- while the disk that held the working corpus had already
      # died. The backup is a directory that goes on a stick; what makes it a
      # backup is that a restore refuses to finish until every file has been read
      # back. This runs that argument on a small tree: a backup, a restore, and
      # the ways a backup lies. (#374)
      - name: A backup of the golden set can be turned back into the golden set
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_restore_golden.py

      # And the other half of the same promise: the part of the corpus that is
      # not curated has to come back from the bucket on the machine that needs
      # it. Measured 07-09-2026 it could not -- the fetcher went through the
      # AWS CLI and the runner has none, so a corpus that was reproducible on
      # paper had never once been reproduced. (#374)
      - name: The corpus can be fetched by a machine with no AWS CLI
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_corpus_download_govdocs.py

      # The backup of this repository is kept by an hourly agent on one Mac.
      # A scheduled job that stops looks exactly like one with nothing to do --
      # the previous cron stopped on 02-09-2026 and the mirror was 348 commits
      # behind before anybody noticed (#231). The guard itself judges only the
      # machine that has the agent; this runs its test, which is hermetic.
      - name: Unloading the mirror agent turns something red
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_the_mirror_agent_is_running.py

      # Where the code lives. The guard itself asks this machine which
      # repository `origin` resolves to and how many checkouts of it are on the
      # disk -- neither is expressible in a workspace with one remote and one
      # checkout, so it runs in the local gate's full lane. What runs here is its
      # test, on throwaway repositories, which is where the four refusals and the
      # worktree exemption are held. (#291)
      - name: origin means the source, and one checkout per repository
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_origin_is_the_source_in_every_checkout.py

      # ---- from message-guard-wiring ----
      - name: The commit-msg hook exists and calls both message guards
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/the_commit_msg_hook_is_wired.py --alleen-boom
      - name: The hook guard's layers are told apart
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_the_commit_msg_hook_is_wired.py
      # The guard itself is machine-local (a checkout here has one worktree and
      # never has core.hooksPath set), so what runs on a pull request is its
      # test, which builds its own clone with a second worktree and an override.
      - name: A worktree that runs somebody else's hooks is found
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_every_worktree_runs_the_tracked_hooks.py
      # The pre-push hook is not reachable from a pull request -- it runs on a
      # developer's machine or nowhere -- so what can be judged here is that its
      # lane choice and its two refusals still behave. The test runs the hook
      # itself against fabricated stdin rather than reading it for strings.
      - name: The pre-push hook picks its lane and names its refusals
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_the_pre_push_gate_picks_its_lane.py
      # The crate selection the landing lane rests on (#343). Both halves are
      # here rather than in the pre-push gate alone, for the reason the line
      # above them is: a stranger's pull request must be able to reach the check
      # that decides how little their landing will compile. Neither needs a
      # compiler -- one builds fabricated workspaces in a temporary directory,
      # the other reads three shell scripts.
      - name: The crate selection picks what a landing touches, and its dependents
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_touched_crates.py
      - name: The crates the scoped lane leaves out are the ones CI excludes
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/touched_crates.py --check-excludes
      # Two guards whose GUARD cannot run on a pull request but whose TEST can,
      # the same shape as the pre-push line above. `every_label_has_a_runner.py`
      # needs a PAT nobody has issued (see the note in orchestration-guard) and
      # `register_exemption` reads a push range that a pull request does not
      # have; both are excused in
      # docs/GATES_REACHABLE_FROM_A_PULL_REQUEST.toml. Their fixture tests need
      # nothing but Python, so leaving them pre-push-only left the mechanism
      # uncovered for exactly the outside contributor #232 is about.
      - name: The runner-label guard's own test
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_every_label_has_a_runner.py
      - name: The register-exemption guard's own test
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_register_exemption.py
      # Wired into the pre-push gate on master as "the guard runs where its
      # owner asked it to". Both need nothing but Python and the tree, so the
      # pull request is where an outside contributor meets them.
      - name: Every diagnostic code is documented
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/every_diagnostic_code_is_documented.py
      - name: The diagnostic-catalogue guard bites
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_every_diagnostic_code_is_documented.py
      # Three package managers describe one desktop release, each carrying the
      # version, the URL and the checksum in its own spelling. A manifest left
      # at the previous release does not fail here; it fails on a stranger's
      # machine, or it installs the old build and reports the new version.
      - name: Every package manifest names the same release
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/every_package_manifest_names_the_same_release.py
      - name: The packaging guard bites
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_every_package_manifest_names_the_same_release.py
      # The same five channels, one question further out (#205): the guard
      # above says which release each registry page describes, this says
      # whether the page tells a visitor where the source is. Tree-only, no
      # network, so it can answer in full on a hosted runner.
      - name: Every registry page names the repository
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/every_registry_readme_names_the_repository.py
      - name: The registry-README guard bites in both directions
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_every_registry_readme_names_the_repository.py
      # And what those pages say (#358): a figure in a README carries a claim
      # ID, no README sells the withdrawn licence model, and the licence is
      # stated as AGPL-3.0 or a commercial licence. Tree-only, no network.
      - name: Every README figure carries a claim ID
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/a_readme_figure_carries_a_claim_id.py
      - name: The README-claims guard bites in both directions
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_a_readme_figure_carries_a_claim_id.py
      # Structured extraction ships as Preview in 1.1.0 (#636): the label
      # sentence sits on every structured entry point and on none of the
      # plain-text ones. Tree-only, no network.
      - name: Structured extraction carries the Preview label
        if: ${{ !cancelled() }}
        run: python3 scripts/release/extraction_preview_label.py
      - name: No commit carries AI attribution
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/no_ai_attribution.py
      - name: The attribution guard bites in both directions
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_no_ai_attribution.py
      # A message cannot be excluded by a manifest the way a file can, so this
      # is the last point before the messages are published.
      # Master's, kept: my rebase resolution dropped it, and
      # every_guard_has_a_job named it within the minute. A guard nothing runs
      # is a comment, and a rebase is exactly where one goes missing without a
      # line being deleted on purpose.
      - name: A hit does not publish the term it found
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_een_treffer_publiceert_de_term_niet.py
      # A list line is text unless it carries a backslash. Compiling every line
      # as a pattern was invisible while the list held names and stopped being
      # invisible when #222 put key material on it: one line raised, and the
      # others would silently have matched nothing.
      - name: A term list line is text, not a pattern
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_the_term_list_is_literal.py
      # The range selection of the internal-matter guard lives with the other
      # message-guard tests, NOT inside internal-matter-guard: that job holds a
      # secret and runs exactly one step of its own, so nothing that a pull
      # request controls runs before it (#1660).
      - name: The range selection answers or refuses
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_internal_matter_range.py


      # ---- from internal-matter-guard ----
      - name: No commit message names an internal matter
        if: ${{ !cancelled() }}
        env:
          TERMEN: ${{ secrets.PDFLUENT_INTERNE_TERMEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -uo pipefail
          LIJST="$RUNNER_TEMP/interne-termen.txt"
          trap 'rm -f "$LIJST" "$LIJST.raw"' EXIT
          # Masking FIRST, and PER LINE. `::add-mask::` is line-oriented: given a
          # multi-line value it masks line 1 and prints the rest as ordinary log
          # lines. The list is one term per line by design, so the normal case
          # would have published every partner name but the first.
          # `\r` and stray spaces are not part of a term, and masking is exact:
          # a list saved with CRLF would have masked "acme\r" while the guard
          # matched "acme". Trimmed before masking and before writing.
          printf '%s\n' "$TERMEN" | tr -d '\r' > "$LIJST.raw"
          while IFS= read -r term; do
            term="$(printf '%s' "$term" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            if [ -n "$term" ]; then echo "::add-mask::$term"; fi
          done < "$LIJST.raw"
          sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' "$LIJST.raw" > "$LIJST"
          WACHT="scripts/ci/geen_interne_zaken.py"
          if [ -n "${BASE_SHA:-}" ]; then
            mkdir -p "$RUNNER_TEMP/base"
            git archive "$BASE_SHA" scripts/ci | tar -x -C "$RUNNER_TEMP/base"
            WACHT="$RUNNER_TEMP/base/scripts/ci/geen_interne_zaken.py"
            echo "guard taken from base revision ${BASE_SHA}"
          fi
          # Belt and braces even in a clean job: an absolute interpreter and an
          # emptied PYTHONPATH, so neither PATH nor the import path can be
          # steered by anything that ran before.
          PY=$(command -v python3)
          case "$PY" in /*) ;; *) echo "::error::python3 is not an absolute path"; exit 1 ;; esac
          # Which commits this run vouches for is decided by
          # internal_matter_range.sh (pull_request: the branch; push: what the
          # push added; anything else: not a pass). Until 02-09-2026 that was
          # an inline `origin/master..HEAD` for every event, which on a push to
          # master is empty -- the guard refused it, correctly, and this job was
          # red on every master push from the day it landed (6f656f6d,
          # 59fea093). On a pull request the selection, like the guard, is
          # taken from the base revision, so a pull request cannot pick its
          # own range. Its test runs as the step before this one.
          KEUZE="scripts/ci/internal_matter_range.sh"
          if [ -n "${BASE_SHA:-}" ]; then KEUZE="$RUNNER_TEMP/base/scripts/ci/internal_matter_range.sh"; fi
          BEREIK="$(sh "$KEUZE")" || exit 1
          PYTHONPATH= PDFLUENT_INTERNE_TERMEN="$LIJST" "$PY" "$WACHT" --bereik "$BEREIK"
      # The semver gate itself runs only before a publish, on rustdoc JSON
      # from the pinned nightly against the v1.0.0 baseline -- nothing a push
      # can carry. Its mechanism is covered here instead, over canned JSON
      # pairs: a new sealed or allowlisted enum passes, a new exhaustive one
      # fails with its path, and an unknown format_version is SKIPPED, never
      # guessed at. (#574)
      - name: A new public enum fails unless it is sealed or allowlisted
        if: ${{ !cancelled() }}
        run: bash scripts/ci/test_check_new_public_enums.sh
      # The feature pass of the same check, over a fake crate: a new
      # exhaustive enum behind a feature is flagged in the feature run and
      # not in the default run, with a HEAD-only feature enabled on HEAD
      # only. The first cases need no toolchain; the end-to-end cases need
      # the pinned nightly and skip loudly without it. (#636)
      - name: A new enum behind a feature is flagged in the feature run only
        if: ${{ !cancelled() }}
        run: bash scripts/ci/test_feature_gated_enums.sh
      # The gate selects crates by "published at v1.0.0", never by their
      # current version: selecting on "is 1.0.0 today" checks nothing once
      # the workspace moves to 1.1.0. A fixture repo carrying the tag, no
      # toolchain. (#574)
      - name: The semver gate selects crates by what v1.0.0 shipped
        if: ${{ !cancelled() }}
        run: bash scripts/ci/test_semver_gate_selection.sh
      # The clean-room scanner's own tests, hermetic: each case plants one
      # violation shape in a scratch tree and asserts the scan names it, or
      # plants a clean tree and asserts silence. Every case fails when the
      # scanner rule it covers is removed. (#643)
      - name: The clean-room scanner names every planted violation
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_cleanroom_scan.py
      # The compat tooling's unit tests: usage tiers merge, coverage
      # arithmetic, usage measurement and spec validation. Standalone,
      # stdlib only. (#643)
      - name: The compat usage tiers merge and check
        if: ${{ !cancelled() }}
        run: python3 scripts/compat/test_apply_usage.py
      - name: The compat coverage arithmetic holds
        if: ${{ !cancelled() }}
        run: python3 scripts/compat/test_coverage.py
      - name: The compat usage measurement holds
        if: ${{ !cancelled() }}
        run: python3 scripts/compat/test_usage_measure.py
      - name: The compat spec validation holds
        if: ${{ !cancelled() }}
        run: python3 scripts/compat/test_validate_spec.py
      # The differential harness's own tests: verdicts, tolerances and the
      # KNOWN_RED judge, over canned data. The full `check` against the
      # tree wheel is not wired: five tests/parity fixtures it reads were
      # removed with the parity suite and it exits 1 without them. (#643)
      - name: The compat harness judges its canned verdicts
        if: ${{ !cancelled() }}
        run: python3 tests/compat/test_self.py
      # The SVG rasteriser is a test tool only: neither a shipped manifest
      # nor a shipped source may name it. (#643)
      - name: No shipped manifest names the SVG rasteriser
        if: ${{ !cancelled() }}
        run: python3 tests/compat/no_cairosvg_in_shipped_manifests.py
      - name: No shipped source imports the SVG rasteriser
        if: ${{ !cancelled() }}
        run: python3 tests/compat/no_cairo_in_shipped_sources.py

  orchestration-guard:
    name: No ref-dispatchable job on the persistent runner
    # The repository's default workflow token is "read", which grants
    # `contents` and `packages` and nothing else -- `actions: read` is not in
    # it. Two guards in this job need it: the never-green one reads run
    # history, and pr_staleness.py reads pull requests. Without this block they
    # get a 403 and announce SKIPPED (not a pass) on a green step, which is a
    # guard that reports without measuring (#290). A job-level block replaces
    # the default rather than adding to it, so `contents: read` is listed too
    # or actions/checkout stops working.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    # The desktop runner, plainly. The per-event expression that used to stand
    # here chose a hosted runner for a pull request; with no pull_request
    # trigger left (#333) its condition can only be true, so the expression
    # described a branch that no longer exists. An expression nobody can reach
    # reads as a rule and enforces nothing.
    #
    # Python file scans, seconds of work, no compilation. The persistent-runner
    # rule in orchestration_stays_hosted.py is about code a caller chooses --
    # a pull request's head or a dispatch ref -- and a push to master is neither:
    # it is already merged.
    runs-on: [self-hosted, xfa-local-checks]
    steps:
      # Full history, because half of what this job checks needs a base to
      # compare against. `territories_do_not_overlap` diffs the branch against
      # master to see which files it touched; on the depth-1 checkout that
      # actions/checkout makes by default there is no master to diff against, so
      # it printed "SKIPPED (not a pass): could not diff against master" and
      # exited 3. CI therefore caught an overlap in the map and never once
      # caught a cross-territory change -- the half that is about the branch in
      # front of it. Proven on this pull request's own run. The fork guards
      # already deepen for the same reason further down this file; this job
      # needed it too. (peer review, #1636)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # python-docx, python-pptx and openpyxl feed the Office truth tool's
      # controlled-set generator further down; setup belongs above every guard.
      - run: pip install --quiet pyyaml python-docx python-pptx openpyxl
      - name: Guards do not hide behind each other
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/guards_do_not_hide_behind_each_other.py
      - name: The disk-headroom guard still bites
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_disk_headroom.py
      - name: Enough disk to finish a build
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/disk_headroom.py
      # A cancelled host's address gets reassigned, and a script that keeps it
      # does not break -- it connects to whoever holds it next. (#261 family)
      - name: No connecting script carries a literal address
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/no_dead_host_in_a_connecting_script.py
      - name: The dead-host guard refuses an address and lets a version pin pass
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_no_dead_host_in_a_connecting_script.py
      # A Windows checkout writes every tracked symlink as a text file holding
      # the link target -- four fixture links broke 63 node smokes this way.
      - name: No tracked file is a symlink
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/no_tracked_symlinks.py
      - name: The symlink guard bites on a link and passes a clean tree
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_no_tracked_symlinks.py
      # And one address in particular, anywhere at all -- comments included.
      # It was released and reissued, so those four octets name a stranger's
      # machine, and a comment is where the next person copies one from (#424).
      - name: The released VPS address is nowhere in the tree
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/no_retired_host.py
      - name: And the guard that says so catches what it claims to
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_no_retired_host.py
      # Rig page text never goes into the repo: a committed run file keeps
      # per-page scores + hashed page ids only, no snippets, no filenames.
      - name: No committed run file carries rig text or a public filename
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/no_rig_text_in_runs.py
      - name: The rig-text guard bites on text and passes scores
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_no_rig_text_in_runs.py
      - name: One owner per path, and branches stay inside their own
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/territories_do_not_overlap.py
      - name: Every job installs what its scripts import
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/a_job_has_what_its_scripts_import.py
      - name: The territory guard reaches its own verdict
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_territories_do_not_overlap.py
      - name: Every job runs at least one command
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/every_job_does_something.py
      - name: The hollow-job guard bites
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_every_job_does_something.py
      # Only GitLab ran these, and GitLab is the mirror -- a red job there stops
      # nothing. The machine both pipelines share is the one whose build
      # directory keeps going away, so the verdict drifted unwatched on the side
      # that actually blocks a merge. (#264)
      - name: A mount, a dead disk and a rights problem are told apart
        if: ${{ !cancelled() }}
        run: bash scripts/ci/test_desktop_env.sh
      - name: A damaged shared build directory heals instead of failing the next job
        if: ${{ !cancelled() }}
        run: bash scripts/ci/test_cargo_target_health.sh
      # Two dummy gates on a private lock directory, so this says nothing about
      # and does nothing to the runner's own gate lock. (#359)
      - name: Two local gates queue instead of thrashing the machine
        if: ${{ !cancelled() }}
        run: bash scripts/ci/test_one_gate_at_a_time.sh
      # The blob guard's own boundary, which it had no test for until the rule
      # refused a round's evidence: generated code over a megabyte is caught
      # wherever it is, a measured round's run files are not caught on size, and
      # nothing is exempt from the extension check. (#574, #599)
      - name: The blob guard catches generated code and not measured evidence
        if: ${{ !cancelled() }}
        run: bash scripts/ci/test_check_large_blobs.sh
      # A fake hcloud and a fake ssh, so this buys nothing and reads no token.
      # What it proves is that every exit path of the throwaway-instance gate
      # deletes the instance -- the one defect whose cost grows by the hour
      # rather than showing up as a red build. (#474)
      - name: A gate run always deletes the instance it bought
        if: ${{ !cancelled() }}
        run: bash scripts/ci/test_remote_gate.sh
      # The other half of the same bill: the EUR 30 ceiling the owner approved
      # for throwaway instances, and the ledger it is read from. A fake hcloud
      # and a fake actions API, so this buys nothing and reads no token. (#490)
      - name: A gate refuses to buy past the ceiling, and books what it bought
        if: ${{ !cancelled() }}
        run: bash scripts/ci/test_hetzner_ledger.sh
      # Twice a fixture has booked machines that never existed into the
      # operator's ledger, and the second time it took the day over its cap and
