        if: always()
        run: python3 scripts/ci/wasm_bundle_calls_no_panicking_std.py
      - name: The wasm std guard refuses what the Rust test refuses
        if: always()
        run: python3 scripts/ci/test_wasm_bundle_calls_no_panicking_std.py
      # The structured-extraction baseline of #566, in the half that runs in a
      # second. The five axes are arithmetic and every one of them can be wrong
      # while looking comfortable -- a reader that infers a heading from a short
      # line reports a capability we do not ship, and a TEDS that normalises by
      # the ground truth alone lets a tool emit the table twice.
      - name: The structured axes measure what they claim
        if: always()
        run: python3 scripts/extraction/structured_axes.py --self-test
      # The Office ground-truth reader (O2) reproduces its controlled set
      # exactly; the Office libraries feed the generator only.
      - name: The Office truth tool reproduces the controlled set
        if: ${{ !cancelled() }}
        run: python3 scripts/office_bench/test_truth.py
      # The Docling Office job (O4) is pinned, default-optioned and reads its
      # corpus from the metadata; a file scan, no compilation.
      - name: The Docling Office startup job is pinned and default
        if: ${{ !cancelled() }}
        run: python3 scripts/gcp/test_docling_office_startup.py
      # The zero-shot local smoke (J3f): the pre-launch step that runs each
      # model's real load()+predict() on dev tables on this machine, after
      # the TATR L4 run billed 41 minutes before dying in preprocessing.
      # Its suite mocks the adapter both ways: a raise fails naming the
      # model, a table passes, an empty decode fails.
      - name: The zero-shot smoke fails loud and passes on a table
        if: ${{ !cancelled() }}
        run: python3 scripts/gcp/test_smoke_zeroshot_local.py
      # Track B on ParseBench as a round add-on (T5): the gates, guards,
      # page lists and replace step. No torch, no binaries, no network --
      # the shell runs against fixture manifests and every refusal lands
      # before the venvs exist.
      - name: The track-B ParseBench add-on refuses and replaces rightly
        if: ${{ !cancelled() }}
        run: python3 scripts/extraction/tables_b/test_pb_round_addon.py
      # GCE runs startup scripts as root with no HOME, under `set -u`: the
      # track-A train ended after three minutes on `HOME: unbound variable`
      # (03-10). A file scan over every scripts/gcp/*startup*.sh.
      - name: Every startup script sets HOME before its first use
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/every_startup_script_sets_home.py
      - name: The startup-HOME guard refuses a use before the set
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_every_startup_script_sets_home.py
      # The second set's ground truth is a grid rather than a box (#575), and
      # the translation from its cells to the HTML a TEDS axis reads is the
      # one place a table can silently come out of the annotation wrongly.
      - name: The table set's cells come out as the grid they describe
        if: always()
        run: python3 scripts/extraction/pubtables_cells.py --self-test
      # The FinTabNet lane (#574) splits by company and reads IBM's archive by
      # HTTP Range: the rule that puts every company on one side, frozen with
      # its 41, and the reader that refuses a wrong CRC32, a wrong LICENSE or
      # a provenance mismatch instead of grading a tool on the wrong page.
      - name: Every FinTabNet company lands on exactly one side of the split
        if: always()
        run: python3 scripts/ci/test_fintabnet_split.py
      - name: No FinTabNet train/tuning draw holds an eval-overlap page
        if: always()
        run: python3 scripts/ci/test_fintabnet_eval_overlap.py
      - name: The FinTabNet archive reads by range and refuses loudly
        if: always()
        run: python3 scripts/extraction/fintabnet_archive.py --self-test
      # And the protocol around them: that a set or a tool whose licence says no
      # cannot be measured by passing a flag. #566 asked for two that are
      # refused, which is exactly how a register stops being read.
      - name: The structured baseline obeys its registers
        if: always()
        run: python3 scripts/ci/loop/structured_bench.py --self-test
      - name: The run carries the order provenance per page
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/loop/test_structured_bench_order_provenance.py
      - name: FinTabNet draws a pinned list and a failed read fails the run
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/loop/test_structured_bench_fintabnet_pinned.py
      - name: A pinned FinTabNet page is identified by its bytes, not re-aligned
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/loop/test_structured_bench_fintabnet_norealign.py
      - name: FinTabNet reads the GCS mirror without leaking its URL
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/loop/test_structured_bench_fintabnet_mirror.py
      - name: The structured bench refuses a missing tool instead of an empty column
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/loop/test_structured_bench_missing_tools.py
      - name: Our columns checkpoint per page and per document, and reuse byte-identical
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/loop/test_structured_bench_checkpoint.py
      # The post-AC round died of SIGPIPE in balanced_timing (08-10): the
      # function-level red below and the whole-script dry run beside it.
      - name: The round timing survives its 50-page cut without SIGPIPE
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/loop/test_structured_bench_remote_sigpipe.py
      - name: The whole remote round dry-runs green with every stub
        if: ${{ !cancelled() }}
        run: bash scripts/ci/loop/round_dryrun.sh
      # Rig page text never goes into the repo: the stripper maps every public
      # page and document name to its hash and drops the snippets, and the
      # gate reads the stripped shelf the same way.
      - name: The run-text stripper keeps its mapping rules
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/loop/strip_run_text.py --self-test
      - name: Stripping a run removes text and keeps every score
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/loop/test_strip_run_text.py
      - name: The ParseBench round headlines one canonical summary and refuses timeouts
        if: ${{ !cancelled() }}
        run: python3 scripts/extraction/parsebench_round.py --self-test
      - name: The ParseBench summary is survivor-only and joins on test_id
        if: ${{ !cancelled() }}
        run: python3 scripts/extraction/pb_summary.py --self-test
      - name: The structured holdout is the set its rule draws
        if: always()
        run: python3 scripts/ci/the_structured_holdout_is_the_drawn_set.py
      - name: That guard is red on every way the structured seal can be spoiled
        if: always()
        run: python3 scripts/ci/test_the_structured_holdout_is_the_drawn_set.py
      # FinTabNet's first draw (T6, #574): fintabnet seals on the rig under
      # its own seed while the guard still reads only sealed sets.
      - name: The first FinTabNet draw can happen on the rig
        if: always()
        run: python3 scripts/ci/test_structured_first_draw.py
      # The parity gate of #575. Parity with Docling is the condition for the
      # stable label (owner 06-10-2026: 1.1.0 ships it as preview), so what a
      # lane holds is the ratchet: a committed run worse than the one before
      # it is red here rather than a comment somebody may or may not act on.
      - name: The newest structured run is at least the last committed one
        if: always()
        run: python3 scripts/ci/loop/structured_parity.py --check
      - name: The parity gate is red on every way it could be got past
        if: always()
        run: python3 scripts/ci/test_structured_parity.py
      # The gate's own arithmetic, which no lane ran until #580: the three
      # readings of a moving denominator, the speed ceiling and the resolution
      # floor under the ratchet are asserted in `--self-test`, and a rule whose
      # test nothing runs is a rule that drifts.
      - name: The parity arithmetic says what it claims
        if: always()
        run: python3 scripts/ci/loop/structured_parity.py --self-test
      # The preview publish gate (owner 06-10-2026, #574): `--release` prints
      # parity under a PREVIEW header and exits on the ratchet, `--stable`
      # holds parity for the label, and no publish path calls that spelling.
      - name: The preview gate publishes on the ratchet and holds parity for stable
        if: always()
        run: python3 scripts/ci/test_structured_preview_gate.py
      # The public benchmark page (#631) comes out of the run files with one
      # command; what can be wrong without a round is the generator: that it
      # reads master's newest round, carries a claim and a run id per table, and
      # refuses to ship a number that is empty, unclaimed or from an older day.
      - name: The benchmark page refuses an empty, unclaimed or stale number
        if: always()
        run: python3 scripts/extraction/benchmark_page.py --self-test
      - name: the two coordinate frames convert one way
        if: ${{ !cancelled() }}
        run: python3 scripts/extraction/frames.py --self-test
      # The paired numbers behind A35-A40 come from paired.py: the rescoring
      # check reproduces the writer's round(mean, 6) before its 3-decimal
      # comparison and still refuses a +0.0004 shift; verdict() gives GO only
      # when the 95% low bound is above MARGIN 0.05.
      - name: The paired numbers refuse a shifted mean and grade at the margin
        if: always()
        run: python3 scripts/extraction/test_paired.py
      # The Office corpus collector (#636) plans federal + public-domain only,
      # caps per organisation and host, verifies the magic before it writes
      # the manifest, and splits odd sha tuning. Canned records, no network.
      - name: The office collector plans, verifies and splits what it claims
        if: ${{ !cancelled() }}
        run: python3 scripts/office_bench/test_collect.py
      - name: No pull request has been left to rot
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/pr_staleness.py
      - name: The staleness guard quotes gh's own words when it cannot look
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_pr_staleness.py
      - name: The sweep spares the instance this run claimed
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_sweep_spares_the_claimed_instance.py
      - name: Reaping runs after the work, never inside provisioning
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/reaping_happens_after_the_work.py
      # The guard first, then its own test -- a guard whose parser stopped
      # understanding the files reports a clean tree in exactly the same words.
      - name: The guard that reads run-blocks still reads them
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_workflow_inputs_are_not_shell.py
      - name: No caller-supplied string reaches a shell
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/workflow_inputs_are_not_shell.py
      - name: Cross targets land on the pinned toolchain
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/wasm_target_matches_the_pin.py
      - name: Parsers still read their runners' output
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_tests_actually_ran.py
      # The pdfluent binary takeover (#636): internal scripts name xfa-runner,
      # the release gate checks the staged package, and the GitLab lane ships
      # the public CLI. Needs nothing but Python and bash.
      - name: The binary takeover left no internal consumer behind
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_cli_takeover_wiring.py
      # Costs nothing -- it drives the gate's verdict with numbers, no veraPDF
      # and no corpus -- so the cheap job can vouch for the expensive one. The
      # first case is the report `verapdf.yml` published on #1543: five
      # documents, nothing compliant, and a green tick over it (#286).
      - name: A 0% conformance report cannot be green
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_pdfa_output_conformance_gate.py
      - name: Check for committed .so / .pyd / .node / .wasm artifacts
        if: ${{ !cancelled() }}
        run: |
            FOUND=$(git ls-files \
              '*.so' '*.pyd' '*.node' \
              'crates/xfa-wasm/pkg/*.js' \
              'crates/xfa-wasm/pkg/*.wasm' \
              'crates/xfa-wasm/pkg/*.d.ts' \
              2>/dev/null)
            if [ -n "$FOUND" ]; then
              echo "ERROR: committed build artifact(s) found — remove them and add to .gitignore:"
              echo "$FOUND"
              exit 1
            fi
            echo "OK: no compiled build artifacts found in the repository."
      # The test first, then the guard: a guard whose parser stopped recognising
      # jobs reports a clean tree in exactly the same words as a clean tree.
      - name: The guard on the guards still bites
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_every_guard_has_a_job.py
      - name: Every guard has a job, and it is not only on the mirror
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/every_guard_has_a_job.py
      - name: The requirements preflight covers every gate and goes red per kind
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_gate_preflight.py
      # Build 6 reddened Windows on CRLF goldens: the serializers produce LF
      # and the tests compare byte-for-byte, so the golden dirs check out LF.
      - name: The byte-compared golden dirs check out LF
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/golden_dirs_check_out_lf.py
      # The musl CRT split (P0): -crt-static rides only the cdylibs, never the
      # whole musl target — the config form dynamically linked the musl CLI.
      - name: The musl CRT flag rides only the cdylibs
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_musl_crt_split.py
      # The release remap block is computed from the builder's own paths, not
      # one Mac's — helper output over fake runner envs plus the workflow
      # shape that sources it.
      - name: The release builds scrub the runner's own paths
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_release_rustflags.py
      # The shipped natives name no build host: the checker over fixtures
      # (a leaking native and wheel must fail) plus the release gates and
      # build-wheels legs that run it.
      - name: No shipped native embeds its build host's paths
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_binary_host_paths.py
      # The same rules over the Rust sources, so a literal that only one
      # target compiles (the 1.1.0 Windows-only file-URL message) fails here,
      # on every runner, before any release leg builds that target.
      - name: No shipped Rust literal reads as a build host's path
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/release/test_source_literals_name_no_host_path.py
          python3 scripts/release/source_literals_name_no_host_path.py
      # The artefact gate judges every native on its own: per-native size,
      # kind/arch/libc off the bytes, mac wheels plus abi3, one table, licences.
      - name: Every artefact covers every platform, judged per native
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_artifacts_cover_every_platform.py
      - name: The licence audit requires both halves of the dual licence
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_license_audit.py
      - name: The stagers never stage a host build under a named platform
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_stage_natives_have_no_host_fallback.py
      - name: The smokes test exactly the given artefact
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_smoke_runner_requires_artifact.py
      - name: The npm publish is manual, gated, and builds all seven targets
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_node_bindings_publish_gate.py
      - name: The wasm publish is manual and gated
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_wasm_publish_gate.py
      - name: The binary release is manual and gated
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_release_binaries_gate.py
      - name: Every publish section requires the gate and the smoke runner
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_runbook_publish_gates.py
      - name: The smokes refuse typos and foreign platforms
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_smoke_args_and_platform.py
      # NuGet keys its global packages folder by id and version: a smoke that
      # restored there reused an earlier run's PDFluent.<version>, never the
      # nupkg under test.
      - name: The .NET smoke restores into its own packages dir
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_smoke_dotnet_packages_dir.py
      - name: Release downloads retry the network and verify the artefact
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_fetch_artefact.py
      - name: The guard job runs no build
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_orchestration_guard_runs_no_build.py
      # The NativeLoader test compiles Java, so it needs a JDK and the JNA
      # jar on the runner: without either it skips as SKIPPED (not a pass),
      # which is the right answer on a Mac without a JDK and the wrong one
      # here. The step runs in the release lane, so a provisioning failure
      # goes red instead of SKIPPED-green. The JNA version is read off
      # bindings/java/pom.xml, so a bump there moves this fetch with it.
      - name: Set up JDK
        if: ${{ !cancelled() }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch the JNA jar the NativeLoader test compiles against
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          JNA_VER="$(python3 - <<'PY'
          import re, sys
          text = open('bindings/java/pom.xml').read()
          m = re.search(r"<artifactId>jna</artifactId>\s*<version>([^<]+)</version>", text)
          sys.stdout.write(m.group(1))
          PY
          )"
          DEST="$HOME/.m2/repository/net/java/dev/jna/jna/$JNA_VER"
          mkdir -p "$DEST"
          curl -fsSL -o "$DEST/jna-$JNA_VER.jar" \
            "https://repo1.maven.org/maven2/net/java/dev/jna/jna/$JNA_VER/jna-$JNA_VER.jar"
          test -s "$DEST/jna-$JNA_VER.jar" && echo "JNA $JNA_VER ready under ~/.m2"
      - name: NativeLoader reads musl off the JVM's own interpreter
        if: ${{ !cancelled() }}
        env:
          PDFLUENT_RELEASE_LANE: '1'
        run: python3 scripts/release/test_native_loader_musl.py
      - name: The Java sources stay compilable under source 11
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_java_stays_source11.py
      - name: The build lane gates complete sets or says partial
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_build_all_platforms.py
      - name: Every napi build line passes only flags the pinned CLI lists
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_napi_build_flags.py
      - name: The linux-gnu Node bindings need no glibc above 2.17
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_node_glibc_floor.py
      - name: The wheel scrub leaves no build-host path in the SBOM
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_scrub_wheel.py
      - name: No reserved word as a parameter in the Node typings
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/node_typings_have_no_reserved_parameter.py
      - name: The CLI crates.io gate holds the manifest
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_cli_cratesio_gate.py
      - name: The release Dockerfile stays glibc-free and static
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_cli_dockerfile.py
      - name: The Homebrew formula renders off the sums
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_render_homebrew_formula.py
      - name: The CLI smoke refuses a missing binary
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_smoke_cli.py
      - name: The consumer smokes pass only flags the CLI lists
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_smoke_cli_surface.py
      - name: The binary smoke reads flat and top-dir archives
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_smoke_binary_layout.py
      - name: The archive builder derives its triples and refuses dynamic musl
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_cli_build_archives.py
      - name: The sdist builder refuses the maturin that panics on this layout
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_build_pdfluent_sdist.py
      - name: Every workflow builds Python with the measured maturin
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_python_build_pin.py
      - name: The C API collector assembles the judged dir and seven tarballs
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_collect_capi_release.py
      - name: package_cabi.sh cuts one tarball per platform from a prebuilt lib
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_package_cabi.py
      - name: The ORT pin table stages five verified runtime libraries
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_fetch_ort_libs.py
      - name: The GCS model weights stage verified, or refuse
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_stage_models.py
      - name: The release workflows ship the ort variant on all targets
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_release_ort_variant.py
      # 16-10 win-x64: "file://" glued to a Git Bash path gave file:///c/...,
      # which the native CLI read as \c\... on the current drive.
      - name: The ort smoke hands the native CLI a file URL it can read
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_smoke_file_url.py
      # The win-x64 release smoke refused a correct models-v1 release: Git for
      # Windows' autocrlf checked the pinned licence texts out CRLF. Proven
      # both ways on an autocrlf clone, offline.
      - name: The release texts pinned to tree bytes check out LF on every OS
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_pinned_texts_check_out_lf.py
      - name: The publish order puts every dependency before its dependent
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_publish_order.py
      - name: Release-smoke packages a crate with its workspace dependencies
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_package_with_workspace_deps.py
      - name: The package audit judges what the packages carry
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_audit_all_packages.py
      - name: release-natives.yml builds the gate's seven platforms, every channel
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_release_natives_matrix_matches_the_gate.py
      - name: release-natives.yml smokes the artefacts on all seven platforms
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_release_smoke_matrix_matches_the_gate.py
      - name: No workflow schedules a retired runner label
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_no_retired_runner_labels.py
      - name: The release path never forgives an unbuilt platform
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_release_path_never_allows_missing.py
      - name: The consistency gate knows which crates are new
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_check_release_consistency.py
      - name: The release workflows route through the runner pool
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_release_workflows_route_through_runner_pool.py
      - name: No bash step on a Windows leg runs under the default shell
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_release_windows_steps_run_under_bash.py
      - name: No Windows-reachable bash step calls a bare python3
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_release_windows_python_resolves_its_interpreter.py
      - name: No release step reaches for gh or pipes into a quiet grep
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_release_steps_use_no_gh.py
      - name: Every package name the release workflows look up exists
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_release_package_names_exist.py
      - name: Self-hosted runs never publish
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_self_runs_never_publish.py
      - name: A release run shows every error, not the first
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_release_runs_show_every_error.py
      - name: The runner scripts pass shellcheck
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_runner_scripts_pass_shellcheck.py
      - name: The self-hosted setup keeps present tools
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_selfhosted_setup_keep_checks.py
      - name: The node tarball install lands once and keeps it
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_selfhosted_node_install.py
      # The extract-js suite installs the tree-built binding with its own
      # binary beside it: the tarball excludes the .node and the =1.1.0
      # platform packages are unpublished, so the registry would hand back
      # the 1.0.0 binary instead of the tree's (#636).
      - name: The extract-js suite tests the tree build, not the registry
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_run_extract_js_tests.py
      - name: The self-hosted python runs from a versioned venv
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_selfhosted_python_venv.py
      - name: The macOS runner starts native with its own tool tree
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_mac_runner.py
      - name: The Darwin setup pins both-arch tools under PDFLUENT_TOOLS
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_selfhosted_setup_darwin.py
      - name: The Rosetta wrapper runs the x64 side or refuses
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_rosetta_x64.py
      - name: The runner dry run prints its flags
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_gcp_runner_dry_run.py
      - name: The setup action resolves its scripts from the repo root
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_setup_action_resolves_its_scripts.py
      - name: Runner down deregisters the GitHub runner
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_gcp_runner_down_deregisters.py
      - name: The Windows setup works on a bare windows-2022 VM
        if: ${{ !cancelled() }}
        run: python3 scripts/release/test_selfhosted_setup_ps1.py
      # The PDF-header routing test is hermetic (engine stubbed): fast, always.
      - name: PDF header routing in the first 1024 bytes
        if: ${{ !cancelled() }}
        run: python3 integrations/pdfluent-extract/tests/test_pdf_header_routing.py
      # The compiling suites moved to binding-suites.yml, dispatch-only:
      # this job is seconds of file scanning, no compilation.
      # Test first, then the guard, for the reason above.
      - name: The caller-grants guard still catches a missing scope
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_a_caller_grants_what_it_calls.py
      - name: A job that calls a workflow grants what that workflow asks for
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/a_caller_grants_what_it_calls.py
      # Test first, then the guard, for the reason above.
      - name: The one-source-render guard still catches a second call
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_the_wave_renders_the_source_once.py
      - name: A job renders the corpus for the page eval once
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/the_wave_renders_the_source_once.py
      - name: The mirror pipeline still parses
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/ci_config_lint.py
      - name: The branch-without-a-request guard still counts
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_branches_have_a_merge_request.py
      - name: Verify commercial packages declare correct license
        if: ${{ !cancelled() }}
        run: |
            FAIL=0
            for PKG in \
              crates/xfa-wasm/pkg/package.json \
              crates/pdf-node/package.json; do
              if [ -f "$PKG" ]; then
                LICENSE=$(python3 -c "import json; print(json.load(open('$PKG')).get('license',''))")
                if [ "$LICENSE" = "MIT" ] || [ "$LICENSE" = "Apache-2.0" ] || [ "$LICENSE" = "MIT OR Apache-2.0" ]; then
                  echo "ERROR: $PKG has permissive license '$LICENSE' — must be PDFluent Commercial License"
                  FAIL=1
                else
                  echo "OK: $PKG license = '$LICENSE'"
                fi
              fi
            done
            if [ "$FAIL" = "1" ]; then exit 1; fi
      # The fork guards compare against the base, and actions/checkout is
      # shallow: neither github/master nor origin/master nor master exists, so
      # `merge-base` failed and the register-lines check returned "nothing
      # moved" -- the answer that lets everything through. Measured: without a
      # base ref the guard printed SKIPPED and exited 0 while a change to a
      # `niet_mergen` entry passed underneath it. It is fatal now, so this fetch
      # is what makes it able to answer rather than what hides it.
      # (codex, #1639)
      # actions/checkout is depth-1, and HEAD itself is in .git/shallow. A
      # TARGETED fetch of the base brings the object in and does not connect it
      # to HEAD's history, so `git merge-base HEAD origin/master` still fails --
      # measured on a depth-1 clone: exit 1 after the targeted fetch, exit 0
      # after --unshallow.
      #
      # My first fix made that fatal instead of silent, which turned a guard
      # that always passed into one that always failed. Both are the same
      # defect: the check never ran. This is the half that makes it able to run.
      # (codex, #1639)
      - name: Give the fork guards a history to compare against
        if: ${{ !cancelled() }}
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -f .git/shallow ]; then
            git fetch -q --unshallow origin || git fetch -q --deepen=500 origin
          fi
          BASE="$PR_BASE"
          if [ -z "$BASE" ]; then BASE="$PUSH_BEFORE"; fi
          case "$BASE" in ""|0000000000000000000000000000000000000000)
              git fetch -q origin master
              git update-ref refs/remotes/origin/master "$(git rev-parse FETCH_HEAD)" ;;
            *)
              git cat-file -e "$BASE^{commit}" 2>/dev/null || git fetch -q origin "$BASE"
              git update-ref refs/remotes/origin/master "$BASE" ;;
          esac
          git merge-base HEAD refs/remotes/origin/master >/dev/null || {
            echo "::error::still no merge base after deepening; the fork guards cannot tell which register lines this branch moves." >&2
            exit 1
          }
      - name: A fork declares where it forked from
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/een_fork_zonder_forkpunt_wordt_niet_gemerged.py
      - name: A fork point is checked against the content it claims
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/een_forkpunt_wordt_op_inhoud_gecontroleerd.py
      - name: The shared config does not break worktrees
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/de_gedeelde_config_breekt_geen_worktrees.py

  # A `binding-suites` job stood here: the compiling binding suites, on the
  # desktop on every push. That is the heavy work heavy_work_leaves_the_desktop
  # refuses there (#267, #350), so the job moved to binding-suites.yml --
  # dispatch-only, on ubuntu-latest, where a dispatch is a decision that may
  # cost. The same scripts ride the landing lane beside it.


  # --------------------------------------------------------------------------
  # #288. Until 31-08-2026 the guards below ran in .gitlab-ci.yml and nowhere
  # else. GitHub has been the main remote since 25-08 and GitLab a nightly
  # mirror of it, so a job declared only there runs after the night, on a copy,
  # against a branch nobody is merging -- it cannot block a merge, and nobody
  # reads it when it goes red.
  #
  # Every step carries `if: ${{ !cancelled() }}` for the reason in
  # scripts/ci/guards_do_not_hide_behind_each_other.py: orchestration-guard
  # aborted at step four for thirty runs and the thirty-three guards below it
  # never executed, while the summary showed them as installed. Both jobs are
  # named in that script's GUARD_JOBS so the property is enforced, not intended.
  #
  # Nothing here is continue-on-error. Each one stands in front of a product
  # promise, and a soft gate recreates exactly the situation this issue is about.
  commit-identity-guard:
    name: No commit publishes a personal address
    # Its own job, and the only one here that checks out the whole history.
    #
    # `actions/checkout` fetches one commit by default, and over a shallow clone
    # `git log <base>..<head>` prints nothing and exits 0 -- which is the state
    # this guard exists to refuse, dressed as a pass. The floor inside the script
    # turns that into a failure rather than a green tick, but a job that can only
    # fail is not a gate, so the history has to actually be here.
    #
    # On the persistent desktop like orchestration-guard, and for the same
    # reason: a spending limit disables hosted runners, and a check that stops
    # running exactly when the bill does is not a check.
    # The desktop runner, plainly. The per-event expression that used to stand
    # here chose a hosted runner for a pull request; with no pull_request
    # trigger left (#333) its condition can only be true, so the expression
    # described a branch that no longer exists. An expression nobody can reach
    # reads as a rule and enforces nothing.
    #
    # Python file scans, seconds of work, no compilation. The persistent-runner
    # rule in orchestration_stays_hosted.py is about code a caller chooses --
    # a pull request's head or a dispatch ref -- and a push to master is neither:
    # it is already merged.
    runs-on: [self-hosted, xfa-local-checks]
    steps:
      - uses: actions/checkout@v4
        with:
          # The commits a push or a pull request introduces are the population;
          # without the base commit there is no range to read.
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Every step carries `if: ${{ !cancelled() }}`. Four independent checks in
      # sequence: a failure in one says nothing about whether the next would
      # pass, and a step that never ran looks exactly like a step that passed.
      # `orchestration-guard` aborted at step four for thirty runs and hid
      # thirty-three checks below it -- same job shape, same remedy (#288).
      #
      - run: pip install --quiet pyyaml
      # The test first, and for the usual reason: this guard's whole job is to
      # find nothing most days, so green says nothing until something has proved
      # it can go red. It exercises the range, the nearest base, the floor, the
      # cutover and the legacy budget against a repository built in a temporary
      # directory.
      - name: The identity guard refuses what it should, and only that
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_commits_use_the_noreply_alias.py
      - name: Every commit this change adds is authored by the noreply alias
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/commits_use_the_noreply_alias.py
      # Same address, longest-lived carrier. A branch is a name somebody will
      # delete; a `keep/` tag is written so nothing does, and the history-rewrite
      # plan carries tags over -- so archiving a branch that way turns an address
      # we may drop into one we have promised to keep. The test first, for the
      # reason above it: this guard finds nothing most days (#314).
      - name: The archive-tag guard refuses a tag it should
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_an_archive_tag_pins_no_personal_address.py
      - name: No archive tag pins an address we decided not to publish
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/an_archive_tag_pins_no_personal_address.py
      # The commit fields are half of it. The tree is the other half, and the
      # easier one to leak into: eight tracked files on master carried the
      # address as ordinary text while the identity guard was already green.
      - name: The tree guard finds a planted term and spares the innocent
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_no_personal_address_in_the_tree.py
      - name: No tracked file carries an address we decided not to publish
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/no_personal_address_in_the_tree.py
      # Same shape, different subject: a name the tree has stopped being
      # entitled to. The transfer to the organisation left 28 tracked files
      # naming the old path, all of them working because GitHub redirects it,
      # and one guard comparing remotes against a table that had not moved --
      # which closed every landing on the machine for four hours (#341).
      - name: The retired-name guard finds a planted path and spares lookalikes
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_no_tracked_file_names_the_old_repository.py
      - name: No tracked file names a repository path we have retired
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/no_tracked_file_names_the_old_repository.py
      # Evidence lives outside the tree: train Q carried meas/p4l-3f/ into the
      # repo because meas/ was never ignored, and meas/p4l-3l/ was one landing
      # away from following it. The guard refuses any tracked path under either
      # evidence root; the test plants one in a fixture repository.
      - name: The tracked-evidence guard fails on planted paths and spares the rest
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_no_tracked_evidence.py
      - name: No tracked file sits under the evidence roots
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/no_tracked_evidence.py

  # THE WORKSPACE BUILD IS NOT HERE ANY MORE (#350).
  #
  # A `workspace` job stood here from 05-09-2026: checkout, build-directory
  # check, and the same three scripts the landing lane runs with no crate list,
  # which makes them the whole workspace. It was written for a true reason --
  # the landing lane compiles only the crates a landing touches, and at that
  # moment nothing compiled the rest, because ci-ephemeral.yml had been disabled
  # by hand and its provider was believed gone.
  #
  # The provider was not gone: measured 06-09-2026 over all 318 runs of that
  # workflow, 104 succeeded, the last on 01-09. So the premise of this job was
  # repaired rather than the job kept. `ci-ephemeral.yml` now runs the whole
  # workspace every two hours on a bought-and-thrown-away instance, next to the
  # four heavy suites, and this file goes back to what it says at the top: light
  # guards, seconds of file scanning, on the machine that also has to serve
  # everything else.
  #
  # What that leaves per landing is the pre-push gate, which compiles and tests
  # the crates the landing touches before the push happens. What it costs is a
  # workspace verdict that is up to two hours old rather than one that queued
  # for three -- on 06-09 the oldest master commit under test on this runner was
  # two hours old with twenty-eight runs behind it.
