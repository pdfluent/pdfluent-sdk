name: CI

# M8-CLEANUP-04 (#1380): only the cheap PR sanity gate runs here.
# Expensive validation (wasm, bindings, desktop, conversion, corpus
# regression) runs off-CI on ephemeral Hetzner runners or a VPS/local
# box via `scripts/validate-expensive.sh`. A manual fallback workflow
# lives at `.github/workflows/expensive-validation.yml`
# (workflow_dispatch only, not required for merge).
#
# check/test/clippy/fmt run on the self-hosted `xfa-fast` runner (the
# desktop) ONLY on push to master — the workspace outgrew the
# ~$0.05/push estimate #1380 was written against, and self-hosted
# minutes are free regardless of duration. artifact-guard/
# license-metadata-guard stay on ubuntu-latest — no compilation,
# near-zero cost either way.
#
# On pull_request nothing here touches the persistent desktop. xfa-fast is a
# desktop, not an isolated ephemeral runner, so a PR's build scripts, proc-macros
# -- or simply the scripts/ci/*.py these jobs execute out of the checkout --
# would run as the runner user with host access. Only merged code (push) reaches
# it.
#
# That was written as a comment first and drifted: by 02-09-2026 every job in
# this file was self-hosted on both events, including the five guard jobs, while
# this header still claimed two were hosted. A workflow added the day before
# inherited the mistake by copying `runs-on` from a neighbour.
#
# So it is a guard now, not a description: scripts/ci/pr_code_stays_off_the_desktop.py
# fails on any pull_request-reachable job that asks for a self-hosted runner
# unconditionally, and its register of exceptions is empty. Do not restate the
# rule below this line -- a second description is a second thing that can drift.
#
# ci-ephemeral.yml's create-runner and reap are the exception that proves it:
# they must run ON the desktop, because creating and reaping instances is host
# work. They pin the base revision on a pull_request instead, so the code they
# execute is merged code even though the machine is the desktop.
#
# See `docs/ci-cost-control.md` for the full rationale.
#
# pdf-desktop is excluded from check/test/clippy because it pulls in
# Tauri/GTK system libs (glib-2.0, gtk-3, webkit2gtk, …) that are not
# installed on github-hosted runners; desktop validation also runs
# off-CI per the policy above.

on:
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      # docs/** is deliberately NOT ignored: docs/UPSTREAM_FORKS.toml is the
      # input to two gates in this workflow, so ignoring it meant a change to
      # that file was the one change they could not see.
      - 'CHANGELOG.md'
      - '.github/**.md'
  push:
    branches: [master]

concurrency:
  # A push gets its OWN group and is never cancelled; only a pull request
  # supersedes itself.
  #
  # On master every ref is the same ref, so each merge cancelled the previous
  # merge's run. Measured 02-09-2026 on the last 30 runs against master: the CI
  # workflow is 10 cancelled, 4 failed, 0 succeeded, and a run takes 246-1320 s
  # while 6 of the last 11 merges arrived within 1320 s of the one before. Half
  # of them land inside the previous run's lifetime; one cancelled run had been
  # going 7600 s.
  #
  # So a merge's result was observed only when nobody merged for the length of a
  # run, which is not this repository's pattern. Every "we will catch it on
  # master" argument rested on that. Same fix as the deletions workflow (#1635).
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Incremental state is a cache that only pays back across edits by a person,
  # and CI never edits twice. What it does instead is take up room and break:
  # the 25-08 failure was `failed to move dependency graph from
  # dep-graph.part.bin`, half-written state from a job that had been killed, and
  # it read as a broken crate. Measured 31-08-2026: 23 GB of incremental across
  # four checkouts, on a machine whose real headroom was 9.4 GB. (#264)
  CARGO_INCREMENTAL: 0

jobs:
  baseline-hardware-guard:
    name: Every baseline names the machine it came from
    # Its own job, not two more steps on `orchestration-guard`. That job runs
    # thirty-seven steps in sequence and aborts on the first failure, so a step
    # near the end reports nothing at all about itself -- it reports the health
    # of everything above it. On 31-08-2026 it had failed at step two for the
    # last thirty runs on master, which left thirty-five guards installed and
    # not executing. A gate that cannot be seen passing is the same shape as the
    # defect this one exists to catch (#283).
    runs-on: ${{ github.event_name == 'push' && fromJSON('["self-hosted","xfa-fast"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The guard first, then its own test -- a guard whose parser stopped
      # understanding the files reports a clean tree in exactly the same words
      # as a clean tree.
      # This job grew a PyYAML dependency the moment the baseline guard started
      # reading `runs-on` from parsed YAML instead of scanning text, and the job
      # was never told. `import yaml` then fails with ModuleNotFoundError on any
      # runner without a preinstall. scripts/ci/a_job_has_what_its_scripts_import.py
      # checks this for every job now, so the next script to grow the import does
      # not have to be caught by a reviewer. (codex, #1660)
      - run: pip install --quiet pyyaml
      - name: Every baseline names the machine it came from
        run: python3 scripts/ci/a_baseline_names_the_machine.py
      - name: The baseline-hardware guard still bites
        run: python3 scripts/ci/test_a_baseline_names_the_machine.py
  orchestration-guard:
    name: No ref-dispatchable job on the persistent runner
    # The repository's default workflow token is "read", which grants
    # `contents` and `packages` and nothing else -- `actions: read` is not in
    # it. Two guards in this job need it: the never-green one reads run
    # history, and pr_staleness.py reads pull requests. Without this block they
    # get a 403 and announce SKIPPED (not a pass) on a green step, which is a
    # guard that reports without measuring (#290). A job-level block replaces
    # the default rather than adding to it, so `contents: read` is listed too
    # or actions/checkout stops working.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    runs-on: ${{ github.event_name == 'push' && fromJSON('["self-hosted","xfa-fast"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pyyaml
      - name: Guards do not hide behind each other
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/guards_do_not_hide_behind_each_other.py
      - name: The disk-headroom guard still bites
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_disk_headroom.py
      - name: Enough disk to finish a build
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/disk_headroom.py
      # A cancelled host's address gets reassigned, and a script that keeps it
      # does not break -- it connects to whoever holds it next. (#261 family)
      - name: No connecting script carries a literal address
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/no_dead_host_in_a_connecting_script.py
      - name: One owner per path, and branches stay inside their own
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/territories_do_not_overlap.py
      - name: Every job installs what its scripts import
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/a_job_has_what_its_scripts_import.py
      # Only GitLab ran these, and GitLab is the mirror -- a red job there stops
      # nothing. The machine both pipelines share is the one whose build
      # directory keeps going away, so the verdict drifted unwatched on the side
      # that actually blocks a merge. (#264)
      - name: A mount, a dead disk and a rights problem are told apart
        if: ${{ !cancelled() }}
        run: bash scripts/ci/test_desktop_env.sh
      - name: A damaged shared build directory heals instead of failing the next job
        if: ${{ !cancelled() }}
        run: bash scripts/ci/test_cargo_target_health.sh
      - name: Every job building into the shared directory checks it first
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/shared_build_dir_fails_loudly.py
      # The guard before its own test, deliberately: a scanner that has stopped
      # recognising jobs reports a clean pipeline in the same words as a clean
      # pipeline, so the test has to be able to fail on its own.
      - name: The persistent-build guard still bites
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_persistent_builds_check_their_build_dir.py
      - name: Every build on the persistent runner checks its build directory
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/persistent_builds_check_their_build_dir.py
      - name: Orchestration stays on hosted runners
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/orchestration_stays_hosted.py
      - name: No `if:` reads the secrets context
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/if_conditions_are_valid.py
      - name: Nothing automatic reaches for macOS or Windows
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_no_hosted_minutes_on_a_push.py
      - name: No hosted minutes on a push
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/no_hosted_minutes_on_a_push.py
      - name: One event starts one machine
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/one_instance_per_event.py
      - name: Every needs names a job that exists
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/workflow_jobs_exist.py
      # `every_label_has_a_runner.py` used to run here and could not work.
      # It printed
      #
      #     SKIPPED (not a pass): could not read the runner list, so no label
      #     was checked against anything.
      #
      # on a green step, every run. Two reasons, and the second is the one that
      # settles it: `gh` is not installed on this runner, and -- measured --
      # `administration` is not a settable scope for GITHUB_TOKEN at all.
      # actionlint lists every available scope and it is absent, so the
      # token-over-HTTP route that fixed the never-green guard cannot work
      # here: `/actions/runners` needs a permission the workflow token can
      # never hold.
      #
      # So this is not a wiring problem to solve later. It needs a PAT stored
      # as a secret, which is a security decision nobody has taken, and until
      # then a step here can only be decoration. It runs in
      # scripts/ci/local_ci_gate.sh, where `gh` has a keyring and it genuinely
      # checks (#290).
      #
      # Do not re-add it without either a PAT or a different signal. When #1605
      # lands, register it in that guard's by-hand list or it reads as an
      # orphan.
      # `if: ${{ !cancelled() }}` on every one of these, because this job runs
      # its guards in sequence and stops at the first failure. On 31-08-2026 it
      # was failing on step four -- "Orchestration stays on hosted runners" --
      # on every run, and the twenty-odd steps below it were SKIPPED, which in
      # the summary looks exactly like passed. Appending a guard here without
      # this line adds a check that does not run. (#288 makes that mechanical
      # for every step; these four do not wait for it.)
      - name: A key GitHub needs a value for has one
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_every_workflow_can_start.py
      - name: Every workflow can start at all
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/every_workflow_can_start.py
      - name: The never-green gate still bites
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_a_gate_that_never_went_green.py
      # Without the token `gh api` cannot read a private repository's run
      # history, and this guard would announce SKIPPED (not a pass) on every
      # run -- honest, but not a gate. Same plumbing as pr_staleness.py above.
      - name: No workflow has been red since its file last changed
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/a_gate_that_never_went_green.py
      # `license_boundary.py` has been in scripts/ci since it was written and
      # called by nothing -- no job in .github/workflows, none in .gitlab-ci.yml,
      # not in local_ci_gate.sh. An installed control that no pipeline invokes is
      # the same nothing as one that runs and cannot fail.
      #
      # What it guards is not a style rule. The workspace root declares MIT, six
      # crates inherit it, and all six are `publish = false` today by accident of
      # who wrote them. Add a crate, forget that line, and the proprietary SDK
      # goes to crates.io declaring MIT -- a grant nobody can withdraw from
      # anyone who already fetched it. It breaks no build and fails no test; it
      # is simply true afterwards.
      #
      # The script is t3 territory and untouched. Only the call is mine.
      - name: Every crate declares the licence its side of the boundary requires
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/license_boundary.py
      # The other orphan. Blocking, with the cutoff at 2c03659a -- the commit
      # that introduced the DCO this morning (#223). The rule applies from the
      # moment the rule exists, so no history is rewritten.
      #
      # THE CUTOFF IS AN AUTHOR DATE, NOT A COMMITTER DATE, AND THAT IS
      # DELIBERATE. A rebase rewrites committer dates and preserves author
      # dates. Judging on committer date would therefore turn every rebased
      # branch red for work written before the rule existed -- punishing exactly
      # the branches that are being maintained, while untouched ones went free,
      # on the same morning everybody was asked to rebase.
      #
      # The cutoff commit demonstrates it on itself:
      #
      #     2c03659a  author 2026-08-31T20:27:22  committer 2026-09-01T08:10:38
      #
      # Author dates can be forged. We accept that: this is a discipline gate,
      # not a security boundary, and the signature is the point. Do not
      # "fix" this to committer date -- that trade is the reason it reads this
      # way. (T3 found the trap; the coordinator took the decision.)
      #
      # The range is the PULL REQUEST's own commits, never `2c03659a..HEAD`.
      # Measured: 57 commits have landed on master since the cutoff and 12 carry
      # a sign-off, so the wider range would fail every pull request on other
      # people's merged history -- a red check the author cannot act on.
      #
      # The checkout is shallow, so the base commit is fetched before the range
      # means anything: `git log` on a depth-1 clone answers confidently and
      # wrongly, which is #290's dating bug in a different file.
      - name: Every commit written since the DCO carries a matching sign-off
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        # The base sha arrives through `env:` rather than pasted into the script.
        # A ref is caller-supplied and a `${{ }}` expansion is textual: the value
        # becomes part of the program instead of an argument to it. This one is a
        # sha today, which is why it read as harmless -- and harmless-today is the
        # reason the guard checks the shape rather than the current value.
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          CUTOFF=2c03659a
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --no-tags --quiet --unshallow || git fetch --no-tags --quiet --deepen=200 || true
          fi
          if ! git cat-file -e "${CUTOFF}^{commit}" 2>/dev/null; then
            echo "SKIPPED (not a pass): the cutoff ${CUTOFF} is not in this checkout," >&2
            echo "  so which commits the rule covers cannot be established." >&2
            exit 1
          fi
          CUT_AT=$(git log -1 --format=%at "${CUTOFF}")
          # `git log --since` filters on committer date, which is the thing we
          # are deliberately not using, so the selection is done here.
          NA=$(git log --format='%H %at' "${BASE}..HEAD" \
               | awk -v c="${CUT_AT}" '$2 > c {print $1}')
          if [ -z "${NA}" ]; then
            echo "::notice::No commit in this pull request was written after the DCO landed; sign-off not required."
            exit 0
          fi
          echo "${NA}" | while read -r sha; do
            [ -n "$sha" ] || continue
            python3 scripts/ci/licence_signoff.py "${sha}~1..${sha}"
          done
      - name: Schedule conditions name a cron that exists
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/schedule_guards_match_their_cron.py
      - name: The mirror-drift gate still bites
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_mirror_has_not_drifted.py
      - name: The age alarm can tell a working machine from a leaked one
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_infra_health.py
      - name: The wait for a free instance fits inside its job
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/wait_fits_in_the_job_timeout.py
      - name: Provisioning and reaping take the same lock
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/one_lock_guards_the_instances.py
      - name: A Persistent= timer fires on a calendar
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/persistent_timers_use_a_calendar.py
      - name: The installer escapes the checkout path for systemd
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_installer_escapes_the_path.py
      - name: The fork register matches its fork points
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/the_fork_register_is_verifiable.py
      - name: Our forks have not fallen behind upstream
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/upstream_has_not_moved_on.py
      - name: Both fork lists name the same crates
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/fork_lists_agree.py
      - name: A fork behind on patch releases is behind
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_upstream_gap_counts_patches.py
      - name: Every feature-gated test has a job that enables it
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_feature_gated_tests_run.py
      - name: Site snippets match the code that compiles them
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/extract_site_snippets.py --check docs/site/snippets.json
      - name: The capability matrix and the coverage report agree
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/capability_matrix_matches_coverage.py
      - name: Nothing deletes the word separator
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/never_delete_the_word_separator.py
      - name: No script can reach the real repository
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_no_test_can_touch_the_real_repo.py
      - name: Third-party licences satisfy the policy
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/license_gate.py
      - name: The build-cache sweeper fails safe
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_sweep_fails_safe.py
      - name: A fixture cannot touch a real repository
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/a_fixture_cannot_touch_a_real_repo.py
      - name: The fixture-isolation lint bites in both directions
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_a_fixture_cannot_touch_a_real_repo.py
      - name: The register guards cannot reach the real repository
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_de_registerwachters_raken_de_echte_repo_niet.py
      - name: The licence gate rejects what it should
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_license_gate.py
      - name: Every error code links to a section that exists
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/error_codes_have_an_anchor.py
      # `always()` on both, and not for tidiness. A step that fails takes
      # every later step in the job with it, so parking these behind twenty
      # other guards would mean an unrelated red quietly stops the corpus
      # gate from being checked -- which is the exact shape of #276, where
      # nothing was failing and nothing was running.
      #
      # They stay in this job rather than getting their own because a hosted
      # runner is not available: the Actions spending limit disables
      # ubuntu-latest outright, and a new job on the desktop would need its
      # own entry in the orchestration baseline. This job is already there.
      #
      # The guard first, then the test that tries to defeat it -- a guard
      # whose parser stopped understanding the manifest reports a clean one
      # in exactly the same words.
      - name: The manifest still describes one pinned, licensed set
        if: always()
        run: python3 scripts/ci/gate_corpus_is_pinned.py
      - name: The gate-corpus guard rejects what it should
        if: always()
        run: python3 scripts/ci/test_gate_corpus_is_pinned.py
      - name: No pull request has been left to rot
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/pr_staleness.py
      - name: The sweep spares the instance this run claimed
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_sweep_spares_the_claimed_instance.py
      - name: Reaping runs after the work, never inside provisioning
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/reaping_happens_after_the_work.py
      # The guard first, then its own test -- a guard whose parser stopped
      # understanding the files reports a clean tree in exactly the same words.
      - name: The guard that reads run-blocks still reads them
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_workflow_inputs_are_not_shell.py
      - name: No caller-supplied string reaches a shell
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/workflow_inputs_are_not_shell.py
      - name: Cross targets land on the pinned toolchain
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/wasm_target_matches_the_pin.py
      - name: Parsers still read their runners' output
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_tests_actually_ran.py
      # Costs nothing -- it drives the gate's verdict with numbers, no veraPDF
      # and no corpus -- so the cheap job can vouch for the expensive one. The
      # first case is the report `verapdf.yml` published on #1543: five
      # documents, nothing compliant, and a green tick over it (#286).
      - name: A 0% conformance report cannot be green
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_pdfa_output_conformance_gate.py
      - name: Check for committed .so / .pyd / .node / .wasm artifacts
        if: ${{ !cancelled() }}
        run: |
            FOUND=$(git ls-files \
              '*.so' '*.pyd' '*.node' \
              'crates/xfa-wasm/pkg/*.js' \
              'crates/xfa-wasm/pkg/*.wasm' \
              'crates/xfa-wasm/pkg/*.d.ts' \
              2>/dev/null)
            if [ -n "$FOUND" ]; then
              echo "ERROR: committed build artifact(s) found — remove them and add to .gitignore:"
              echo "$FOUND"
              exit 1
            fi
            echo "OK: no compiled build artifacts found in the repository."
      # The test first, then the guard: a guard whose parser stopped recognising
      # jobs reports a clean tree in exactly the same words as a clean tree.
      - name: The guard on the guards still bites
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_every_guard_has_a_job.py
      - name: Every guard has a job, and it is not only on the mirror
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/every_guard_has_a_job.py
      - name: The mirror pipeline still parses
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/ci_config_lint.py
      - name: The branch-without-a-request guard still counts
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_branches_have_a_merge_request.py
      - name: Verify commercial packages declare correct license
        if: ${{ !cancelled() }}
        run: |
            FAIL=0
            for PKG in \
              crates/xfa-wasm/pkg/package.json \
              crates/pdf-node/package.json; do
              if [ -f "$PKG" ]; then
                LICENSE=$(python3 -c "import json; print(json.load(open('$PKG')).get('license',''))")
                if [ "$LICENSE" = "MIT" ] || [ "$LICENSE" = "Apache-2.0" ] || [ "$LICENSE" = "MIT OR Apache-2.0" ]; then
                  echo "ERROR: $PKG has permissive license '$LICENSE' — must be PDFluent Commercial License"
                  FAIL=1
                else
                  echo "OK: $PKG license = '$LICENSE'"
                fi
              fi
            done
            if [ "$FAIL" = "1" ]; then exit 1; fi
      # The fork guards compare against the base, and actions/checkout is
      # shallow: neither github/master nor origin/master nor master exists, so
      # `merge-base` failed and the register-lines check returned "nothing
      # moved" -- the answer that lets everything through. Measured: without a
      # base ref the guard printed SKIPPED and exited 0 while a change to a
      # `niet_mergen` entry passed underneath it. It is fatal now, so this fetch
      # is what makes it able to answer rather than what hides it.
      # (codex, #1639)
      # actions/checkout is depth-1, and HEAD itself is in .git/shallow. A
      # TARGETED fetch of the base brings the object in and does not connect it
      # to HEAD's history, so `git merge-base HEAD origin/master` still fails --
      # measured on a depth-1 clone: exit 1 after the targeted fetch, exit 0
      # after --unshallow.
      #
      # My first fix made that fatal instead of silent, which turned a guard
      # that always passed into one that always failed. Both are the same
      # defect: the check never ran. This is the half that makes it able to run.
      # (codex, #1639)
      - name: Give the fork guards a history to compare against
        if: ${{ !cancelled() }}
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -f .git/shallow ]; then
            git fetch -q --unshallow origin || git fetch -q --deepen=500 origin
          fi
          BASE="$PR_BASE"
          if [ -z "$BASE" ]; then BASE="$PUSH_BEFORE"; fi
          case "$BASE" in ""|0000000000000000000000000000000000000000)
              git fetch -q origin master
              git update-ref refs/remotes/origin/master "$(git rev-parse FETCH_HEAD)" ;;
            *)
              git cat-file -e "$BASE^{commit}" 2>/dev/null || git fetch -q origin "$BASE"
              git update-ref refs/remotes/origin/master "$BASE" ;;
          esac
          git merge-base HEAD refs/remotes/origin/master >/dev/null || {
            echo "::error::still no merge base after deepening; the fork guards cannot tell which register lines this branch moves." >&2
            exit 1
          }
      - name: A fork declares where it forked from
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/een_fork_zonder_forkpunt_wordt_niet_gemerged.py
      - name: A fork point is checked against the content it claims
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/een_forkpunt_wordt_op_inhoud_gecontroleerd.py
      - name: The shared config does not break worktrees
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/de_gedeelde_config_breekt_geen_worktrees.py


  # --------------------------------------------------------------------------
  # #288. Until 31-08-2026 the guards below ran in .gitlab-ci.yml and nowhere
  # else. GitHub has been the main remote since 25-08 and GitLab a nightly
  # mirror of it, so a job declared only there runs after the night, on a copy,
  # against a branch nobody is merging -- it cannot block a merge, and nobody
  # reads it when it goes red.
  #
  # Every step carries `if: ${{ !cancelled() }}` for the reason in
  # scripts/ci/guards_do_not_hide_behind_each_other.py: orchestration-guard
  # aborted at step four for thirty runs and the thirty-three guards below it
  # never executed, while the summary showed them as installed. Both jobs are
  # named in that script's GUARD_JOBS so the property is enforced, not intended.
  #
  # Nothing here is continue-on-error. Each one stands in front of a product
  # promise, and a soft gate recreates exactly the situation this issue is about.
  licence-registry-guard:
    name: The licence registry is enforced somewhere that cannot be skipped
    # Its own job because every existing job in this file is self-hosted, and a
    # pull_request must not run PR-authored code on the persistent desktop
    # (#311). The header above still says artifact-guard and
    # license-metadata-guard stay on ubuntu-latest; measured 02-09-2026, no job
    # here is hosted any more. The boundary drifted while the comment describing
    # it did not.
    runs-on: ${{ github.event_name == 'push' && fromJSON('["self-hosted","xfa-fast"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Measured 02-09-2026: this ran in NO CI file. Its only enforcement was
      # local_ci_gate.sh, and a local gate is skippable -- demonstrably, since a
      # branch passed a push that evening while this check returned 1. A gate
      # that can be stepped over is a convention, not a gate. (#304)
      - name: Every crate's licence matches the canonical register
        if: ${{ !cancelled() }}
        run: python3 scripts/release/license_registry_check.py

  promise-guard:
    name: Every promise has a test that reaches it
    runs-on: ${{ github.event_name == 'push' && fromJSON('["self-hosted","xfa-fast"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pyyaml
      - name: Cargo on PATH
        if: ${{ !cancelled() }}
        run: |
          # `$HOME` for the runner service is not necessarily where cargo was
          # installed, so adding the directory is not the same as making cargo
          # runnable. Source the env file when it is there, and then CHECK --
          # measured on master 02-09-2026, this step ran and a later guard still
          # died on `FileNotFoundError: [Errno 2] No such file or directory:
          # 'cargo'`, which is a confusing way to learn that the toolchain is not
          # on PATH. (#292)
          set -euo pipefail
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          [ -f "$HOME/.cargo/env" ] && . "$HOME/.cargo/env" || true
          export PATH="$HOME/.cargo/bin:$PATH"
          if ! command -v cargo >/dev/null 2>&1; then
            echo "::error::cargo is not runnable on this runner. \$HOME is $HOME; \$HOME/.cargo/bin is $([ -d "$HOME/.cargo/bin" ] && echo present || echo absent). Every step below that needs the toolchain will fail with a FileNotFoundError that says nothing about this." >&2
            exit 1
          fi
          # Status-checked, not `echo $(…)`: if cargo resolves but cannot run --
          # a rustup shim with no toolchain installed -- the substitution fails,
          # `echo` still returns 0, `set -e` sees nothing, and the step reports
          # success with an empty version. The one case this check exists for
          # would pass it. (codex, #1659)
          cargo --version || {
            echo "::error::cargo is on PATH but does not run. A rustup shim without an installed toolchain does this: `command -v cargo` succeeds and every build fails." >&2
            exit 1
          }
      # In promise-guard because it is the job that already has cargo on PATH,
      # and DEBUG rather than --release: measured profile-independent, the
      # generator produces the same 1090 bytes either way, and debug shares
      # whatever this job has already built.
      #
      # It was briefly in bindings.yml, which builds for the Java binding this
      # fixture belongs to -- and which runs only on `push: tags`. That made the
      # guard release-time-only: drift between generator and committed file
      # would have been caught after the merge, in the publication run. I checked
      # whether that job builds and not whether it RUNS, which is the question I
      # have asked of every other guard this week. (T1 review, #1654)
      # Only when the two things it compares can have moved.
      #
      # This job goes to a hosted runner for pull requests (below), so the step
      # would otherwise be a cold debug build of pdf-manip on every PR to compare
      # 1090 bytes. The guard asks one question: do the committed bytes still
      # match what the generator produces. If neither the generator nor the
      # committed file is in the diff, the answer cannot have changed, and
      # rebuilding to re-confirm it is paying for a fact already established.
      #
      # `dorny/paths-filter` rather than a workflow-level `paths:` because this
      # is one step in a job that must keep running for everything else it does.
      # (T1 review, #1649)
      - name: Did the fixture or its generator move?
        id: fixture-diff
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then BASE="${{ github.event.before }}"; fi
          case "$BASE" in ""|0000000000000000000000000000000000000000)
              echo "moved=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          git cat-file -e "$BASE^{commit}" 2>/dev/null || git fetch -q origin "$BASE"
          if git diff --name-only "$BASE"..HEAD -- \
               crates/pdf-manip/examples/java_binding_fixture.rs \
               crates/pdf-java/src/test/resources/binding-fixture.pdf \
               scripts/ci/the_java_fixture_is_the_one_we_generate.py \
             | grep -q .; then
            echo "moved=true" >> "$GITHUB_OUTPUT"
          else
            echo "moved=false" >> "$GITHUB_OUTPUT"
          fi
      - name: The Java binding fixture is the one we generate
        if: ${{ !cancelled() && steps.fixture-diff.outputs.moved == 'true' }}
        run: python3 scripts/ci/the_java_fixture_is_the_one_we_generate.py
      # Which exported symbols does no test call? A floor, not a percentage:
      # 198 of 262 is not 100, and a soft job at that number is one everybody
      # scrolls past -- so the floor passes at today's count and fails on a drop.
      - name: Every exported symbol a test calls, still called
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/api_coverage.py
      # The product question rather than the binding one: does every capability
      # the website and the editor advertise map to a test, and is it reachable
      # from the pdfluent facade at all? OCR, Excel and PowerPoint each had tests
      # in a crate the facade did not depend on.
      - name: Every advertised capability has a test and a route to it
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/feature_promises.py
      # Three hand-written descriptions of what this codebase can do were four
      # months stale at the same time, and each still read as authoritative.
      - name: The capability register matches the code
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/capability_register.py --check
      # crates/pdf-python sits outside the workspace on purpose; a second
      # Cargo.lock drifting on its own was never the decision. It had 35 packages
      # pinned older than the workspace.
      - name: The Python binding resolves the versions we ship
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/lockfile_agreement.py
      # A ratchet in both directions: a new public function without a test turns
      # it red, and so does one that gains coverage without the file shrinking.
      - name: Test reachability has not slipped
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_reachability.py --check
      - name: The reachability guard can still tell delegation apart
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_reachability_unit.py

  # The offline half of the corpus gates. The measurements themselves need the
  # corpus machine and stay on the mirror with their reason in
  # scripts/ci/mirror_only_guards.toml -- but the arithmetic, the argument
  # handling and the reporting are plain Python, and those are where the two
  # failures in #286 actually lived.
  measurement-guard:
    name: The published measurements still measure what they say
    runs-on: ${{ github.event_name == 'push' && fromJSON('["self-hosted","xfa-fast"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

  message-guard-wiring:
    name: The message guards are wired, and run
    # Its own job, and it checks out the full history for the same reason
    # commit-identity-guard does: `geen_interne_zaken.py` reads a range of
    # commit messages, and over a shallow clone that range is empty -- which is
    # the state it exists to refuse, dressed as a pass.
    #
    # Why this job exists at all: `docs/HERKOMST.md` claimed a commit-msg hook
    # from 26-08-2026 onward. Measured 02-09-2026, `core.hooksPath` pointed at
    # `.githooks`, that directory held pre-commit and pre-push and no
    # commit-msg, and the guard the document named sat on a branch that never
    # merged. A rule described in prose and enforced nowhere is not a rule, and
    # this is the layer that makes the description checkable.
    #
    # Hosted on a pull request, per scripts/ci/pr_code_stays_off_the_desktop.py:
    # these steps run scripts out of the checkout, and on a pull request those
    # scripts are whatever the pull request says they are.
    runs-on: ${{ github.event_name == 'push' && fromJSON('["self-hosted","xfa-fast"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Each step carries `if: ${{ !cancelled() }}`: a failure in one says
      # nothing about the next, and a step that never ran looks like one that
      # passed (#288).
      #
      # The wiring first. If the hook is missing or does not call both guards,
      # the two checks below still pass on this branch's own history while
      # nothing protects the next commit anyone writes.
      # `--alleen-boom`: layers 1 and 2 (the hook file, and that it calls both
      # guards) are properties of the tree and are judged here. Layer 3 asks
      # whether `core.hooksPath` is set in THIS clone, and a checkout made by
      # actions/checkout never has it -- so this job was red on every pull
      # request for a reason that had nothing to do with the pull request.
      # Layer 3 is judged by scripts/ci/local_ci_gate.sh on a developer machine,
      # which is where a commit message is written and therefore the only place
      # the answer means anything.
      - name: The commit-msg hook exists and calls both message guards
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/the_commit_msg_hook_is_wired.py --alleen-boom
      - name: The hook guard's layers are told apart
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_the_commit_msg_hook_is_wired.py
      - name: No commit carries AI attribution
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/no_ai_attribution.py
      - name: The attribution guard bites in both directions
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_no_ai_attribution.py
      # A message cannot be excluded by a manifest the way a file can, so this
      # is the last point before the messages are published.
      # Master's, kept: my rebase resolution dropped it, and
      # every_guard_has_a_job named it within the minute. A guard nothing runs
      # is a comment, and a rebase is exactly where one goes missing without a
      # line being deleted on purpose.
      - name: A hit does not publish the term it found
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_een_treffer_publiceert_de_term_niet.py


  commit-identity-guard:
    name: No commit publishes a personal address
    # Its own job, and the only one here that checks out the whole history.
    #
    # `actions/checkout` fetches one commit by default, and over a shallow clone
    # `git log <base>..<head>` prints nothing and exits 0 -- which is the state
    # this guard exists to refuse, dressed as a pass. The floor inside the script
    # turns that into a failure rather than a green tick, but a job that can only
    # fail is not a gate, so the history has to actually be here.
    #
    # On the persistent desktop like orchestration-guard, and for the same
    # reason: a spending limit disables hosted runners, and a check that stops
    # running exactly when the bill does is not a check.
    runs-on: ${{ github.event_name == 'push' && fromJSON('["self-hosted","xfa-fast"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The commits a push or a pull request introduces are the population;
          # without the base commit there is no range to read.
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Every step carries `if: ${{ !cancelled() }}`. Four independent checks in
      # sequence: a failure in one says nothing about whether the next would
      # pass, and a step that never ran looks exactly like a step that passed.
      # `orchestration-guard` aborted at step four for thirty runs and hid
      # thirty-three checks below it -- same job shape, same remedy (#288).
      #
      - run: pip install --quiet pyyaml
      # A test that returns early without saying so is indistinguishable from a
      # passing one. That is how a doubled /ToUnicode survived a fully green suite.
      - name: No test bails out in silence
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_skip_lint.py
      # Counting characters scored a wrecked document at 80.1%: every letter had
      # become an 'x'. This measure counts which of the source's words come back.
      - name: Text retention is measured in words, not characters
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_text_fidelity.py
      # A print function that quietly does nothing leaves the gate saying OK with
      # no figure at all -- and the figure then gets fetched by hand from
      # somewhere else, which is how a wrong one stays on a website for months.
      - name: The retention gate still prints its distribution
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_retention_report.py
      # #286: measured.json wrote "govdocs (fixed 300-document sample)" while
      # sample_size said 1000. A conformance figure has to name the sample it
      # came from, and the two gates have to be tellable apart.
      - name: A conformance figure names the sample it came from
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_pdfa_gate_label.py
      # The corpus job handed the text-replacement gate an argument it did not
      # have. It failed on argument parsing in under a second, for months, and
      # the measurement it exists to produce had therefore never run.
      - name: The text-replacement gate accepts what its job passes
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_text_replace_gate.py
      # A cache in front of a validator is the one place where fast quietly turns
      # into wrong, so these check that it declines to answer far more often than
      # that it answers quickly.
      - name: The veraPDF verdict cache declines when it should
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_verapdf_cached.py
      # The corpus disk threw read errors for five hours while its mount stayed
      # in place. `test -d` passed on a cached dentry, and a corpus job ran 68
      # minutes without a line of output.
      - name: The corpus preflight can tell a dead disk from a missing one
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_corpus_preflight.py
      - name: The test fixtures are still well formed
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_fixtures_are_wellformed.py
      # The test first, and for the usual reason: this guard's whole job is to
      # find nothing most days, so green says nothing until something has proved
      # it can go red. It exercises the range, the nearest base, the floor, the
      # cutover and the legacy budget against a repository built in a temporary
      # directory.
      - name: The identity guard refuses what it should, and only that
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_commits_use_the_noreply_alias.py
      - name: Every commit this change adds is authored by the noreply alias
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/commits_use_the_noreply_alias.py
      # The commit fields are half of it. The tree is the other half, and the
      # easier one to leak into: eight tracked files on master carried the
      # address as ordinary text while the identity guard was already green.
      - name: The tree guard finds a planted term and spares the innocent
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_no_personal_address_in_the_tree.py
      - name: No tracked file carries an address we decided not to publish
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/no_personal_address_in_the_tree.py

  internal-matter-guard:
    name: No commit message names an internal matter
    # ITS OWN JOB, and that is the point of it.
    #
    # The base-revision route pins the SCRIPT. It does not pin the interpreter.
    # In `message-guard-wiring` four earlier steps run scripts out of the pull
    # request's checkout, and any of them can append to `$GITHUB_PATH` or
    # `$GITHUB_ENV` -- a `python3` shim ahead on PATH, or `PYTHONPATH=/tmp/x`
    # with an `os.py` in it -- so the pinned guard would have run attacker-chosen
    # code with the terms secret in its environment. Pinning the file while the
    # thing that executes the file is still chosen by the pull request is half a
    # boundary. (peer review, #1660)
    #
    # So: a fresh checkout, no pull-request code before it, one step, and the
    # secret gone before the job ends.
    # The plain form, not `(push || schedule)`: ci.yml has no schedule trigger,
    # so naming one would be a condition that can never be true, and the
    # recogniser on master reads only this shape until #1649 lands. Writing the
    # wider form here would have been a guard failure in exchange for nothing.
    runs-on: ${{ github.event_name == 'push' && fromJSON('["self-hosted","xfa-fast"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # ONE step: the secret is written, used, and removed without ever being
      # visible to another step.
      #
      # The list of customer and partner names is deliberately not in the tree:
      # a forbidden-terms list that publishes its own terms leaks exactly what
      # it exists to stop, and worse than the commit messages it screens -- a
      # message can be rewritten, a published source file is in every clone.
      #
      # AND THE SCRIPT COMES FROM THE BASE REVISION. On a same-repo pull request
      # this job would otherwise run PR-authored code with a secret in reach:
      # anyone who can push a branch but cannot read secrets could edit
      # geen_interne_zaken.py to print the list base64-encoded, and per-term
      # masking does not stop encoded exfiltration. That is the boundary #1649
      # guards, one level over: not the desktop this time, but the secrets.
      # `git archive <base>` gives the reviewed copy; the pull request's commits
      # are what it reads, as DATA. (codex, #1660)
      #
      # If the secret is absent the file is empty, the guard finds no terms and
      # exits 1 with "SKIPPED (not a pass)" -- the right answer: nobody looked.
      # Fork pull requests receive no secrets at all, so when this repository
      # stops being private that same base-revision route is what has to carry
      # it, with the fork case failing closed as it does today.
      - name: No commit message names an internal matter
        if: ${{ !cancelled() }}
        env:
          TERMEN: ${{ secrets.PDFLUENT_INTERNE_TERMEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          LIJST="$RUNNER_TEMP/interne-termen.txt"
          trap 'rm -f "$LIJST" "$LIJST.raw"' EXIT
          # Masking FIRST, and PER LINE. `::add-mask::` is line-oriented: given a
          # multi-line value it masks line 1 and prints the rest as ordinary log
          # lines. The list is one term per line by design, so the normal case
          # would have published every partner name but the first.
          # `\r` and stray spaces are not part of a term, and masking is exact:
          # a list saved with CRLF would have masked "acme\r" while the guard
          # matched "acme". Trimmed before masking and before writing.
          printf '%s\n' "$TERMEN" | tr -d '\r' > "$LIJST.raw"
          while IFS= read -r term; do
            term="$(printf '%s' "$term" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            if [ -n "$term" ]; then echo "::add-mask::$term"; fi
          done < "$LIJST.raw"
          sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' "$LIJST.raw" > "$LIJST"
          WACHT="scripts/ci/geen_interne_zaken.py"
          if [ -n "${BASE_SHA:-}" ]; then
            mkdir -p "$RUNNER_TEMP/base"
            git archive "$BASE_SHA" scripts/ci | tar -x -C "$RUNNER_TEMP/base"
            WACHT="$RUNNER_TEMP/base/scripts/ci/geen_interne_zaken.py"
            echo "guard taken from base revision ${BASE_SHA}"
          fi
          # Belt and braces even in a clean job: an absolute interpreter and an
          # emptied PYTHONPATH, so neither PATH nor the import path can be
          # steered by anything that ran before.
          PY=$(command -v python3)
          case "$PY" in /*) ;; *) echo "::error::python3 is not an absolute path"; exit 1 ;; esac
          PYTHONPATH= PDFLUENT_INTERNE_TERMEN="$LIJST" "$PY" "$WACHT" --bereik origin/master..HEAD
