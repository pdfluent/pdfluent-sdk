name: CI

# M8-CLEANUP-04 (#1380): GitHub Actions runs only the cheap PR sanity
# gate. Expensive validation (wasm, bindings, desktop, conversion,
# corpus regression) runs off-CI on a VPS or local box via
# `scripts/validate-expensive.sh`. A manual fallback workflow lives at
# `.github/workflows/expensive-validation.yml` (workflow_dispatch only,
# not required for merge). See `docs/ci-cost-control.md` for rationale.

on:
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'CHANGELOG.md'
      - '.github/**.md'
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p pdf-xfa -p xfa-layout-engine -p xfa-dom-resolver -p formcalc-interpreter -p xfa-cli

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p pdf-xfa -p xfa-layout-engine -p xfa-dom-resolver -p formcalc-interpreter

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Scope to pdf-xfa only: this is the active engine crate with 0 new warnings.
      # Pre-existing missing_docs debt in xfa-dom-resolver / formcalc-interpreter is
      # tracked separately and not gated here.
      # pdf-xfa has #![warn(missing_docs)] + pre-existing collapsible_match debt.
      # Clippy runs as a warning-only gate here; the VPS validation script
      # enforces the 0-new-warnings contract (docs/ci-cost-control.md).
      - run: cargo clippy -p pdf-xfa --no-deps

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
