name: CI

# M8-CLEANUP-04 (#1380): GitHub Actions runs only the cheap PR sanity
# gate. Expensive validation (wasm, bindings, desktop, conversion,
# corpus regression) runs off-CI on a VPS or local box via
# `scripts/validate-expensive.sh`. A manual fallback workflow lives at
# `.github/workflows/expensive-validation.yml` (workflow_dispatch only,
# not required for merge). See `docs/ci-cost-control.md` for rationale.
#
# pdf-desktop is excluded from check/test/clippy because it pulls in
# Tauri/GTK system libs (glib-2.0, gtk-3, webkit2gtk, …) that are not
# installed on github-hosted runners; desktop validation also runs
# off-CI per the policy above.

on:
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'CHANGELOG.md'
      - '.github/**.md'
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --exclude pdf-desktop

  test:
    name: Test
    runs-on: ubuntu-latest
    # OOM workaround (issue #1481): the linker `ld` exhausts the 7 GB
    # github-hosted runner when linking ~30 test binaries with full debug
    # info in parallel (signal 7 / Bus error).
    #
    # Mitigation: disable debug info in test profile + serialize linking.
    # Long-term: corpus-heavy and benchmark workflows run on the self-hosted
    # VPS (30 GB RAM) where this workaround is not needed.  This job stays
    # on ubuntu-latest to keep the feedback loop fast for pull requests.
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude pdf-desktop --no-fail-fast

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --exclude pdf-desktop -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  artifact-guard:
    name: No compiled build artifacts committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for committed .so / .pyd / .node / .wasm artifacts
        run: |
          FOUND=$(git ls-files \
            '*.so' '*.pyd' '*.node' \
            'crates/xfa-wasm/pkg/*.js' \
            'crates/xfa-wasm/pkg/*.wasm' \
            'crates/xfa-wasm/pkg/*.d.ts' \
            2>/dev/null)
          if [ -n "$FOUND" ]; then
            echo "ERROR: committed build artifact(s) found — remove them and add to .gitignore:"
            echo "$FOUND"
            exit 1
          fi
          echo "OK: no compiled build artifacts found in the repository."

  license-metadata-guard:
    name: No MIT/Apache license on commercial npm packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify commercial packages declare correct license
        run: |
          FAIL=0
          for PKG in \
            crates/xfa-wasm/pkg/package.json \
            crates/pdf-node/package.json; do
            if [ -f "$PKG" ]; then
              LICENSE=$(python3 -c "import json; print(json.load(open('$PKG')).get('license',''))")
              if [ "$LICENSE" = "MIT" ] || [ "$LICENSE" = "Apache-2.0" ] || [ "$LICENSE" = "MIT OR Apache-2.0" ]; then
                echo "ERROR: $PKG has permissive license '$LICENSE' — must be PDFluent Commercial License"
                FAIL=1
              else
                echo "OK: $PKG license = '$LICENSE'"
              fi
            fi
          done
          if [ "$FAIL" = "1" ]; then exit 1; fi
