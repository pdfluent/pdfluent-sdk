name: WASM Surface Guard

# Epic 4 #1233 follow-up (Codex #1277 P2): cross-compile-check the
# wasm_surface integration test so the native/wasm signature-parity
# contract is actually pinned on the wasm target, not merely on native.
#
# `cargo check --target wasm32-unknown-unknown -p pdfluent` by itself
# doesn't check the integration-test targets. We pass `--tests` here
# so the `tests/wasm_surface.rs` fn-pointer assertions compile in
# the wasm target too — if the native and wasm arms of `to_docx` /
# `to_images` ever drift, this job fails.

on:
  # Automatic triggers removed on 28-08-2026. This work now runs on the
  # shared instance that ci-ephemeral.yml creates: one server per push,
  # not one per workflow. Five workflows each provisioning their own gave
  # five cpx42s inside five minutes for a single push (#275).
  workflow_dispatch:

env:

jobs:
  wasm-surface:
    name: Cross-compile wasm_surface on wasm32-unknown-unknown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `@stable` installs stable and adds the target to STABLE. cargo then
      # reads rust-toolchain.toml, switches to the pinned channel, and finds no
      # wasm32 std there:
      #
      #     error[E0463]: can't find crate for `core`
      #
      # The message names neither the toolchain nor the target, which is why
      # this ran red for a while looking like a code problem. Pinning the action
      # to the same channel as the repo keeps the target and the compiler
      # together.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.94.0'
          targets: wasm32-unknown-unknown

      - name: The target is on the toolchain cargo will actually use
        run: |
          PINNED=$(grep '^channel' rust-toolchain.toml | cut -d'"' -f2)
          if ! rustup target list --installed --toolchain "$PINNED" \
               | grep -qx wasm32-unknown-unknown; then
            echo "::error::wasm32-unknown-unknown is not installed for $PINNED."
            echo "::error::rust-toolchain.toml pins $PINNED; the workflow must add"
            echo "::error::the target to that channel, not to stable."
            exit 1
          fi
          echo "wasm32-unknown-unknown present on $PINNED"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: wasm-surface

      - name: Cross-compile pdfluent tests for wasm32
        # --tests pulls in the integration-test targets including
        # wasm_surface.rs. The fn-pointer assignments inside that file
        # are the actual contract pinning — they fail to compile if
        # the native and wasm signatures of to_docx/to_images drift.
        run: |
          cargo check \
            --target wasm32-unknown-unknown \
            -p pdfluent \
            --tests

      - name: Native smoke test (sanity)
        # If this passes but the wasm check above failed, the drift
        # is wasm-specific — which is exactly what this job guards.
        run: cargo test -p pdfluent --test wasm_surface
