# Orchestration runs on ubuntu-latest, deliberately.
#
# `gh workflow run --ref <branch>` executes the workflow definition FROM THAT
# BRANCH. Put create-runner or delete-runner on the persistent [self-hosted,
# xfa-fast] host and any feature branch can add a step that runs on the desktop,
# which is the machine that holds the corpus, the warm cargo cache and the
# runner registration token. Pre-merge code stays on isolated runners; this is
# where that rule is enforced.
#
# The cost argument for moving them was real but small: create and delete are
# 10-20s of hosted time each. The exposure they bought back is not bounded.
#
# The candidate ref reaches only the ephemeral instance, via actions/checkout in
# the test job below. Nothing from an unmerged branch executes on xfa-fast.
#
# scripts/ci/orchestration_stays_hosted.py fails the build if this is undone.

name: Hetzner Orphan Sweep

# Safety net for golden-diff-ephemeral.yml: that workflow's delete-runner job
# normally tears down the Hetzner instance it created, but a hard GitHub
# Actions outage or a killed workflow run can skip that step. The Hetzner
# project used here (pdfluent-ci-ephemeral) exists only for this purpose, so
# any server still running past a generous margin is by definition an orphan
# — no label/name filtering needed, unlike a shared project.
#
# Runs on xfa-fast, and the reasoning changed with the architecture.
#
# A safety net that depends on the machine it protects is normally wrong. Here
# the desktop is also the only thing that CREATES instances: orchestration
# moved back to it so that no GitHub-hosted minutes are billed. A desktop that
# is down is therefore a desktop that is making no orphans either, and the
# window narrows to "instance created, then the desktop dies before delete" --
# which this sweep closes as soon as it returns.
#
# The trigger is `schedule` and `workflow_dispatch` only, and the job guard
# below pins it to the default branch, so no branch code reaches the desktop
# through it.

permissions:
  contents: read

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  sweep:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, xfa-fast]
    steps:
      - uses: actions/checkout@v4
      # Idle *and* past the paid hour. Instances are reused rather than deleted
      # after every run, so this sweep is what ends their life -- and a busy one
      # must survive at any age, or a sweep kills a build (#274).
      - name: Delete idle instances past their billed hour
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          GH_RUNNER_PAT: ${{ secrets.GH_RUNNER_PAT }}
        run: python3 scripts/ci/sweep_idle_instances.py
