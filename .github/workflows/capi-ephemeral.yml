# Zero GitHub-hosted cost, and no branch code on the desktop.
#
# Those two pull against each other, and the way out is that the workflow body
# and the code under test come from different places:
#
#   * the workflow is always dispatched with --ref master, so what runs on the
#     persistent desktop is code that is already merged and reviewed;
#   * the branch you want to test is passed as the `candidate_ref` INPUT, and
#     only the ephemeral Hetzner instance checks it out.
#
#     gh workflow run capi-ephemeral.yml --ref master -f candidate_ref=my-branch
#
# Dispatching with --ref my-branch would run that branch's workflow definition,
# which is how a feature branch could put its own steps on the machine holding
# the corpus, the warm cargo cache and the runner token.
#
# Orchestration therefore sits on xfa-fast (free) instead of ubuntu-latest,
# without buying back the exposure that #1536 removed. The heavy work was never
# on the desktop to begin with: it runs on the throwaway instance.
#
# WHAT THIS GUARD IS, AND WHAT IT IS NOT
#
# The `if:` below lives in this file, and `gh workflow run --ref <branch>` runs
# THIS FILE FROM THAT BRANCH. A branch that deletes the guard is not stopped by
# it. Codex made that point on #1538 and it is right: this is not a boundary
# against a hostile branch.
#
# What it does stop is the accident -- dispatching a feature branch out of habit
# and finding its steps on the machine with the corpus, the warm cache and the
# runner token. That is the failure that actually happens, and it happened to be
# the one I was set up to cause, dispatching from a branch every few minutes.
#
# The real boundary is who can dispatch a workflow at all: repository write
# access. Someone who has that could push to the default branch directly, so the
# guard buys defence in depth, not a new wall. Recorded rather than implied,
# because a comment claiming more than the code delivers is how the next person
# gets it wrong.
#
# scripts/ci/orchestration_stays_hosted.py checks the shape on the default
# branch, which is where it can be relied on.

# `gh workflow run --ref <branch>` executes the workflow definition FROM THAT
# BRANCH. Put create-runner or delete-runner on the persistent [self-hosted,
# xfa-fast] host and any feature branch can add a step that runs on the desktop,
# which is the machine that holds the corpus, the warm cargo cache and the
# runner registration token. Pre-merge code stays on isolated runners; this is
# where that rule is enforced.
#
# The cost argument for moving them was real but small: create and delete are
# 10-20s of hosted time each. The exposure they bought back is not bounded.
#
# The candidate ref reaches only the ephemeral instance, via actions/checkout in
# the test job below. Nothing from an unmerged branch executes on xfa-fast.
#
# scripts/ci/orchestration_stays_hosted.py fails the build if this is undone.

name: pdf-capi (ephemeral Hetzner)

# Proof-of-concept for the "one base snapshot, thin per-binding layers"
# design: the base snapshot (xfa-base-capi-1.94.0-cedf6522, id 425017420) has
# the host-triple + wasm32 dependency graph prebuilt at the exact path
# actions/checkout uses (/actions-runner/_work/xfa-native-rust/xfa-native-rust),
# so actions/checkout does an incremental fetch+reset here instead of a full
# clone, and cargo only rebuilds what actually changed since the bake.
#
# Measured (cedf6522, CPX42): cold host-triple build 2m56s -> warm (no
# change) 1.5s; warm after a real content change in a shared crate
# (pdf-manip, 5.1% of build time, in all 6 binding graphs) 25.6s.
#
# The snapshot is pinned to rust-toolchain.toml's channel (see
# /etc/xfa-snapshot-toolchain.txt on the instance) — bumping that pin means
# rebaking, or the wasm32 target step below fails with "can't find crate for
# core" against the wrong toolchain silently having no wasm target.
#
# GitLab's existing jobs are untouched; this is additive.
#

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: 'Branch or SHA to check out ON THE EPHEMERAL INSTANCE. The workflow itself always runs from the default branch.'
        required: false
        default: ''

concurrency:
  group: capi-ephemeral-${{ inputs.candidate_ref || github.ref }}
  cancel-in-progress: true

env:
  HCLOUD_SNAPSHOT_ID: '425017420' # xfa-base-capi-1.94.0-cedf6522

jobs:
  create-runner:
    # Only from the default branch: a dispatch carrying another branch's
    # workflow body is skipped entirely, so nothing unmerged runs here.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, xfa-fast]
    outputs:
      label: ${{ steps.create.outputs.label }}
      server_id: ${{ steps.create.outputs.server_id }}
    steps:
      - name: Create ephemeral Hetzner runner
        id: create
        uses: Cyclenerd/hcloud-github-runner@v1
        with:
          mode: create
          github_token: ${{ secrets.GH_RUNNER_PAT }}
          hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          server_type: cpx42
          location: fsn1
          image: ${{ env.HCLOUD_SNAPSHOT_ID }}

  capi-test:
    needs: create-runner
    runs-on: ${{ needs.create-runner.outputs.label }}
    timeout-minutes: 30
    env:
      CARGO_HOME: /var/cache/cargo-home
      CARGO_TARGET_DIR: /var/cache/cargo-target
    steps:
      - uses: actions/checkout@v4
        with:
          # Empty falls back to the default branch, which is what a plain
          # dispatch means. This is the only place a candidate ref is used.
          ref: ${{ inputs.candidate_ref || github.ref }}

      - name: Confirm toolchain pin matches the baked snapshot
        run: |
          BAKED=$(grep '^channel' /etc/xfa-snapshot-toolchain.txt | cut -d'"' -f2)
          PINNED=$(grep '^channel' rust-toolchain.toml | cut -d'"' -f2)
          if [ "$BAKED" != "$PINNED" ]; then
            echo "::error::snapshot baked for toolchain $BAKED, repo now pins $PINNED — rebake the snapshot before trusting this run's timing"
            exit 1
          fi
          echo "toolchain OK: $PINNED"

      - name: Build pdf-capi (release, locked)
        run: |
          command -v cc >/dev/null || { echo "cc missing on this runner"; exit 1; }
          cargo build -p pdf-capi --release --locked

      - name: Run capi smoke tests (fails on zero tests, not just nonzero exit)
        run: |
          python3 "${GITHUB_WORKSPACE}/scripts/ci/tests_actually_ran.py" capi -- \
            make -C crates/pdf-capi/tests run

  delete-runner:
    needs: [create-runner, capi-test]
    if: always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, xfa-fast]
    steps:
      # Only when there is something to delete: if create-runner failed the
      # outputs are empty and this step would error on a server that was
      # never made. A genuine half-created instance is caught by
      # hetzner-orphan-sweep.yml, which is why that one must not depend on
      # this machine either.
      - name: Delete ephemeral Hetzner runner
        if: needs.create-runner.outputs.server_id != ''
        uses: Cyclenerd/hcloud-github-runner@v1
        with:
          mode: delete
          github_token: ${{ secrets.GH_RUNNER_PAT }}
          hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          name: ${{ needs.create-runner.outputs.label }}
          server_id: ${{ needs.create-runner.outputs.server_id }}
