name: Docs Drift Guard

# Epic 5 #1238 — fail CI when the committed
# `crates/pdfluent/tests/web_examples/*.rs` files diverge from what
# `pdfluent-snippet-extract` produces from the cached HTML.
#
# Offline-only by design. The maintainer runs an occasional
# `--online` refresh locally, commits the cache, then CI verifies
# that the extractor's deterministic output matches the committed
# `.rs` files byte-for-byte.

on:
  pull_request:
    paths:
      - 'crates/pdfluent/tests/web_examples/**'
      - 'tools/pdfluent-snippet-extract/**'
      - '.github/workflows/docs-drift-guard.yml'
  push:
    branches: [master]

env:
  HCLOUD_SNAPSHOT_ID: '425004761' # xfa-golden-ci-base-v2

jobs:
  # One throwaway instance for this workflow. The jobs below queue on it rather
  # than spreading across hosted runners: free, and a cpx42 has eight cores
  # against a hosted runner's two to four. Orchestration sits on the desktop,
  # which costs nothing (#274).
  create-runner:
    runs-on: [self-hosted, xfa-fast]
    outputs:
      label: ${{ steps.create.outputs.label }}
      server_id: ${{ steps.create.outputs.server_id }}
    steps:
      - name: Create ephemeral Hetzner runner
        id: create
        uses: Cyclenerd/hcloud-github-runner@v1
        with:
          mode: create
          github_token: ${{ secrets.GH_RUNNER_PAT }}
          hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          server_type: cpx42
          location: fsn1
          image: ${{ env.HCLOUD_SNAPSHOT_ID }}

  drift-guard:
    needs: create-runner
    name: Snippet extract output matches committed tests
    # Advisory until #1488 is resolved: the website shows aspirational API
    # not yet in the SDK, so regenerating produces non-compilable snippets.
    # The check still runs and reports drift; it does not block merges.
    continue-on-error: true
    runs-on: ${{ needs.create-runner.outputs.label }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "tools/pdfluent-snippet-extract"

      - name: Build extractor
        run: cargo build -p pdfluent-snippet-extract --release

      - name: Verify cache directory exists
        # If nothing has been cached yet, the drift guard is vacuous
        # — explicitly signal that state rather than falsely passing.
        run: |
          if [ ! -d tools/pdfluent-snippet-extract/cache ] || [ -z "$(ls -A tools/pdfluent-snippet-extract/cache 2>/dev/null)" ]; then
            echo "::notice::Snippet cache is empty — drift guard has no inputs to check. Run `cargo run -p pdfluent-snippet-extract --features online -- --online --manifest tools/pdfluent-snippet-extract/manifest.toml --cache-dir tools/pdfluent-snippet-extract/cache --out-dir crates/pdfluent/tests/web_examples --fetched \$(date -u +%Y-%m-%d)` locally to seed it."
            exit 0
          fi

      - name: Re-extract snippets (offline)
        # `--fetched` is a deterministic tag (not today's date) so the
        # generated `.rs` files are byte-identical across re-runs.
        # The value is read from the stamp file the maintainer commits
        # alongside the cache.
        run: |
          STAMP_FILE=tools/pdfluent-snippet-extract/cache/.last-fetched
          if [ ! -f "$STAMP_FILE" ]; then
            echo "::error::Cache present but $STAMP_FILE missing. Write the ISO date of the online refresh to that file and commit."
            exit 1
          fi
          FETCHED=$(cat "$STAMP_FILE")
          echo "Using fetched=$FETCHED"

          cargo run --release -p pdfluent-snippet-extract -- \
            --manifest   tools/pdfluent-snippet-extract/manifest.toml \
            --cache-dir  tools/pdfluent-snippet-extract/cache \
            --out-dir    crates/pdfluent/tests/web_examples \
            --fetched    "$FETCHED"

      - name: Verify no drift vs committed tests
        run: |
          echo "::notice::Docs drift is advisory until #1488 is resolved — this check will not block merges."
          if ! git diff --exit-code --stat -- crates/pdfluent/tests/web_examples/; then
            echo ""
            echo "::warning::Drift detected: the extractor's output differs from the committed tests/web_examples/*.rs."
            echo "Run locally:"
            echo "  cargo run -p pdfluent-snippet-extract -- --manifest tools/pdfluent-snippet-extract/manifest.toml --cache-dir tools/pdfluent-snippet-extract/cache --out-dir crates/pdfluent/tests/web_examples --fetched \$(cat tools/pdfluent-snippet-extract/cache/.last-fetched)"
            echo "Then commit the regenerated .rs files."
            exit 1
          fi
  delete-runner:
    needs: [create-runner, drift-guard]
    if: always()
    runs-on: [self-hosted, xfa-fast]
    steps:
      - name: Delete ephemeral Hetzner runner
        if: needs.create-runner.outputs.server_id != ''
        uses: Cyclenerd/hcloud-github-runner@v1
        with:
          mode: delete
          github_token: ${ secrets.GH_RUNNER_PAT }
          hcloud_token: ${ secrets.HCLOUD_TOKEN }
          name: ${ needs.create-runner.outputs.label }
          server_id: ${ needs.create-runner.outputs.server_id }
