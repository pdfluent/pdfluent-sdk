name: Build wheels

# Triggered by:
#   - python/v* tags: Python-specific release (legacy).
#   - v*.*.* tags:    SDK version release — build and publish wheels to PyPI.
#   - workflow_dispatch: manual build (dry-run by default; set publish=true to upload).
on:
  push:
    tags:
      - 'python/v*'
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish wheels to PyPI'
        default: 'false'
        type: choice
        options: ['true', 'false']

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      # One target failing should not cancel the others: a partial matrix
      # still tells us which platforms are healthy.
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/pdf-python
          target: ${{ matrix.target }}
          args: --release --strip --out dist
          manylinux: auto
          # rquickjs-sys vendors quickjs.c, which uses C99 `for` loop
          # declarations. The aarch64 cross-compiler in the manylinux image
          # defaults to gnu89 and rejects them; the x86_64, macOS and Windows
          # toolchains all default to a newer standard, which is why only this
          # target failed. cc-rs appends CFLAGS_<target> to the compiler
          # invocation, so ask for gnu99 there and leave every other target
          # untouched.
          before-script-linux: |
            export CFLAGS_aarch64_unknown_linux_gnu="${CFLAGS_aarch64_unknown_linux_gnu:-} -std=gnu99"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: crates/pdf-python/dist
          retention-days: 30

  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/pdf-python
          target: ${{ matrix.target }}
          args: --release --strip --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: crates/pdf-python/dist
          retention-days: 30

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/pdf-python
          target: x86_64
          args: --release --strip --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x86_64
          path: crates/pdf-python/dist
          retention-days: 30

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/pdf-python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: crates/pdf-python/dist
          retention-days: 30

  release:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish == 'true'
    needs: [linux, macos, windows, sdist]
    environment:
      name: pypi
      url: https://pypi.org/project/pdfluent/
    permissions:
      id-token: write   # required for trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2, head of release/v1
        with:
          packages-dir: dist
