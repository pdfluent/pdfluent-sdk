# The tests behind `--features tesseract`, in the pipeline that counts.
#
# Its own file on purpose. scripts/ci/test_feature_gated_tests_run.py read only
# .gitlab-ci.yml, so the one way to satisfy it was a job on the nightly mirror --
# which is 204 commits behind GitHub and blocks nothing. "There is a job" and "it
# has run" were two different things. The guard now reads this workflow too.
#
# A separate file rather than a job in ci.yml: ci.yml is under change elsewhere,
# and this needs system libraries no other job wants.
#
# THIS WORKFLOW IS MEANT TO MOVE. The moment the ephemeral snapshot carries
# libtesseract-dev, libleptonica-dev and libclang-dev, this job belongs on that
# instance in ci-ephemeral.yml, and it gains a push trigger there -- compiling
# work belongs on a throwaway machine, which is the whole point of #267. It lives
# here, hosted and pull-request-only, only because the snapshot does not carry
# them yet. The requirement is recorded on #276 with the fifty SSIM documents,
# and on #244. Delete this file when that lands. (#244, #276)
name: OCR feature tests

# Pull requests only, and that is the whole design rather than an omission --
# see the job comment.
on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ocr-feature-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tesseract:
    name: pdf-ocr --features tesseract
    # Hosted, always, because this job COMPILES.
    #
    # scripts/ci/orchestration_stays_hosted.py refuses a compiling job on
    # xfa-fast, and it is right: that is a persistent desktop with four cores
    # holding the corpus, the warm cache and the runner token, and compiling on
    # it is what saturated the machine in #267. Its ZWARE_BASELINE would have
    # taken an eighth entry, but that register's own note says the count is
    # meant to fall and that rows are removed rather than kept -- so adding one
    # to make this fit would be the convenient answer, not the right one.
    #
    # Pull-request-only follows from that. `no_hosted_minutes_on_a_push.py`
    # forbids hosted minutes on a push, so a push would have to go to the
    # desktop (refused, above) or provision an ephemeral instance (a Hetzner
    # runner for twenty-eight tests). Neither is worth it, because master only
    # ever receives fast-forwards of heads that already passed their pull
    # request -- so the pull request IS the merge gate here, and a push job
    # would re-run what has already been proven.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The desktop has these since 03-09-2026 (#244). A hosted runner does not,
      # and bindgen needs libclang on top of the two the issue named -- without
      # it the build dies on `Unable to find libclang`, not on a test.
      # bindgen needs libclang on top of the two packages #244 named -- without
      # it the build dies on `Unable to find libclang`, not on a test.
      - name: Install the OCR system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libtesseract-dev libleptonica-dev libclang-dev

      # The owner's rule is zero GitHub cost, so this has to stay inside the
      # free bundle. The cache is what keeps it there: without it every run
      # rebuilds tesseract-sys and bindgen from scratch.
      - uses: Swatinem/rust-cache@v2

      - name: The tests behind the tesseract feature
        run: cargo test -p pdf-ocr --features tesseract --locked
