name: WASM Build

# Branch pushes: build + trigger website rebuild (paths-filtered).
# Version tags (v*.*.*): build + publish to npm.
on:
  push:
    # Tags only. The master-push build moved into ci-ephemeral.yml so that one
    # push provisions one instance instead of two: this workflow and that one
    # fired together and each made its own cpx42 (#275).
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish_npm:
        description: 'Publish to npm (requires NPM_TOKEN secret)'
        default: 'false'
        type: choice
        options: ['true', 'false']

env:
  CARGO_TERM_COLOR: always

jobs:
  wasm-build:
    name: Build WASM
    runs-on: ubuntu-latest
    env:
      WEBSITE_DEPLOY_TOKEN: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # Pinned to rust-toolchain.toml's channel: `@stable` puts the target
      # on stable, cargo switches to the pinned channel, and there is no
      # wasm32 std there -- "can't find crate for `core`".
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.94.0'
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM package
        run: wasm-pack build crates/xfa-wasm --target web --release

      - name: Ship LICENSE beside the manifest
        # `license: SEE LICENSE IN LICENSE` is a promise about a file. Without
        # this copy the published package makes that promise and omits the file.
        run: cp LICENSE crates/xfa-wasm/pkg/LICENSE

      - name: Patch npm package metadata
        # wasm-pack regenerates package.json from Cargo.toml metadata.
        # Post-process to inject correct license, version, and repository URLs.
        run: |
          PDFLUENT_VER=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import json,sys; pkgs=json.load(sys.stdin)['packages']; \
              print(next(p['version'] for p in pkgs if p['name']=='pdfluent'))")
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('crates/xfa-wasm/pkg/package.json', 'utf8'));
            pkg.version = process.env.PDFLUENT_VER;
            // npm's validate-npm-package-license rejects a LicenseRef expression
            // (validForNewPackages: false), so the npm channels use npm's own
            // route for a non-SPDX offer. The compound expression is the first
            // line of the LICENSE file shipped beside it.
            pkg.license = 'SEE LICENSE IN LICENSE';
            pkg.licenseUrl = 'https://pdfluent.com/terms';
            pkg.homepage = 'https://pdfluent.com';
            pkg.repository = { type: 'git', url: 'https://github.com/pdfluent/pdfluent-sdk' };
            pkg.bugs = { url: 'https://github.com/pdfluent/pdfluent-sdk/issues' };
            pkg.publishConfig = { access: 'public' };
            fs.writeFileSync('crates/xfa-wasm/pkg/package.json', JSON.stringify(pkg, null, 2) + '\n');
            console.log('patched package.json: version=' + pkg.version + ' license=' + pkg.license);
          " env PDFLUENT_VER=$PDFLUENT_VER

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: crates/xfa-wasm/pkg/
          retention-days: 30

      - name: Publish to npm
        # Publish when: a v* tag is pushed, OR workflow_dispatch with publish_npm=true.
        # Requires NPM_TOKEN secret set in repository settings.
        # No token check in the condition. `secrets` is not available in an
        # `if:` at all -- reading it there does not come out false, it makes the
        # whole file invalid, which is what stopped this workflow for nine days.
        # Hoisting the token to the job's `env:` would fix that but hand a
        # registry-write credential to every step in the job, which Codex
        # pointed out on #1544 and is right about. So the condition asks only
        # what it needs to, and the token stays on this one step. A missing
        # token now fails the publish loudly instead of skipping it in silence,
        # and a release that quietly does not publish is worse than one that
        # stops and says so.
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_npm == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "NPM_TOKEN is not set; refusing to pretend this published." >&2
            exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          cd crates/xfa-wasm/pkg
          echo "Publishing @pdfluent/wasm $(node -e "console.log(require('./package.json').version)") to npm..."
          npm publish --access public
          echo "npm publish complete"

      - name: Trigger website rebuild
        if: github.ref == 'refs/heads/master' && env.WEBSITE_DEPLOY_TOKEN != ''
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
          repository: pdfluent/pdfluent-playground
          event-type: wasm-updated
