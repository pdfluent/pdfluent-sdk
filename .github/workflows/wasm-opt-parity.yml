name: WASM wasm-opt parity gate

# Verifies that the wasm-opt-optimized SDK build produces byte-identical
# outputs to a reference build (wasm-opt disabled) for the deterministic
# operation set. Triggered on any MR touching crates/xfa-wasm/.
#
# This job is intentionally pure CI configuration. It is checked in to
# document the contract; the GitHub Actions side is currently dormant
# because the GitHub mirror is suspended. The same script
# (scripts/bench/wasm-golden-compare.mjs) is the authoritative gate and
# will be reused unchanged on the GitLab CI lane when that platform's
# pipeline is set up.

on:
  # Automatic triggers removed on 28-08-2026. This work now runs on the
  # shared instance that ci-ephemeral.yml creates: one server per push,
  # not one per workflow. Five workflows each provisioning their own gave
  # five cpx42s inside five minutes for a single push (#275).
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  wasm-opt-parity:
    name: "wasm-opt -O3 vs disabled (byte-identical outputs)"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Install Rust
        # Pinned to rust-toolchain.toml's channel: `@stable` puts the target
        # on stable, cargo switches to the pinned channel, and there is no
        # wasm32 std there -- "can't find crate for `core`".
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master 03-09-2026
        with:
          toolchain: '1.94.0'
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build reference (wasm-opt disabled)
        run: |
          # Force-disable wasm-opt by toml-patching for the reference build.
          cp crates/xfa-wasm/Cargo.toml crates/xfa-wasm/Cargo.toml.bak
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("crates/xfa-wasm/Cargo.toml")
          t = p.read_text()
          # `wasm-opt` is a multi-line array. A single-line `^wasm-opt = .*$`
          # replaces only the opening `wasm-opt = [` and leaves its contents
          # behind, so cargo reads an orphaned `"-O3",` and reports
          # "key with no value, expected `=`" -- pointing at a line nobody
          # wrote. This workflow was checked in dormant and had never run, so
          # the patch had never been executed against the array form.
          nieuw, n = re.subn(
              r"^wasm-opt\s*=\s*(?:\[[^\]]*\]|[^\n]*)$",
              "wasm-opt = false",
              t,
              count=1,
              flags=re.M | re.S,
          )
          if n != 1:
              raise SystemExit(
                  "wasm-opt key not found in crates/xfa-wasm/Cargo.toml; the "
                  "reference build would silently keep optimisation on, which "
                  "makes this comparison meaningless"
              )
          p.write_text(nieuw)
          PY
          wasm-pack build --release --target web \
            --out-dir /tmp/ref/pkg crates/xfa-wasm \
            -- --no-default-features --features wasm
          mv crates/xfa-wasm/Cargo.toml.bak crates/xfa-wasm/Cargo.toml

      - name: Build candidate (committed wasm-opt config)
        run: |
          wasm-pack build --release --target web \
            --out-dir /tmp/cand/pkg crates/xfa-wasm \
            -- --no-default-features --features wasm

      - name: Golden comparison (must be byte-identical)
        run: |
          node scripts/bench/wasm-golden-compare.mjs \
            --ref /tmp/ref/pkg \
            --cand /tmp/cand/pkg \
            --fixtures benchmarks/fixtures/wasm_perf/manifest.json \
            --out  /tmp/golden.json
          jq '{pass: .pass, fail: .fail, error: .error}' /tmp/golden.json

      - name: Size guardrail (raw .wasm must not regress > 5%)
        run: |
          REF=$(stat -c %s /tmp/ref/pkg/xfa_wasm_bg.wasm)
          CAND=$(stat -c %s /tmp/cand/pkg/xfa_wasm_bg.wasm)
          echo "ref=$REF cand=$CAND"
          python3 - <<PY
          ref=$REF; cand=$CAND
          ratio = (cand/ref - 1)*100
          print(f"raw .wasm delta: {ratio:+.2f}%")
          assert ratio <= 5.0, f"raw .wasm regressed > 5%: {ratio:+.2f}%"
          PY

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-opt-parity-artefacts
          path: |
            /tmp/golden.json
            /tmp/ref/pkg/xfa_wasm_bg.wasm
            /tmp/cand/pkg/xfa_wasm_bg.wasm
          retention-days: 14
