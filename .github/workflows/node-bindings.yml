name: Node.js Bindings

# Build and smoke-test Node.js bindings on every commit to master.
# Publish to npm on version tags (v*.*.*).
#
# napi-rs publish pattern:
#   1. build-and-test: smoke test on ubuntu/macos/windows.
#   2. build-release: cross-compile all platform targets, upload .node artifacts.
#   3. publish-npm: download all artifacts, run napi prepublish, publish packages.
#
# Required secrets:
#   NPM_TOKEN  — npmjs.org publish token with write access to @pdfluent scope.

on:
  push:
    tags: ['node/v*', 'v*.*.*']
    # Deliberately no `branches:`. With master in here, every push to master ran
    # build-and-test across ubuntu, macOS and Windows, plus build-release across
    # macos-13 and macos-latest. macOS bills at ten times the Linux rate and
    # Windows at twice, so an ordinary push was the largest line on the Actions
    # bill -- to answer a question ("do the bindings still build for a release?")
    # that only matters at a tag.
  workflow_dispatch:
    inputs:
      publish_npm:
        description: 'Publish to npm'
        default: 'false'
        type: choice
        options: ['true', 'false']

concurrency:
  # A publish run gets its own group and is never cancelled. With one shared
  # group and cancel-in-progress, any push to the same ref killed a release
  # mid-flight — a docs commit cancelled a full publish run, and the result
  # reads as "cancelled" rather than as anything having gone wrong.
  group: node-bindings-${{ github.ref }}-${{ inputs.publish_npm == 'true' && 'publish' || 'ci' }}
  cancel-in-progress: ${{ inputs.publish_npm != 'true' }}

env:
  CARGO_TERM_COLOR: always

# ---------------------------------------------------------------------------
# Smoke tests (fast, per-OS)
# ---------------------------------------------------------------------------
jobs:
  build-and-test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24]
    defaults:
      run:
        working-directory: crates/pdf-node

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm install

      - name: Build native binding
        run: npm run build

      - name: Run smoke tests
        run: npm test

      - name: Upload native binding
        uses: actions/upload-artifact@v4
        with:
          name: pdf-node-smoke-${{ matrix.os }}-node${{ matrix.node }}
          path: crates/pdf-node/index.*.node
          if-no-files-found: error
          retention-days: 30

# ---------------------------------------------------------------------------
# Release builds: all napi targets (only on v* tags or manual publish)
# ---------------------------------------------------------------------------
  build-release:
    name: Build release / ${{ matrix.target }}
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_npm == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    defaults:
      run:
        working-directory: crates/pdf-node

    steps:
      - uses: actions/checkout@v4

      # Pinned to rust-toolchain.toml: `@stable` adds the matrix target to
      # stable, cargo then switches to the pinned channel and finds no std
      # for it -- "can't find crate for `core`", naming neither.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.94.0'
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: node-release-${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build for ${{ matrix.target }}
        run: npm run build -- --target ${{ matrix.target }}

      - name: Upload platform binding
        uses: actions/upload-artifact@v4
        with:
          name: pdf-node-release-${{ matrix.target }}
          path: crates/pdf-node/index.*.node
          if-no-files-found: error
          retention-days: 7

# ---------------------------------------------------------------------------
# npm publish (requires all release builds to succeed)
# ---------------------------------------------------------------------------
  publish-npm:
    name: Publish to npm
    needs: [build-and-test, build-release]
    # `secrets` is not a valid context in a job-level `if:` — GitHub rejects
    # the whole file with "Unrecognized named-value: 'secrets'", so this
    # workflow could not be dispatched at all. The token check moved to the
    # publish step, where `secrets` is available.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_npm == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: crates/pdf-node

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Download all platform bindings
        uses: actions/download-artifact@v4
        with:
          pattern: pdf-node-release-*
          path: crates/pdf-node/artifacts
          merge-multiple: true

      - name: Move bindings into place
        run: |
          find artifacts -name 'index.*.node' -exec cp {} . \;
          ls -la index.*.node

      - name: Prepare npm packages
        run: npm run prepublishOnly

      - name: Publish platform packages and main package
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "NPM_TOKEN is not configured in repository secrets — refusing to publish." >&2
            echo "Add it at Settings → Secrets and variables → Actions." >&2
            exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
          npx napi publish
          echo "npm publish complete"
