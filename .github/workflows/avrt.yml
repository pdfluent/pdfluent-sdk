name: Visual Regression (AVRT)

on:
  # Automatic triggers removed on 28-08-2026. This work now runs on the
  # shared instance that ci-ephemeral.yml creates: one server per push,
  # not one per workflow. Five workflows each provisioning their own gave
  # five cpx42s inside five minutes for a single push (#275).
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

# Nothing to set here. The key was left behind on 31-08-2026 when
# HCLOUD_SNAPSHOT_ID was deleted from it (d511912f), and `env:` with no value
# is valid YAML but not a valid workflow: GitHub refused the whole file, so
# every push produced a run with zero jobs and zero seconds (#290). An absent
# key is the way to say "no environment"; an empty one is a broken file.

jobs:
  visual-regression:
    name: AVRT Pixel Diff
    # Not ubuntu-latest: hosted minutes are billed and the standing rule is to
    # spend none (#290). The gold-master check below refuses long before
    # anything is built, so this costs the shared runner a few seconds.
    runs-on: [self-hosted, xfa-fast]
    steps:
      - uses: actions/checkout@v4

      # First, before ImageMagick and before any toolchain: if there is nothing
      # to compare against, none of that is worth installing.
      #
      # This step used to set `exists=false`, print "Skipping AVRT" and let
      # every step below it fall away on an `if:`. The job then reported
      # success. There have never been gold masters in this tree -- they are
      # Adobe Acrobat renders, which no runner can produce -- so every green
      # AVRT tick this workflow ever showed meant zero images compared. That is
      # the shape a gate has when it is measuring nothing, and it is worse than
      # a red one, because it answers the question "is visual regression
      # covered?" with yes.
      #
      # nightly.yml carries the same job behind `if: false  # Enable when gold
      # masters are available`. This says the same thing out loud instead, so a
      # dispatch gets an answer rather than silence.
      #
      # To turn this back on: commit Acrobat renders of the corpus to
      # gold-masters/*.png, or teach the workflow where to fetch them. Tracked
      # as the AVRT half of #290.
      - name: Gold masters, or nothing to measure
        run: |
          shopt -s nullglob
          masters=(gold-masters/*.png)
          if [[ ${#masters[@]} -eq 0 ]]; then
            echo "SKIPPED (not a pass): no gold-masters/*.png in the tree, so" >&2
            echo "there is nothing to diff renders against. AVRT has never had" >&2
            echo "them; a green tick here would mean zero images compared." >&2
            echo "Gold masters are Adobe Acrobat renders of the corpus and" >&2
            echo "cannot be produced on a runner. See #290." >&2
            exit 1
          fi
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "Gold masters found: ${#masters[@]} files"
        id: gold-check

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Cache gold masters
        uses: actions/cache@v4
        with:
          path: gold-masters/
          key: avrt-gold-masters-${{ hashFiles('avrt-config.json') }}

      - uses: dtolnay/rust-toolchain@stable
        if: steps.gold-check.outputs.exists == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.gold-check.outputs.exists == 'true'

      - name: Build engine
        if: steps.gold-check.outputs.exists == 'true'
        run: cargo build --release -p xfa-cli

      - name: Generate engine renders
        if: steps.gold-check.outputs.exists == 'true'
        run: |
          mkdir -p renders/
          cargo run --release --bin corpus-render -- \
            --corpus corpus/ \
            --output renders/ \
            --scale 2.0 \
            --json

      - name: Run AVRT
        if: steps.gold-check.outputs.exists == 'true'
        env:
          INPUT_THRESHOLD: ${{ inputs.threshold || '1.0' }}
        run: |
          THRESHOLD="$INPUT_THRESHOLD"
          ./scripts/run-avrt.sh \
            --renders renders/ \
            --gold gold-masters/ \
            --output reports/avrt \
            --threshold "$THRESHOLD" \
            --channel-tol 5

      - name: Generate HTML report
        if: always() && steps.gold-check.outputs.exists == 'true'
        run: ./scripts/avrt-report.sh reports/avrt

      - name: Upload AVRT report
        if: always() && steps.gold-check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: avrt-visual-regression-report
          path: reports/avrt/
          retention-days: 30

      - name: Comment PR with results
        if: always() && github.event_name == 'pull_request' && steps.gold-check.outputs.exists == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('reports/avrt/summary.json')) return;
            const summary = JSON.parse(fs.readFileSync('reports/avrt/summary.json', 'utf8'));
            const emoji = summary.pass_rate >= 90 ? ':white_check_mark:' : ':warning:';
            const body = [
              `## ${emoji} Visual Regression Report (AVRT)`,
              '',
              `| Metric | Value |`,
              `|--------|-------|`,
              `| Compared | ${summary.total} |`,
              `| Passed | ${summary.passed} |`,
              `| Failed | ${summary.failed} |`,
              `| Skipped | ${summary.skipped} |`,
              `| **Pass Rate** | **${summary.pass_rate}%** |`,
              `| Threshold | ${summary.threshold_pct}% |`,
            ];
            if (summary.failed_files && summary.failed_files.length > 0) {
              body.push('', '<details><summary>Failed files</summary>', '');
              summary.failed_files.forEach(f => body.push(`- \`${f}\``));
              body.push('', '</details>');
            }
            body.push('', '*Diff images and full report available as workflow artifact.*');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('Visual Regression Report (AVRT)'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body.join('\n'),
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body.join('\n'),
              });
            }
