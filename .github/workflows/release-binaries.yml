name: Release Binaries

# RELEASE AUTHORITY: this workflow is the sole creator of GitHub Releases.
# publish_ordered.sh creates and pushes the git tag; this workflow takes over
# from there, building binaries and creating the release with assets + checksums.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
            ext: ''
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            ext: ''
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
            ext: ''
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            ext: ''
          - target: x86_64-apple-darwin
            os: macos-13
            use_cross: false
            ext: ''
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
            ext: ''
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
            ext: '.exe'
          - target: x86_64-pc-windows-gnu
            os: windows-latest
            use_cross: false
            ext: '.exe'

    steps:
      - uses: actions/checkout@v4

      - name: Install cross for Linux targets
        if: matrix.use_cross == true
        run: cargo install cross --locked

      # Pinned to rust-toolchain.toml: `@stable` adds the matrix target to
      # stable, cargo then switches to the pinned channel and finds no std
      # for it -- "can't find crate for `core`", naming neither.
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master 03-09-2026
        with:
          toolchain: '1.94.0'
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build binary
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --bin pdfluent --target ${{ matrix.target }}
          else
            cargo build --release --bin pdfluent --target ${{ matrix.target }}
          fi

      - name: Strip binary (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: strip target/${{ matrix.target }}/release/pdfluent

      - name: Strip binary (macOS)
        if: matrix.os == 'macos-latest' || matrix.os == 'macos-13'
        shell: bash
        run: strip target/${{ matrix.target }}/release/pdfluent

      - name: Package binary
        id: package
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          ARCHIVE_NAME=pdfluent-${{ matrix.target }}-v${VERSION}

          mkdir -p dist/${ARCHIVE_NAME}
          cp target/${{ matrix.target }}/release/pdfluent${{ matrix.ext }} dist/${ARCHIVE_NAME}/
          cp LICENSE dist/${ARCHIVE_NAME}/

          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            powershell -Command "Compress-Archive -Path 'dist/${ARCHIVE_NAME}' -DestinationPath 'dist/${ARCHIVE_NAME}.zip'"
            echo "archive_name=${ARCHIVE_NAME}.zip" >> $GITHUB_OUTPUT
          else
            tar -czf dist/${ARCHIVE_NAME}.tar.gz -C dist ${ARCHIVE_NAME}
            echo "archive_name=${ARCHIVE_NAME}.tar.gz" >> $GITHUB_OUTPUT
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdfluent-${{ matrix.target }}
          path: dist/${{ steps.package.outputs.archive_name }}
          retention-days: 30

  create-release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pdfluent-*
          path: dist
          merge-multiple: true

      - name: Get version from tag
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          find . -type f \( -name "*.tar.gz" -o -name "*.zip" \) | sort | while read f; do
            sha256sum "$f"
          done > SHA256SUMS.txt
          echo "=== SHA256SUMS.txt ==="
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PDFluent v${{ steps.tag.outputs.version }}
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.version, 'beta') || contains(steps.tag.outputs.version, 'alpha') || contains(steps.tag.outputs.version, 'rc') }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
