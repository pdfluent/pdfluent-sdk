name: Release Binaries

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-13
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
          - target: x86_64-pc-windows-gnu
            os: windows-latest
            use_cross: false

    steps:
      - uses: actions/checkout@v4

      - name: Install cross for Linux targets
        if: matrix.use_cross == true
        run: |
          cargo install cross --locked

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Build binary
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --bin xfa-cli --target ${{ matrix.target }}
          else
            cargo build --release --bin xfa-cli --target ${{ matrix.target }}
          fi

      - name: Strip binary (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          strip target/${{ matrix.target }}/release/xfa-cli

      - name: Strip binary (macOS)
        if: matrix.os == 'macos-latest' || matrix.os == 'macos-13'
        shell: bash
        run: |
          strip target/${{ matrix.target }}/release/xfa-cli

      - name: Package binary
        id: package
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          ARCHIVE_NAME=xfa-cli-${{ matrix.target }}-v${VERSION}
          
          mkdir -p dist/${ARCHIVE_NAME}
          cp target/${{ matrix.target }}/release/xfa-cli dist/${ARCHIVE_NAME}/
          
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            powershell -Command "Compress-Archive -Path 'dist/${ARCHIVE_NAME}' -DestinationPath 'dist/${ARCHIVE_NAME}.zip'"
            echo "archive_name=${ARCHIVE_NAME}.zip" >> $GITHUB_OUTPUT
          else
            tar -czf dist/${ARCHIVE_NAME}.tar.gz -C dist ${ARCHIVE_NAME}
            echo "archive_name=${ARCHIVE_NAME}.tar.gz" >> $GITHUB_OUTPUT
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xfa-cli-${{ matrix.target }}
          path: dist/${{ steps.package.outputs.archive_name }}

  create-release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Get version from tag
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: xfa-cli v${{ steps.tag.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Assets
        run: |
          find dist -type f \( -name "*.tar.gz" -o -name "*.zip" \) | while read f; do
            gh release upload ${{ github.ref_name }} "$f" --clobber
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
