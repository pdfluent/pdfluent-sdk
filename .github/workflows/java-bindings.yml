name: Java Bindings

# The JNI binding's JUnit suite, on a real document, on every pull request and
# every push to master.
#
# Until 02-09-2026 nothing ran `mvn test` for crates/pdf-java. bindings.yml has
# a Java job, but it fires on release tags only and runs `cargo test`, which
# never loads the library from Java. So the Java classes could call
# System.loadLibrary("pdf_java") while Cargo.toml built libpdfluent_java, and
# every test errored with UnsatisfiedLinkError on every platform for months
# without anybody seeing it (pdfluent/pdfluent-internal#310). The rule this
# repository writes down -- a binding's test calls the method on a real
# document AND runs in CI -- was met on the first half only.
#
# ubuntu-latest on both events, unconditionally: nothing here may touch the
# persistent desktop runner on a pull request (pr_code_stays_off_the_desktop.py),
# and a push to master is cheap Linux minutes, which
# no_hosted_minutes_on_a_push.py counts rather than refuses.
#
# Debug rather than --release: the suite asks whether the binding loads and
# answers, not how fast, and a debug build shares the cache with ci.yml's
# check job. The pom defaults to target/release for a local release build; the
# override below points Surefire's forked JVM at target/debug instead.

# PUSH ON MASTER ONLY, AND THAT IS THE WHOLE COST DECISION.
#
# This job is a cargo build plus a Maven run -- one of the more expensive things
# this repository can ask of a runner. On `pull_request` it would bill hosted
# minutes on every push to every branch, and on 04-09-2026 the account stood at
# 90% of its allowance. A pull_request trigger here is the single most expensive
# line this file could carry.
#
# What master takes is a fast-forward of a commit whose content the landing
# script has already patch-id checked, so verifying on master verifies the thing
# that ships. (#1672)
on:
  push:
    branches: [master]

concurrency:
  # Same shape as ci.yml: a pull request supersedes itself, a push to master
  # gets its own group per commit and is never cancelled by the next merge.
  # One group per commit, and never cancelled: with only a push trigger there is
  # no pull request to supersede itself, and a merge must not cancel the run that
  # is checking the merge before it.
  group: java-bindings-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  jni-tests:
    name: JNI tests (mvn test)
    # Hosted minutes are for pull requests only. A push to master repeats work a
    # pull request has already done, and this job is a cargo build plus a Maven
    # run -- one of the more expensive things this repository asks a hosted
    # runner for. The desktop runner carries it instead. (#1672)
    # Plain, not the per-event expression the guard jobs use: this workflow has
    # one trigger, so a conditional would name a branch that cannot be reached.
    runs-on: [self-hosted, xfa-fast]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # First, and before any cargo call. The desktop keeps its build directory
      # between jobs, so this job lands in whatever the previous one left --
      # which is the whole reason persistent_builds_check_their_build_dir.py
      # requires this step of every compiling job on this runner. (#264)
      - name: Check persistent build directory
        run: bash scripts/ci/cargo_target_health.sh

      # Not dtolnay/rust-toolchain and not Swatinem/rust-cache. Both are for a
      # hosted runner that starts empty: one installs a toolchain, the other
      # restores a target directory. This machine has its own toolchain and its
      # own warm target directory, and restoring a cache over it is the state
      # cargo_target_health.sh exists to catch.
      #
      # What it does need is the same step ci.yml carries, for a reason measured
      # today: visual-regression.yml runs on this runner without it and every run
      # since 04-09-2026 has died on `cargo: command not found`, exit 127. The
      # runner service's PATH does not carry ~/.cargo/bin. (#292)
      - name: Cargo on PATH
        run: |
          # `$HOME` for the runner service is not necessarily where cargo was
          # installed, so adding the directory is not the same as making cargo
          # runnable. Source the env file when it is there, and then CHECK.
          set -euo pipefail
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          [ -f "$HOME/.cargo/env" ] && . "$HOME/.cargo/env" || true
          export PATH="$HOME/.cargo/bin:$PATH"
          if ! command -v cargo >/dev/null 2>&1; then
            echo "::error::cargo is not runnable on this runner. \$HOME is $HOME; \$HOME/.cargo/bin is $([ -d "$HOME/.cargo/bin" ] && echo present || echo absent). Every step below that needs the toolchain will fail with a FileNotFoundError that says nothing about this." >&2
            exit 1
          fi
          # Status-checked, not `echo $(...)`: if cargo resolves but cannot run --
          # a rustup shim with no toolchain installed -- the substitution fails,
          # `echo` still returns 0, `set -e` sees nothing, and the step reports
          # success with an empty version.
          cargo --version || {
            echo "::error::cargo is on PATH but does not run. A rustup shim without an installed toolchain does this: command -v cargo succeeds and every build fails." >&2
            exit 1
          }

      # No actions/setup-java here. The desktop has its own JDK and Maven, and
      # installing a second toolchain over them would test something other than
      # what a developer on that machine runs.
      # NOT an assumption. On 04-09-2026 the desktop carried openjdk 17.0.20 and
      # Apache Maven 3.9.12, measured rather than expected -- but a runner is a
      # machine somebody maintains, and a job that silently does something else
      # after a reinstall is worse than one that stops. This says which of the
      # two is missing instead of failing later inside `mvn`.
      - name: The runner has a JDK and Maven
        run: |
          set -euo pipefail
          missing=""
          command -v java >/dev/null 2>&1 || missing="java"
          command -v mvn  >/dev/null 2>&1 || missing="${missing:+$missing and }mvn"
          if [ -n "$missing" ]; then
            echo "::error::$missing not on PATH for this runner. The JNI suite needs a JDK 17+ and Maven; install them or point this job back at a hosted runner." >&2
            exit 1
          fi
          java -version
          mvn --version | head -1

      - name: Build the JNI library
        run: cargo build -p pdf-java --locked

      # Checked by name before Maven starts. A missing or misnamed library
      # surfaces inside the JVM as UnsatisfiedLinkError wrapped in
      # ExceptionInInitializerError and NoClassDefFoundError, which points at
      # the tests rather than at the build. This is the exact fault the
      # workflow exists to catch, so it is named here rather than left to be
      # read out of a stack trace.
      - name: The library the Java side loads is the one cargo built
        run: |
          set -euo pipefail
          test -f target/debug/libpdfluent_java.so || {
            echo "::error::target/debug/libpdfluent_java.so was not built; Cargo.toml [lib] name and System.loadLibrary(...) must agree" >&2
            ls -la target/debug/*.so 2>/dev/null || true
            exit 1
          }
          # Derived, not listed. Three files stood here by hand while five in this
          # crate call System.loadLibrary -- and two of the three uncovered ones
          # arrived in the same change that added this check. A hand-kept list stops
          # matching the tree the moment somebody adds a file, which is the failure
          # this step exists to catch.
          #
          # Bounded to crates/pdf-java deliberately: bindings/java's NativeLoader
          # calls System.loadLibrary(JNI_LIB_NAME) through a constant, so a literal
          # grep would call it wrong when it is right.
          mapfile -t loaders < <(grep -rl 'System\.loadLibrary' crates/pdf-java --include='*.java' | sort)
          # A floor: an empty glob would walk the loop below zero times and pass
          # without reading a single file.
          if [ "${#loaders[@]}" -lt 5 ]; then
            echo "::error::found ${#loaders[@]} System.loadLibrary caller(s) under crates/pdf-java, expected at least 5; the search is broken, not the tree" >&2
            exit 1
          fi
          for f in "${loaders[@]}"; do
            grep -q 'System.loadLibrary("pdfluent_java")' "$f" || {
              echo "::error::$f does not load pdfluent_java" >&2; exit 1; }
          done

      - name: Rust unit tests of the binding
        run: cargo test -p pdf-java --locked

      # Not -q: the "Tests run: N, Failures: F, Errors: E" lines are the
      # evidence that tests ran, and -q hides them. failIfNoTests is set in the
      # pom, so an empty run fails instead of reporting green.
      - name: JUnit suite against the built library
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress \
              -f crates/pdf-java/pom.xml \
              -Dnative.lib.dir="$GITHUB_WORKSPACE/target/debug" \
              clean test

      # Surefire's own XML is the record. Two floors, not one sum: a total of 5
      # was satisfied by the licence suite alone (12), so deleting the document
      # suite -- the one this workflow exists for -- stayed green. Now the
      # document report must be present with its 6 tests, and the total must be
      # the 18 the two suites add up to. (review of #1672)
      - name: The document suite ran, and so did the rest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          reports = "crates/pdf-java/target/surefire-reports"
          doc = f"{reports}/TEST-com.pdfluent.PdfluentDocumentJniTest.xml"
          per = {f: int(ET.parse(f).getroot().get("tests", "0"))
                 for f in glob.glob(f"{reports}/TEST-*.xml")}
          total = sum(per.values())
          for f, n in sorted(per.items()):
              print(f"  {n:3d}  {f.rsplit('/', 1)[-1]}")
          print(f"surefire reports {total} test(s) in {len(per)} report(s)")
          bad = []
          if doc not in per:
              bad.append(f"{doc.rsplit('/', 1)[-1]} is missing: the document suite did not run")
          elif per[doc] < 6:
              bad.append(f"the document suite ran {per[doc]} test(s), floor is 6")
          if total < 18:
              bad.append(f"{total} test(s) in total, floor is 18")
          for b in bad:
              print(f"::error::{b}", file=sys.stderr)
          sys.exit(1 if bad else 0)
          PY
