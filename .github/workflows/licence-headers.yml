# Every source file carries the dual licence header (#301).
#
# Its own workflow rather than a step in ci.yml, for the reason
# document-register.yml carries at length: ci.yml has a workflow-wide
# `paths-ignore: '**.md'`, and a change that adds a source file alongside only
# Markdown would never start it. A header guard that does not run on the commit
# that adds a file is a header guard that arrives one commit too late.
#
# Nothing is filtered here. It reads the tree and two constants; running it on
# every event costs seconds.
name: Licence headers

# NO PULL_REQUEST TRIGGER WHILE THIS REPOSITORY IS PRIVATE (#333).
#
# Measured 05-09-2026 08:00: the 2,000 included minutes were gone and the account
# had begun billing an Actions budget. In the fourteen hours after #328 landed,
# this repository still started about 180 hosted jobs -- almost all of them a
# guard running twice, once for the pull request and once for the push that
# followed it, on work the local pre-push gate had already refused to let out.
#
# A pull request here is not a review boundary: there is one contributor, master
# only ever receives fast-forwards of heads that already passed `scripts/ci/
# local_ci_gate.sh`, and that gate runs these same guards before the branch
# reaches the remote at all. So the second run bought nothing and was billed.
#
# THE PUBLIC PHASE, written down so this is a decision and not a habit: when
# `pdfluent/engine` (or its public successor) accepts a pull request
# from anyone but the owner, that pull request IS the review boundary, the local
# gate no longer covers it, and these triggers come back -- with the placement
# rules in orchestration_stays_hosted.py deciding where they run.
on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  # ONE RUN PER REF, AND THE NEWEST COMMIT WINS (#350).
  #
  # Same correction as document-register.yml, and the same reason it is safe:
  # this guard sweeps the tree for files without a licence header, so the newest
  # commit's answer already covers every commit behind it. Only a guard that
  # judges a RANGE loses something when its run is cancelled, and this is not
  # one. Keeping a run per landing cost a queue on the one desktop runner.
  group: licence-headers-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licence-header-guard:
    name: Every source file carries the dual header
    # Hosted, and on both events. The guard reads files and compares strings; it
    # needs no corpus and no warm cache, so the persistent desktop adds nothing
    # -- and on a pull request the script it runs is PR-authored code, which
    # stays off that machine (scripts/ci/pr_code_stays_off_the_desktop.py).
    # The desktop runner, plainly. The per-event expression that used to stand
    # here chose a hosted runner for a pull request; with no pull_request
    # trigger left (#333) its condition can only be true, so the expression
    # described a branch that no longer exists. An expression nobody can reach
    # reads as a rule and enforces nothing.
    #
    # Python file scans, seconds of work, no compilation. The persistent-runner
    # rule in orchestration_stays_hosted.py is about code a caller chooses --
    # a pull request's head or a dispatch ref -- and a push to master is neither:
    # it is already merged.
    runs-on: [self-hosted, xfa-local-checks]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The test first, so a guard that has stopped recognising anything is
      # caught before its verdict on the tree is read. Both steps run whatever
      # the other did, so a red test never hides a red tree.
      - name: The header guard bites in both directions
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_header_sweep.py
      - name: Every source file carries the dual header
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/header_sweep.py
