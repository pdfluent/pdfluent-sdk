# The workspace build for a push to master, on a throwaway instance.
#
# `check`, `test`, `clippy` and `fmt` used to run on [self-hosted, xfa-fast] for
# a push. That is the desktop: four cores, and it also carries the corpus, the
# warm cargo cache and the runner registration token. One push to master fires
# eight workflows at once, and the measurement on 28-08-2026 showed two CI
# systems compiling on it simultaneously -- load 5.6 on four cores, with GitLab's
# `cargo test --workspace` 54 minutes in and a GitHub Runner.Worker 22 minutes in.
# Nothing was orphaned. The saturation was the design (#267).
#
# The four jobs are one job here, on one instance. Four instances would spend
# more on boot and cache restore than the parallelism buys back, and they would
# each pay the same snapshot download.
#
# WHY THIS IS NOT THE `--ref master` DANCE THE OTHER EPHEMERAL WORKFLOWS DO
#
# Those are dispatched, and a dispatch lets the caller choose the ref -- so the
# workflow body itself could come from a branch. This one triggers on a push to
# master, so the body is master's by construction. There is no ref to choose.
#
# scripts/ci/orchestration_stays_hosted.py knows the difference: it treats
# `push` with a `branches: [master]` filter as pinned, and `workflow_dispatch`
# as not.

name: CI (ephemeral Hetzner)

on:
  # NO pull_request trigger, since 02-09-2026.
  #
  # It had one from 28-08: a cpx42 has eight cores against a hosted runner's two
  # to four, so the heavy PR build was cheaper and quicker there. Then the
  # Hetzner VPS was cancelled on 24-08 and nobody removed the trigger. Measured
  # 02-09: of the last forty ephemeral runs, nineteen cancelled, four failed,
  # five pending, eleven queued, one in progress -- and NONE succeeded, while
  # `create-runner` kept reporting success. So it was still provisioning
  # instances, per pull request, and producing nothing usable. Every push queued
  # another.
  #
  # The workflow stays: it is the only route to an isolated runner if a provider
  # returns, and #311 keeps create-runner/reap pinned to the base revision for
  # when it does. What is removed is the trigger that made it run by itself.
  # (#311)
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'CHANGELOG.md'
      - '.github/**.md'

concurrency:
  group: ci-ephemeral-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  HCLOUD_SNAPSHOT_ID: '425004761' # xfa-golden-ci-base-v2

jobs:
  create-runner:
    # Without this the create action polls for a runner that may never
    # register, holding the one desktop runner while everything else
    # queues behind it. Fifteen minutes of that is what a wedged
    # provisioning looked like (#274).
    timeout-minutes: 35
    runs-on: [self-hosted, xfa-fast]
    outputs:
      label: ${{ steps.hergebruik.outputs.label || steps.create.outputs.label }}
      server_id: ${{ steps.create.outputs.server_id }}
      reused: ${{ steps.hergebruik.outputs.reused }}
    steps:
      # Reuse before buying. Hetzner bills a started hour in full, so an
      # instance already up and idle is free for the rest of that hour, and the
      # runner is registered without --ephemeral so it takes more than one job.
      # A forty-second delay was the earlier answer; this is the better one,
      # because it costs nothing and saves a whole machine (#274).
      # On a pull_request this job runs on the persistent desktop, because
      # creating and reaping instances IS host work and cannot move. So the code
      # it executes must not be the pull request's: `scripts/ci/*.sh` and
      # `*.py` here are run directly, and on a PR the checkout would be whatever
      # the PR says they are. Pinning the base revision means only merged code
      # ever runs as the runner user. (#311)
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
      - name: Reuse an idle instance if one is already up
        id: hergebruik
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          RUNNER_PAT: ${{ secrets.GH_RUNNER_PAT }}
        run: bash scripts/ci/reuse_an_idle_instance.sh

      - name: Create ephemeral Hetzner runner
        id: create
        if: steps.hergebruik.outputs.reused != 'true'
        uses: Cyclenerd/hcloud-github-runner@v1
        with:
          mode: create
          github_token: ${{ secrets.GH_RUNNER_PAT }}
          hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          server_type: cx53
          location: fsn1
          image: ${{ env.HCLOUD_SNAPSHOT_ID }}


  workspace:
    needs: create-runner
    runs-on: ${{ needs.create-runner.outputs.label }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The snapshot image carries cargo and rustc but not the components: the
      # first run of this workflow died on `no such command: fmt`. It also
      # symlinks cargo into /usr/local/bin, which shadows rustup's shims, so the
      # toolchain rustup installs has to be put in front of PATH by hand.
      # NOT @stable. `rust-toolchain.toml` pins 1.94.0, so cargo switches to
      # that channel and the components this action added to `stable` are on a
      # toolchain nothing here uses -- which is why `cargo fmt` kept coming back
      # "no such command" through three different fixes. Same trap as #1539,
      # where a cross target was installed on the wrong toolchain.
      #
      # `rustup component add` with no toolchain argument acts on the active
      # one, which is the pinned one, which is the one that will run.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Add rustfmt and clippy to the pinned toolchain
        run: rustup component add rustfmt clippy

      # `/usr/local/bin/cargo` on this image is a plain binary, not a rustup
      # shim, so it does not see the components rustup just installed -- which
      # is why `cargo fmt` kept answering "no such command" after the component
      # was demonstrably up to date. `rustup which cargo` gives the path of the
      # active toolchain's own cargo, and that one knows about them.
      # `cargo fmt` does not live inside cargo: it runs `cargo-fmt`, which cargo
      # looks for on PATH. So calling the toolchain's own cargo was not enough --
      # its bin directory still was not on PATH, and that is where `cargo-fmt`
      # and `cargo-clippy` sit.
      #
      # `dirname "$(rustup which cargo)"` is that directory. Earlier attempts
      # pointed at $CARGO_HOME/bin, which on this image is /.cargo/bin and does
      # not exist at all.
      - name: Put the pinned toolchain's bin directory on PATH
        run: |
          toolchain_bin="$(dirname "$(rustup which cargo)")"
          echo "$toolchain_bin" >> "$GITHUB_PATH"
          echo "added $toolchain_bin"
          ls "$toolchain_bin"
      # The image carries cargo, rustc and rustup as plain binaries in
      # /usr/local/bin. CARGO_HOME says /.cargo and that directory does not
      # exist; RUSTUP_HOME is unset. So neither $GITHUB_PATH nor a PATH export
      # could point at the toolchain rustup installed -- there was nothing at
      # the path they named.
      #
      # `cargo ...` asks rustup where its own toolchain is,
      # which is the one question that does not depend on any of that.
      - name: Show which toolchains are on this instance
        continue-on-error: true
        run: |
          echo "CARGO_HOME=${CARGO_HOME:-unset}  RUSTUP_HOME=${RUSTUP_HOME:-unset}"
          which -a cargo rustc rustup || true
          rustup which cargo || true
          rustup show || true
          rustup component list --installed || true
          for d in "${CARGO_HOME:-}/bin" "$HOME/.cargo/bin" /usr/local/bin; do
            [ -d "$d" ] && { echo "--- $d"; ls "$d" | head -12; }
          done

      - uses: Swatinem/rust-cache@v2

      # Ordered cheapest-first so an obvious break reports in seconds rather
      # than after the test suite. `--no-fail-fast` on the tests, because one
      # failing crate should not hide the state of the other forty.
      - name: fmt
        run: cargo fmt --all --check
      - name: check
        run: cargo check --workspace --exclude pdf-desktop
      - name: clippy
        run: cargo clippy --workspace --exclude pdf-desktop -- -D warnings
      - name: test
        run: cargo test --workspace --exclude pdf-desktop --no-fail-fast

      # PDF/A, on the pipeline that blocks a merge (#286).
      #
      # `verapdf.yml` used to do this on ubuntu-latest and it measured nothing:
      # it validated the five XFA *input* fixtures under corpus/ -- ordinary
      # government forms, which are not PDF/A and never will be -- with a flag
      # veraPDF rejects, and then exited 0 because the workflow called the
      # wrapper without `--ci`. It posted "Pass Rate 0%" on #1543 under a green
      # tick. The file is gone; this is what replaces it.
      #
      # Here rather than in its own workflow because a second workflow on
      # `pull_request` with a create-runner would buy a second instance for the
      # same event -- the thing one_instance_per_event.py exists to stop. This
      # instance is already up and already has the workspace built.
      # `if: ${{ !cancelled() }}` on all three, because without it they only ran
      # while everything above was green -- and `test` is failing on master, so
      # the PDF/A gate has been skipped on every run since it was written. It
      # has never produced a Linux measurement, which is exactly why FLOORS has
      # no `linux` entry to gate against. A gate that never runs cannot be
      # calibrated, and it looks identical in the summary to one that passed.
      - name: Set up Java for veraPDF
        if: ${{ !cancelled() }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install veraPDF and mutool
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          # The runner user on this image may already be root, in which case
          # there is no sudo to call and asking for one fails the step for the
          # wrong reason.
          SUDO=""
          [ "$(id -u)" -eq 0 ] || SUDO="sudo"
          # mutool reads the converted text back. An independent extractor on
          # purpose: grading our own output with our own parser measures the
          # parser. No `|| true` on either -- see scripts/ci/install_verapdf.sh.
          $SUDO apt-get update -qq
          $SUDO apt-get install -y -qq mupdf-tools unzip
          $SUDO env "JAVA_HOME=${JAVA_HOME}" "PATH=${PATH}" \
            bash scripts/ci/install_verapdf.sh /opt/verapdf
          echo "/opt/verapdf" >> "$GITHUB_PATH"
          mutool -v
      - name: PDF/A conversion output conforms and keeps its text
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo build --release -p pdf-manip --example pdfa_convert_real
          # Exit 3 is "measured, did not judge" -- this platform has no
          # recorded floor yet, so the script printed the numbers to record and
          # deliberately did not gate. Under `set -e` that would fail the job
          # exactly like a real failure, which would keep every pull request red
          # until somebody commits a Linux floor: the outage the exit-3 branch
          # exists to avoid, reintroduced by the caller. (codex, #1617)
          #
          # 0 and 3 pass; anything else fails. When "linux" joins BLOKKEERT this
          # stays correct, because a gated platform never returns 3.
          set +e
          python3 scripts/ci/pdfa_output_conformance_gate.py \
            --converter target/release/examples/pdfa_convert_real \
            --verapdf /opt/verapdf/verapdf \
            --out "${RUNNER_TEMP}/pdfa-output"
          rc=$?
          set -e
          case "$rc" in
            0) ;;
            3) echo "::notice::PDF/A gate measured but did not judge (no floor for this platform yet). See the log for the numbers to record." ;;
            *) exit "$rc" ;;
          esac

      # What used to be four workflows, each creating its own instance. One push
      # fired them together and Hetzner made five cpx42s inside five minutes
      # (#275). They are steps on the one instance now; the workflows they came
      # from are still there for a manual dispatch.
      - name: xfa regression
        run: |
          cargo test -p pdf-xfa -p xfa-layout-engine -p xfa-dom-resolver --release
          cargo test -p pdf-xfa --test '*' --release

      - name: wasm surface
        run: |
          # Not plain `rustup target add`: that lands on the default toolchain,
          # which is `stable` here, while rust-toolchain.toml pins 1.94.0 and
          # that is what cargo will use. Same trap as #1539 -- a target on the
          # wrong toolchain gives "can't find crate for `core`". Codex, #1547.
          rustup target add wasm32-unknown-unknown \
            --toolchain "$(rustup show active-toolchain | cut -d" " -f1)"
          cargo check --target wasm32-unknown-unknown -p pdfluent --tests
          cargo test -p pdfluent --test wasm_surface

      # This step built the extractor and stopped there, which measures
      # nothing: the drift it is named after is the difference between what
      # the extractor produces and what is committed, and neither half was
      # computed. docs-drift-guard.yml had been pointed at this step as the
      # place the work moved to (#275), so between 28-08 and 31-08-2026 the
      # check existed twice and ran nowhere (#290). Re-extract and diff, on the
      # machine that already paid for the build.
      #
      # Advisory on purpose, as it was before: the website documents API the
      # SDK does not have yet (#1488), so there is real drift today and it must
      # report without blocking. When #1488 closes, drop continue-on-error.
      # The corpus gate, on every pull request, automatically (#276).
      #
      # `crash-guard.yml` used to be this check. It asked for a runner
      # labelled `xfa-corpus` that was never registered, so every automatic
      # run of it queued until GitHub abandoned it a day later -- never red,
      # never run -- and it read a corpus that lived on one external disk,
      # which has since stopped answering reads.
      #
      # This reads the gate corpus instead: five hundred PDFs from three
      # public licensed suites, fetched by URL at a pinned upstream commit
      # and verified against a SHA-256 each. About 35 MB, twenty seconds
      # cold, nothing at all when the instance is reused. Small enough that
      # it can run every time, which is the only property that made the old
      # check worth having.
      #
      # No `continue-on-error`. A gate that cannot fail is the thing this
      # replaced.
      - name: Fetch the gate corpus and prove it is the pinned set
        run: |
          python3 scripts/ci/fetch_gate_corpus.py \
            --manifest corpus/GATE_CORPUS_MANIFEST.json \
            --out corpus/gate

      - name: Nothing in the gate corpus crashes or hangs the renderer
        run: |
          cargo build --release -p xfa-cli --bin pdfluent
          python3 scripts/ci/gate_corpus_no_crash.py \
            --binary target/release/pdfluent \
            --corpus corpus/gate \
            --known corpus/GATE_CORPUS_KNOWN_CRASHES.json \
            --workers 8
      # SSIM regression, from #1349 -- opened 25-04-2026, never merged, and its
      # own workflow ran once and failed. It is not resurrected as a workflow:
      # `ssim-gate.yml` was `runs-on: ubuntu-latest` and compiles the CLI, so it
      # can be neither hosted (zero hosted minutes) nor on the persistent runner
      # (orchestration_stays_hosted refuses jobs that compile there). A fifth
      # workflow provisioning its own instance is what #275 removed. So it lives
      # here, on the instance this push already paid for.
      #
      # The gate itself is unchanged: 50 stratified-random PDFs from the manifest,
      # mean SSIM >= 0.94 and >= 35% fully correct. `check_ssim_gate.py` excludes
      # degenerate / oracle_fault / not_found from both figures so a flaky oracle
      # cannot poison the verdict -- which is why the "SSIM measures the binary
      # oracle artefact" objection does not apply to it.
      - name: SSIM regression against the pinned fifty
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          # The pinned fifty are IRS and USCIS forms named in
          # corpus/SSIM_GATE_MANIFEST.json as paths inside the repository. Those
          # files left the repository on 26-05-2026 in 2e3d2052 ("M9-A release
          # hygiene"), and the gate stayed pinned to them: 48 of the 50 have been
          # missing ever since. `prepare_ci_corpus.py` does fail on that -- "too
          # many failures (48/50)" -- so this was never a silent pass. But it has
          # been failing on its INPUT rather than on rendering quality for three
          # months, and from the outside that is indistinguishable from a real
          # SSIM regression.
          #
          # The fetch step above does not supply them either: it writes the 500
          # pdfjs/pdfbox/veraPDF documents into corpus/gate, and none of the fifty
          # pinned names appears among them. Checked on name and on path: 0 of 50.
          #
          # So the step says what is missing and stops, in the shape the rest of
          # this repository uses for a measurement that could not be made. It is
          # NOT re-pinned to whatever the fetch happens to provide: the 0.94 mean
          # and the 35% fully-correct floor are calibrated against these fifty
          # documents, and a threshold carried over to a different corpus is a
          # number that has stopped meaning anything. The gate returns with its
          # own corpus, in the ephemeral snapshot. (#276)
          ontbreekt=$(python3 - <<'PY'
          import json, pathlib
          e = json.load(open("corpus/SSIM_GATE_MANIFEST.json"))["entries"]
          print(sum(1 for x in e if not pathlib.Path(x["source"]).is_file()), len(e))
          PY
          )
          set -- $ontbreekt
          if [ "$1" -gt 0 ]; then
            echo "SKIPPED (not a pass): $1/$2 pinned forms not on this runner." >&2
            echo "  corpus/SSIM_GATE_MANIFEST.json names them as paths inside the" >&2
            echo "  repository; they were removed in 2e3d2052 on 26-05-2026 and the" >&2
            echo "  gate corpus fetched above contains none of them. No page was" >&2
            echo "  rendered and no SSIM was computed, so this is not a regression" >&2
            echo "  and not a pass. The 0.94/35% thresholds return with the corpus," >&2
            echo "  not as lower numbers. (#276)" >&2
            exit 3
          fi
          cargo build --release -p xfa-cli --bin pdfluent
          python3 scripts/prepare_ci_corpus.py \
            --manifest corpus/SSIM_GATE_MANIFEST.json \
            --out corpus/ssim-gate-50
          python3 scripts/run_gate_ssim.py \
            --binary target/release/pdfluent \
            --corpus corpus/ssim-gate-50 \
            --out "${RUNNER_TEMP}/ssim_gate_result.json" \
            --threshold 0.94 --dpi 150 --workers 2
          # Evaluate, then enforce, so the report exists even when it fails.
          set +e
          python3 scripts/check_ssim_gate.py \
            --result "${RUNNER_TEMP}/ssim_gate_result.json" \
            --mean-ssim-threshold 0.94 \
            --fully-correct-threshold 35.0 \
            --report "${RUNNER_TEMP}/ssim_gate_report.md" \
            --summary-json "${RUNNER_TEMP}/ssim_gate_summary.json"
          rc=$?
          set -e
          [ -f "${RUNNER_TEMP}/ssim_gate_report.md" ] && cat "${RUNNER_TEMP}/ssim_gate_report.md"
          exit "$rc"

      - name: docs drift (advisory)
        continue-on-error: true
        run: |
          cargo build -p pdfluent-snippet-extract --release
          stamp=tools/pdfluent-snippet-extract/cache/.last-fetched
          if [ ! -s "$stamp" ]; then
            echo "SKIPPED (not a pass): $stamp is missing or empty, so the" >&2
            echo "extract has no deterministic --fetched tag and its output" >&2
            echo "would differ from the committed files for that reason alone." >&2
            exit 1
          fi
          cargo run --release -p pdfluent-snippet-extract -- \
            --manifest  tools/pdfluent-snippet-extract/manifest.toml \
            --cache-dir tools/pdfluent-snippet-extract/cache \
            --out-dir   crates/pdfluent/tests/web_examples \
            --fetched   "$(cat "$stamp")"
          # `git diff` alone misses the case this check exists for. Add a page
          # to the manifest and forget to commit its generated .rs, and the
          # extractor creates that file as untracked -- which `git diff` does
          # not see, so the guard reports no drift for precisely the
          # manifest-expansion it is meant to catch. (codex, #1610)
          nieuw=$(git status --porcelain -- crates/pdfluent/tests/web_examples/ \
                  | awk '$1 == "??" { print $2 }')
          if ! git diff --exit-code --stat -- crates/pdfluent/tests/web_examples/ || [ -n "$nieuw" ]; then
            if [ -n "$nieuw" ]; then
              echo "Generated but never committed:"
              printf '  %s\n' $nieuw
            fi
            echo "::warning::Docs drift: the extractor's output differs from the committed tests/web_examples/*.rs. Advisory until #1488."
            git checkout -- crates/pdfluent/tests/web_examples/
            [ -n "$nieuw" ] && rm -f $nieuw
            exit 1
          fi

      # The WASM build that wasm.yml used to do on a push to master. Publishing
      # stays there, on tags; this is the build and the website rebuild.
      # One build, not two. These were separate steps that each ran
      # `rustup target add`, installed wasm-pack over the network and then ran
      # the same `wasm-pack build --release --target web` on the same crate --
      # 552s and 517s of a 1200s pipeline, producing the same artefact twice.
      #
      # Measured on run 33270735898: those two steps were 88% of the job, while
      # `check` took 11s and `clippy` 16s. The Rust cache was never the problem.
      - name: wasm build
        run: |
          # Not plain `rustup target add`: that lands on the default toolchain,
          # which is `stable` here, while rust-toolchain.toml pins 1.94.0 and
          # that is what cargo will use. Same trap as #1539 -- a target on the
          # wrong toolchain gives "can't find crate for `core`". Codex, #1547.
          rustup target add wasm32-unknown-unknown \
            --toolchain "$(rustup show active-toolchain | cut -d" " -f1)"
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          wasm-pack build --release --target web crates/xfa-wasm

      # What the old "wasm-opt parity" step did was build the artefact a second
      # time and then run `ls -l` on it. It compared nothing, and it carried
      # continue-on-error, so it could not have failed either way. Nine minutes
      # for a file listing.
      #
      # This checks the property the name promises: wasm-pack runs wasm-opt on a
      # release build, so the shipped artefact must be smaller than the raw
      # target output. If wasm-opt silently stops running -- a toolchain change,
      # a flag, a version bump -- the sizes converge and this says so.
      - name: wasm-opt actually ran
        run: |
          set -euo pipefail
          shipped="crates/xfa-wasm/pkg/xfa_wasm_bg.wasm"
          raw="target/wasm32-unknown-unknown/release/xfa_wasm.wasm"
          for f in "$shipped" "$raw"; do
            [ -f "$f" ] || { echo "SKIPPED (not a pass): $f is missing" >&2; exit 0; }
          done
          s=$(wc -c < "$shipped"); r=$(wc -c < "$raw")
          echo "raw ${r} bytes, shipped ${s} bytes"
          if [ "$s" -ge "$r" ]; then
            echo "FAIL: the shipped wasm is not smaller than the raw build, so" >&2
            echo "wasm-opt did not run. The artefact still works; it is just" >&2
            echo "bigger than it should be, which is the kind of regression" >&2
            echo "nobody notices until a download budget does." >&2
            exit 1
          fi

      - name: Trigger website rebuild
        if: github.event_name == 'push' && env.WEBSITE_DEPLOY_TOKEN != ''
        env:
          WEBSITE_DEPLOY_TOKEN: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
          repository: pdfluent/pdfluent-playground
          event-type: wasm-updated

  # No delete-runner. Deleting after every run threw away an hour that was
  # already paid for and made the next push buy another. hetzner-orphan-sweep
  # removes an idle instance once its billed hour is nearly up, which is the
  # moment keeping it stops being free.

  # Reaping has to happen after the work, not before it. Attached to
  # create-runner it could never delete anything: the sole instance is either
  # claimed by this run and excluded, or freshly made and inside its paid hour.
  # Here the runner has been released, so an instance past its billed hour is
  # genuinely idle and can go. Younger ones survive on age and stay reusable.
  #
  # On the push because the */30 schedule fired twice in a day (#279). The
  # schedule stays as a backstop.
  reap:
    needs: [create-runner, workspace]
    if: always()
    runs-on: [self-hosted, xfa-fast]
    timeout-minutes: 5
    steps:
      # On a pull_request this job runs on the persistent desktop, because
      # creating and reaping instances IS host work and cannot move. So the code
      # it executes must not be the pull request's: `scripts/ci/*.sh` and
      # `*.py` here are run directly, and on a PR the checkout would be whatever
      # the PR says they are. Pinning the base revision means only merged code
      # ever runs as the runner user. (#311)
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
      - name: Delete instances that are idle and past their billed hour
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          GH_RUNNER_PAT: ${{ secrets.GH_RUNNER_PAT }}
        run: python3 scripts/ci/sweep_idle_instances.py
