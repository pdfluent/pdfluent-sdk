name: Bindings CI

on:
  push:
    tags: ['v*.*.*', 'python/v*']
  workflow_dispatch:

concurrency:
  group: bindings-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    defaults:
      run:
        working-directory: crates/pdf-python
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/pdf-python -> target
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install maturin
        run: pip install maturin pytest
      - name: Build wheel
        run: maturin build
      - name: Install in dev mode and run tests
        run: |
          maturin develop
          pytest tests/

  node:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Build
        run: cargo build -p pdf-node
      - name: Test
        run: cargo test -p pdf-node

  java:
    name: Java 11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
      - name: Build
        run: cargo build -p pdf-java
      # Here rather than in ci.yml's guard jobs: it runs `cargo run --release
      # -p pdf-manip`, which is 0.09 s against a warm target and 584 crates cold.
      # In orchestration-guard it would have been paid per pull request on a
      # hosted runner once #1649 moves that job -- a full cold build to compare
      # 1090 bytes. This job already needs the toolchain for the binding the
      # fixture belongs to. (T1 review, #1654)
      - name: The Java binding fixture is the one we generate
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/the_java_fixture_is_the_one_we_generate.py
      - name: Test
        run: cargo test -p pdf-java
