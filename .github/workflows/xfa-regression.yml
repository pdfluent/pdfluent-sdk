name: XFA Regression Suite

on:
  # Automatic triggers removed on 28-08-2026. This work now runs on the
  # shared instance that ci-ephemeral.yml creates: one server per push,
  # not one per workflow. Five workflows each provisioning their own gave
  # five cpx42s inside five minutes for a single push (#275).
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  xfa-tests:
    name: XFA Regression Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run XFA unit tests
        run: cargo test -p pdf-xfa -p xfa-layout-engine -p xfa-dom-resolver --release

      - name: Run XFA integration tests
        run: cargo test -p pdf-xfa --test '*' --release
