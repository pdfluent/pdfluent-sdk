# A deletion declares itself (#297).
#
# Its own workflow, and that is the whole point. ci.yml carries a workflow-wide
# `paths-ignore: '**.md'`, so a pull request that ONLY removes Markdown never
# starts it -- and a Markdown removal is exactly what this guard exists to
# notice. The guard lived in ci.yml's commit-identity-guard job and could not run
# for the case its own tests cover. (codex, #1635)
#
# Nothing is filtered here. It is two Python scripts and a checkout; running it
# on every event costs less than the class of change it would otherwise miss.
name: A deletion declares itself

# NO PULL_REQUEST TRIGGER WHILE THIS REPOSITORY IS PRIVATE (#333).
#
# Measured 05-09-2026 08:00: the 2,000 included minutes were gone and the account
# had begun billing an Actions budget. In the fourteen hours after #328 landed,
# this repository still started about 180 hosted jobs -- almost all of them a
# guard running twice, once for the pull request and once for the push that
# followed it, on work the local pre-push gate had already refused to let out.
#
# A pull request here is not a review boundary: there is one contributor, master
# only ever receives fast-forwards of heads that already passed `scripts/ci/
# local_ci_gate.sh`, and that gate runs these same guards before the branch
# reaches the remote at all. So the second run bought nothing and was billed.
#
# THE PUBLIC PHASE, written down so this is a decision and not a habit: when
# `jasperdew/xfa-native-rust` (or its public successor) accepts a pull request
# from anyone but the owner, that pull request IS the review boundary, the local
# gate no longer covers it, and these triggers come back -- with the placement
# rules in orchestration_stays_hosted.py deciding where they run.
on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  # A push gets its OWN group, and is never cancelled. Two pushes to master in
  # quick succession used to share one: A carries an undeclared deletion, B is
  # innocent, A's run is cancelled, and B compares A..B where the file is already
  # absent on both sides -- green, with A never judged. A cancelled run is not a
  # passing run, and here it silently became one. (codex, #1635)
  group: deletions-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deletions-guard:
    name: A deletion declares itself
    # Hosted for pull_request, the persistent desktop only for push.
    #
    # This job executes scripts/ci/*.py FROM THE CHECKOUT, so on a pull_request
    # those files are PR-authored code. ci.yml lines 13-24 state the boundary
    # outright -- xfa-fast is a persistent desktop, not an isolated ephemeral
    # runner, so "only code that's already merged (push) touches it" -- and this
    # workflow broke it on its first day. The repo is slated to go public, at
    # which point any stranger's PR would run as the runner user.
    #
    # Push events keep xfa-fast: a spending limit disables hosted runners, and a
    # check that stops running exactly when the bill does is not a check.
    # (codex, #1635)
    # The desktop runner, plainly. The per-event expression that used to stand
    # here chose a hosted runner for a pull request; with no pull_request
    # trigger left (#333) its condition can only be true, so the expression
    # described a branch that no longer exists. An expression nobody can reach
    # reads as a rule and enforces nothing.
    #
    # Python file scans, seconds of work, no compilation. The persistent-runner
    # rule in orchestration_stays_hosted.py is about code a caller chooses --
    # a pull request's head or a dispatch ref -- and a push to master is neither:
    # it is already merged.
    runs-on: [self-hosted, xfa-fast]
    steps:
      - uses: actions/checkout@v4
        with:
          # Without the base commit there is no range to read, and over a
          # shallow clone `git log <base>..<head>` prints nothing and exits 0 --
          # the state this guard exists to refuse, dressed as a pass.
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # ubuntu-latest has no PyYAML, and pr_code_stays_off_the_desktop.py reads
      # workflow files. Without this every pull request went red on an import.
      # (codex, #1635)
      - name: Install PyYAML
        if: ${{ !cancelled() }}
        run: pip install --quiet pyyaml
      - name: The runner-boundary guard bites in both directions
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_pr_code_stays_off_the_desktop.py
      - name: A pull request stays off the persistent runner
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/pr_code_stays_off_the_desktop.py
      - name: The deletion guard bites in both directions
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_a_deletion_declares_itself.py
      - name: The wiring guard bites in both directions
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_every_test_is_run.py
      - name: The step classifier bites in both directions
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_guards_do_not_hide_behind_each_other.py
      - name: The header sweep bites in both directions
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_header_sweep.py
      - name: Every test file is executed by something
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/every_test_is_run.py
      - name: Every deletion is declared by the commit that performs it
        if: ${{ !cancelled() }}
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          BASE="${PR_BASE:-}"
          EXACT=""
          if [ -z "$BASE" ]; then
            BASE="${PUSH_BEFORE:-}"
            # A push reports where the branch actually WAS. Resolving a merge
            # base from it loses anything added between the common ancestor and
            # that tip, so a force-push could drop a file and report nothing.
            # (codex, #1635)
            EXACT="--exact-base"
          fi
          # A brand-new branch has no "before"; git reports all-zeros for it.
          case "$BASE" in
            ""|0000000000000000000000000000000000000000)
              echo "SKIPPED (not a pass): this event carries no base revision, so" >&2
              echo "  there is nothing to compare against and no deletion could be" >&2
              echo "  detected. That is not the same as a clean branch." >&2
              exit 3
              ;;
          esac
          git cat-file -e "$BASE^{commit}" 2>/dev/null || git fetch -q origin "$BASE"
          python3 scripts/ci/a_deletion_declares_itself.py --base "$BASE" $EXACT
