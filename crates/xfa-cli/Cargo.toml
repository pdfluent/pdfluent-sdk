[package]
name = "xfa-cli"
version.workspace = true
edition.workspace = true
# Deliberately non-publishable to crates.io. This crate bundles internal
# research/corpus binaries (xfa-collector, corpus-render, edge-case-analyzer,
# accuracy-report, xfa-license-tool) alongside the user `pdfluent` CLI binary.
# The user-facing CLI is distributed as signed platform binaries via
# scripts/release/pdfluent_cli_package.sh, NOT as crates.io source. (A legacy
# 1.0.0-beta.8 was published before this governance was set; it is superseded.)
publish = false
# AGPLv3-or-later, or the PDFluent Commercial Licence. See LICENSE.
license = "AGPL-3.0-only OR LicenseRef-PDFluent-Commercial"
repository.workspace = true
description = "PDFluent — PDF and XFA processing CLI: render, extract, fill, flatten, validate, sign."
readme = "README.md"

keywords = ["pdf", "xfa", "forms", "rendering", "cli"]
categories = ["command-line-utilities"]
[[bin]]
name = "pdfluent"
path = "src/main.rs"

[[bin]]
name = "xfa-collector"
path = "src/bin/xfa-collector.rs"

[[bin]]
name = "edge-case-report"
path = "src/bin/edge-case-report.rs"

[[bin]]
name = "accuracy-report"
path = "src/bin/accuracy-report.rs"

[[bin]]
name = "edge-case-analyzer"
path = "src/bin/edge-case-analyzer.rs"

[[bin]]
name = "xfa-license-tool"
path = "src/bin/license_tool.rs"

[[bin]]
name = "corpus-render"
path = "src/bin/corpus-render.rs"

[[bin]]
name = "font-cache-builder"
path = "src/bin/font-cache-builder.rs"

[dependencies]
xfa-dom-resolver.workspace = true
formcalc-interpreter.workspace = true
xfa-layout-engine.workspace = true
pdf-xfa.workspace = true
pdf-forms.workspace = true
xfa-license = { workspace = true, features = ["signing"] }
anyhow.workspace = true
reqwest.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
roxmltree.workspace = true
lopdf.workspace = true
pdf-engine = { workspace = true, features = ["xfa"] }
pdf-syntax.workspace = true
pdf-sign.workspace = true
pdf-compliance.workspace = true
image.workspace = true
ttf-parser.workspace = true
base64 = "0.22"
clap_complete = "4"
clap_mangen = "0.2"

[features]
default = []
# Opt-in: build the CLI with the sandboxed QuickJS runtime so
# `XFA_JS_EXECUTION_MODE=sandboxed` executes instanceManager scripts. Off by
# default; no behaviour change unless both this feature and the env var are set.
xfa-js-sandboxed = ["pdf-engine/xfa-js-sandboxed"]
