[package]
name = "pdf-xfa"
version = "1.0.0-beta.3"
edition = "2021"
license-file = "LICENSE"
readme = "README.md"
description = "XFA engine — extraction, layout rendering, font resolution. Experimental and under active development."
repository = "https://github.com/pdfluent"
homepage = "https://pdfluent.com"
documentation = "https://pdfluent.com/docs"

keywords = ["pdf", "xfa", "forms", "adobe"]
categories = ["rendering"]
[dependencies]
xfa-dom-resolver = { path = "../xfa-dom-resolver", version = "=1.0.0-beta.3" }
formcalc-interpreter = { path = "../formcalc-interpreter", version = "=1.0.0-beta.3" }
xfa-layout-engine = { path = "../xfa-layout-engine", version = "=1.0.0-beta.3" }
xfa-json = { path = "../xfa-json", version = "=1.0.0-beta.3" }
pdf-syntax = { path = "../pdf-syntax", version = "=0.5.0" }
pdf-font = { path = "../pdf-font", version = "=1.0.0-beta.3" }
pdf-interpret = { path = "../pdf-interpret", version = "=0.5.0" }
lopdf = { package = "pdfluent-lopdf", path = "../lopdf", version = "=0.39.1" }
flate2 = "1"
thiserror = "2"
ttf-parser = "0.25"
roxmltree = "0.20"
log = "0.4"
base64 = "0.22"
image = { workspace = true }
