[package]
name = "pdf-xfa"
version = "1.0.0"
edition = "2021"
# AGPLv3-or-later, or the PDFluent Commercial Licence. See LICENSE.
license = "AGPL-3.0-only OR LicenseRef-PDFluent-Commercial"
readme = "README.md"
description = "XFA engine — extraction, layout rendering, font resolution. Experimental and under active development."
repository = "https://pdfluent.com/source"
homepage = "https://pdfluent.com"
documentation = "https://pdfluent.com/docs"

keywords = ["pdf", "xfa", "forms", "adobe"]
categories = ["rendering"]
# Ship the library only. The integration tests and examples drive the
# internal golden corpus through repo-relative paths, so they cannot run
# from a published crate; including them only carried internal corpus
# names into the tarball (flagged by the prepublish audit).
include = ["src/**/*", "LICENSE", "README.md", "LICENSE-AGPL", "LICENSE-COMMERCIAL"]

[dependencies]
xfa-dom-resolver = { path = "../xfa-dom-resolver", version = "=1.0.0" }
formcalc-interpreter = { path = "../formcalc-interpreter", version = "=1.0.0" }
xfa-layout-engine = { path = "../xfa-layout-engine", version = "=1.0.0" }
xfa-json = { path = "../xfa-json", version = "=1.0.0" }
pdf-syntax = { path = "../pdf-syntax", version = "=0.5.6" }
pdf-font = { path = "../pdf-font", version = "=1.0.0-beta.5" }
pdf-interpret = { path = "../pdf-interpret", version = "=0.5.8" }
lopdf = { package = "pdfluent-lopdf", path = "../lopdf", version = "=0.39.5" }
flate2 = "1"
thiserror = "2"
ttf-parser = "0.25"
roxmltree = "0.20"
log = "0.4"
base64 = "0.22"
image = { workspace = true }

# M3-B Phase B: optional sandboxed JavaScript runtime backend.
# Off by default; enabled via `--features xfa-js-sandboxed`.
# See benchmarks/runs/M3B_RUNTIME_SECURITY_MODEL.md for the binding contract.
rquickjs = { version = "=0.8.1", optional = true, default-features = false }

[features]
default = []
# Enables the sandboxed QuickJS-backed runtime adapter behind
# `JsExecutionMode::SandboxedRuntime`. Default behaviour and tests are
# unaffected; the runtime registers no host bindings in this phase.
xfa-js-sandboxed = ["dep:rquickjs"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
