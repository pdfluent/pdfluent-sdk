[package]
name = "pdf-ocr"
version = "1.0.0"
edition.workspace = true
# AGPLv3-or-later, or the PDFluent Commercial Licence. See LICENSE.
license = "AGPL-3.0-only OR LicenseRef-PDFluent-Commercial"
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "OCR integration for scanned PDFs with pluggable engine support"

[features]
default = []
tesseract = ["leptess"]
paddle = ["ort", "ndarray", "image", "ureq", "dirs-next"]

[dependencies]
lopdf.workspace = true
thiserror.workspace = true
# Not optional: src/integrity.rs is compiled unconditionally so that its
# tests run in CI without needing a non-default feature enabled.
sha2 = "0.10"

leptess = { version = "0.14", optional = true }
ort = { version = "=2.0.0-rc.12", optional = true, default-features = false, features = ["std", "ndarray", "load-dynamic", "api-24"] }
ndarray = { version = "0.17", optional = true }
image = { workspace = true, optional = true }
ureq = { version = "3", optional = true }
dirs-next = { version = "2", optional = true }

[dev-dependencies]
tempfile = "3"
