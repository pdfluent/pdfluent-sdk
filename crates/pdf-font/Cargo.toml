[package]
name = "pdf-font"
version = "1.0.0-beta.3"
description = "PDF font handling: CFF/Type1 parsing, CMap parsing, and PostScript scanning."
edition = "2024"
license-file = "LICENSE"
readme = "README.md"
authors = ["PDFluent Contributors <team@pdfluent.com>", "Laurenz Stampfl <laurenz.stampfl@gmail.com>"]
repository = "https://github.com/pdfluent"
homepage = "https://pdfluent.com"
documentation = "https://pdfluent.com/docs"

[features]
default = ["std", "embed-cmaps"]
std = []
embed-cmaps = ["std", "dep:brotli"]

[dependencies]
log = "0.4"
phf = { version = "0.13.1", features = ["macros"] }
brotli = { version = "8", default-features = false, features = ["std"], optional = true }
