[package]
name = "pdf-compliance"
version = "1.0.0-beta.5"
edition = "2021"
license-file = "LICENSE"
readme = "README.md"
description = "PDF compliance checking (PDF/A, PDF/UA)."
repository = "https://github.com/pdfluent/examples"
homepage = "https://pdfluent.com"
documentation = "https://pdfluent.com/docs"

[dependencies]
pdf-syntax = { path = "../pdf-syntax", version = "=0.5.2" }
thiserror = "2"
log = "0.4"
cff-parser.workspace = true
ttf-parser.workspace = true
flate2 = "1"

# lopdf: full-featured on native (default features = rayon/chrono/jiff/time),
# wasm_js backend only (no rayon) on wasm32. Cannot use workspace = true here
# because workspace default-features override per-crate default-features = false.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lopdf = { package = "pdfluent-lopdf", path = "../lopdf", version = "=0.39.2" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
lopdf = { package = "pdfluent-lopdf", path = "../lopdf", default-features = false, features = ["wasm_js"], version = "=0.39.2" }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
