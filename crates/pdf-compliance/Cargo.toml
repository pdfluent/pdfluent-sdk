[package]
name = "pdf-compliance"
version = "1.0.0-beta.1"
edition = "2021"
license = "MIT"
description = "PDF compliance checking (PDF/A, PDF/UA)."

[dependencies]
pdf-syntax = { path = "../pdf-syntax", version = "=0.5.0" }
thiserror = "2"
log = "0.4"
cff-parser.workspace = true
ttf-parser.workspace = true
flate2 = "1"

# lopdf: full-featured on native (default features = rayon/chrono/jiff/time),
# wasm_js backend only (no rayon) on wasm32. Cannot use workspace = true here
# because workspace default-features override per-crate default-features = false.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lopdf = { path = "../lopdf", version = "=0.39.0" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
lopdf = { path = "../lopdf", default-features = false, features = ["wasm_js"], version = "=0.39.0" }
