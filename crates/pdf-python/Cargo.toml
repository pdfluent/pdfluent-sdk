[package]
name = "pdf-python"
version = "1.0.0"
edition = "2021"
# publish = false: Python bindings are distributed via PyPI/maturin, not crates.io.
publish = false
# AGPLv3-or-later, or the PDFluent Commercial Licence. See LICENSE.
license = "AGPL-3.0-only OR LicenseRef-PDFluent-Commercial"
description = "Python bindings for the PDF engine via PyO3."

[lib]
name = "pdfluent"
crate-type = ["cdylib"]

[workspace]

[dependencies]
pdf-engine = { path = "../pdf-engine", version = "=1.0.0" }
pdf-sign = { package = "pdfluent-sign", path = "../pdf-sign", version = "=1.0.0" }
pdf-manip = { path = "../pdf-manip", default-features = false, features = ["font-subset"], version = "=1.0.0" }
pdf-compliance = { path = "../pdf-compliance", version = "=1.0.0" }
pdf-syntax = { path = "../pdf-syntax", version = "=0.5.6" }
pdf-forms = { package = "pdfluent-forms", path = "../pdf-forms", version = "=1.0.0" }
pdf-annot = { path = "../pdf-annot", version = "=1.0.0" }
pdf-redact = { path = "../pdf-redact", version = "=1.0.0" }
pdfluent = { path = "../pdfluent", version = "=1.0.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lopdf = { package = "pdfluent-lopdf", path = "../lopdf", version = "=0.39.5" }
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py38", "generate-import-lib"] }
