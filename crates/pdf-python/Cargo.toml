[package]
name = "pdf-python"
version = "1.0.0-beta.1"
edition = "2021"
# publish = false: Python bindings are distributed via PyPI/maturin, not crates.io.
# Also has stale MIT license — fix license-file before enabling publish.
publish = false
license = "MIT"
description = "Python bindings for the PDF engine via PyO3."

[lib]
name = "xfa_pdf"
crate-type = ["cdylib"]

[workspace]

[dependencies]
pdf-engine = { path = "../pdf-engine", version = "=1.0.0-beta.4" }
pdf-sign = { package = "pdfluent-sign", path = "../pdf-sign", version = "=1.0.0-beta.4" }
pdf-manip = { path = "../pdf-manip", default-features = false, version = "=1.0.0-beta.3" }
pdf-compliance = { path = "../pdf-compliance", version = "=1.0.0-beta.4" }
pdf-syntax = { path = "../pdf-syntax", version = "=0.5.1" }
pdf-forms = { package = "pdfluent-forms", path = "../pdf-forms", version = "=1.0.0-beta.4" }
pdf-annot = { path = "../pdf-annot", version = "=1.0.0-beta.3" }
pdf-redact = { path = "../pdf-redact", version = "=1.0.0-beta.3" }
lopdf = { package = "pdfluent-lopdf", path = "../lopdf", version = "=0.39.1" }
pyo3 = { version = "0.24", features = ["extension-module"] }
