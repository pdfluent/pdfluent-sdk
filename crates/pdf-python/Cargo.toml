[package]
name = "pdf-python"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Python bindings for the PDF engine via PyO3."

[lib]
name = "pdfengine"
crate-type = ["cdylib"]

[workspace]

[dependencies]
pdf-engine = { path = "../pdf-engine" }
pdf-sign = { path = "../pdf-sign" }
pdf-manip = { path = "../pdf-manip", default-features = false }
pdf-compliance = { path = "../pdf-compliance" }
pdf-syntax = { path = "../pdf-syntax" }
pyo3 = { version = "0.24", features = ["extension-module"] }
