[package]
name = "pdf-python"
version = "1.0.0-beta.15"
edition = "2021"
# publish = false: Python bindings are distributed via PyPI/maturin, not crates.io.
publish = false
license-file = "LICENSE"  # PDFluent Commercial License (see ./LICENSE)
description = "Python bindings for the PDF engine via PyO3."

[lib]
name = "pdfluent"
crate-type = ["cdylib"]

[workspace]

[dependencies]
pdf-engine = { path = "../pdf-engine", version = "=1.0.0-beta.15" }
pdf-sign = { package = "pdfluent-sign", path = "../pdf-sign", version = "=1.0.0-beta.15" }
pdf-manip = { path = "../pdf-manip", default-features = false, version = "=1.0.0-beta.15" }
pdf-compliance = { path = "../pdf-compliance", version = "=1.0.0-beta.15" }
pdf-syntax = { path = "../pdf-syntax", version = "=0.5.4" }
pdf-forms = { package = "pdfluent-forms", path = "../pdf-forms", version = "=1.0.0-beta.15" }
pdf-annot = { path = "../pdf-annot", version = "=1.0.0-beta.15" }
pdf-redact = { path = "../pdf-redact", version = "=1.0.0-beta.15" }
pdfluent = { path = "../pdfluent", version = "=1.0.0-beta.15" }
lopdf = { package = "pdfluent-lopdf", path = "../lopdf", version = "=0.39.4" }
pyo3 = { version = "0.24", features = ["extension-module"] }
