[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "pdfluent"
version = "1.0.0"
description = "Enterprise PDF SDK — find and replace PDF text while preserving fonts and layout, plus render, extract, annotate, sign, and validate PDFs. Pure Rust, zero system dependencies."
readme = "README.md"
license = { text = "PDFluent Commercial License" }
license-files = ["LICENSE"]
authors = [
    { name = "Innovation Trigger BV", email = "team@pdfluent.com" },
]
requires-python = ">=3.8"
keywords = ["pdf-text-replace", "find-and-replace", "edit-pdf-text", "pdf", "xfa", "acroform", "render", "text-extraction", "forms", "pdf-a", "annotations", "redaction", "rust", "pdfluent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Office/Business",
    "Topic :: Text Processing",
]

[project.urls]
Homepage = "https://pdfluent.com"
"Bug Tracker" = "https://pdfluent.com/support"
Documentation = "https://pdfluent.com/docs"
Repository = "https://github.com/pdfluent/pdfluent-sdk"

[project.optional-dependencies]
pillow = ["Pillow"]
numpy = ["numpy"]
test = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "pdfluent._native"
