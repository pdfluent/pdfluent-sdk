[package]
name = "pdf-render"
version = "1.0.0-beta.2"
description = "A PDF rasterizer in pure Rust."
edition = "2024"
license-file = "LICENSE"
readme = "README.md"
authors = ["PDFluent Contributors <team@pdfluent.com>", "Laurenz Stampfl <laurenz.stampfl@gmail.com>"]
repository = "https://github.com/pdfluent"
homepage = "https://pdfluent.com"
documentation = "https://pdfluent.com/docs"

[dependencies]
pdf-interpret = { path = "../pdf-interpret", version = "=0.5.0" }
kurbo = "0.13.0"
image = { version = "0.25", features = ["png"] }
bytemuck = { version = "1", features = ["bytemuck_derive"] }
vello_cpu = { version = "0.0.6", default-features = false, features = ["std", "png", "f32_pipeline"] }
fast_image_resize = { version = "6.0", default-features = false, features = ["std"] }

[dev-dependencies]
log = "0.4"
lopdf = { package = "pdfluent-lopdf", path = "../lopdf", version = "=0.39.1" }

[features]
default = ["embed-fonts", "embed-cmaps"]
embed-fonts = ["pdf-interpret/embed-fonts"]
embed-cmaps = ["pdf-interpret/embed-cmaps"]
