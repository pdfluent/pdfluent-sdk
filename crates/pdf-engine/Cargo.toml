[package]
name = "pdf-engine"
version = "1.0.0-beta.1"
edition = "2021"
license = "MIT"
description = "Unified PDF rendering engine — page rendering, text extraction, thumbnails."

[dependencies]
pdf-syntax = { path = "../pdf-syntax" }
pdf-interpret = { path = "../pdf-interpret" }
pdf-render = { path = "../pdf-render" }
pdf-forms = { path = "../pdf-forms" }
pdf-xfa = { path = "../pdf-xfa" }
pdf-ocr = { path = "../pdf-ocr", features = ["paddle"], optional = true }
thiserror = { workspace = true }
kurbo = "0.13.0"
rayon = { version = "1", optional = true }
ocrs = { version = "0.12", optional = true }
rten = { version = "0.24", optional = true }
dirs-sys = { version = "0.3", optional = true }
reqwest = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
image = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
rsa = { version = "0.9", default-features = false, features = ["sha2"], optional = true }
pkcs8 = { version = "0.10", features = ["pem"], optional = true }
time = { version = "0.3", features = ["formatting", "macros"], optional = true }

[features]
default = ["parallel"]
parallel = ["dep:rayon"]
# Pure-Rust OCR via ocrs (requires external .rten model files at ~/.cache/ocrs/).
ocr = ["dep:ocrs", "dep:rten", "dep:dirs-sys"]
ocr-mistral = ["dep:reqwest", "dep:base64", "dep:image", "dep:serde", "dep:serde_json"]
ocr-google = [
    "dep:reqwest",
    "dep:base64",
    "dep:image",
    "dep:serde",
    "dep:serde_json",
    "dep:rsa",
    "dep:pkcs8",
    "dep:sha2",
    "dep:time",
]
ocr-aws = [
    "dep:reqwest",
    "dep:base64",
    "dep:image",
    "dep:serde",
    "dep:serde_json",
    "dep:hmac",
    "dep:sha2",
    "dep:time",
]
ocr-azure = ["dep:reqwest", "dep:base64", "dep:image", "dep:serde", "dep:serde_json"]
ocr-cloud = ["ocr-mistral", "ocr-google", "ocr-aws", "ocr-azure"]
ocr-onnx = ["dep:pdf-ocr"]
# Planned: ocr-tesseract = ["leptess"]
# Planned: ocr-paddle = ["paddle-ocr"]

[dev-dependencies]
lopdf = { workspace = true }
