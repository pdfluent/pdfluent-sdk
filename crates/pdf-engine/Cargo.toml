[package]
name = "pdf-engine"
version = "1.0.0-beta.1"
edition = "2021"
license = "MIT"
description = "Unified PDF rendering engine — page rendering, text extraction, thumbnails."

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
pdf-syntax = { path = "../pdf-syntax" }
pdf-interpret = { path = "../pdf-interpret" }
lopdf = { path = "../lopdf", default-features = false }
pdf-render = { path = "../pdf-render" }
pdf-forms = { path = "../pdf-forms" }
pdf-xfa = { path = "../pdf-xfa", optional = true }
xfa-layout-engine = { path = "../xfa-layout-engine", optional = true }
formcalc-interpreter = { path = "../formcalc-interpreter", optional = true }
xfa-json = { path = "../xfa-json", optional = true }
thiserror = { workspace = true }
kurbo = "0.13.0"
rayon = { version = "1", optional = true }
ocrs = { version = "0.12", optional = true }
rten = { version = "0.24", optional = true }
ort = { version = "=2.0.0-rc.12", optional = true, default-features = false, features = ["std", "load-dynamic", "api-24"] }

[features]
default = []
parallel = ["dep:rayon"]
xfa = ["dep:pdf-xfa", "dep:xfa-layout-engine", "dep:formcalc-interpreter", "dep:xfa-json"]
ocr = ["dep:ocrs", "dep:rten"]
ocr-onnx = ["dep:ort"]
full = ["xfa", "ocr", "ocr-onnx"]

[dev-dependencies]
image = { workspace = true }
