[package]
name = "pdf-engine"
version = "1.0.0"
edition = "2021"
# AGPLv3-or-later, or the PDFluent Commercial Licence. See LICENSE.
license = "AGPL-3.0-only"
readme = "README.md"
description = "Unified PDF rendering engine — page rendering, text extraction, thumbnails."
repository = "https://pdfluent.com/source"
homepage = "https://pdfluent.com"
documentation = "https://pdfluent.com/docs"

keywords = ["pdf", "rendering", "text-extraction", "forms"]
categories = ["rendering", "text-processing"]
[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
pdf-syntax = { path = "../pdf-syntax", version = "=0.5.6" }
pdf-interpret = { path = "../pdf-interpret", version = "=0.5.8" }
lopdf = { package = "pdfluent-lopdf", path = "../lopdf", default-features = false, version = "=0.39.5" }
pdf-render = { path = "../pdf-render", version = "=1.0.0" }
pdf-forms = { package = "pdfluent-forms", path = "../pdf-forms", version = "=1.0.0" }
pdf-xfa = { path = "../pdf-xfa", optional = true, version = "=1.0.0" }
xfa-layout-engine = { path = "../xfa-layout-engine", optional = true, version = "=1.0.0" }
formcalc-interpreter = { path = "../formcalc-interpreter", optional = true, version = "=1.0.0" }
xfa-json = { path = "../xfa-json", optional = true, version = "=1.0.0" }
thiserror = { workspace = true }
kurbo = "0.13.0"
rayon = { version = "1", optional = true }
ocrs = { version = "0.12", optional = true }
rten = { version = "0.24", optional = true }
dirs-sys = { version = "0.3", optional = true }
pdf-ocr = { workspace = true, optional = true, features = ["paddle"] }
reqwest = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
image = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
rsa = { version = "0.9", default-features = false, features = ["sha2"], optional = true }
pkcs8 = { version = "0.10", features = ["pem"], optional = true }
time = { version = "0.3", features = ["formatting", "macros"], optional = true }

[features]
default = []
parallel = ["dep:rayon"]
# Enable serde derives on the canonical wire DTO (`TextSpanInfo`). Off by
# default so the core engine stays serialization-agnostic; bindings that emit
# JSON (Tauri, WASM) turn it on.
serde = ["dep:serde"]
xfa = ["dep:pdf-xfa", "dep:xfa-layout-engine", "dep:formcalc-interpreter", "dep:xfa-json"]
# Opt-in: compile the sandboxed QuickJS runtime into the XFA flatten path so
# `XFA_JS_EXECUTION_MODE=sandboxed` can execute instanceManager scripts. Off by
# default; no behaviour change unless both this feature and the env var are set.
xfa-js-sandboxed = ["xfa", "pdf-xfa/xfa-js-sandboxed"]
ocr = ["dep:ocrs", "dep:rten", "dep:dirs-sys"]
ocr-mistral = ["dep:reqwest", "dep:base64", "dep:image", "dep:serde", "dep:serde_json"]
ocr-google = ["dep:reqwest", "dep:base64", "dep:image", "dep:serde", "dep:serde_json", "dep:rsa", "dep:pkcs8", "dep:sha2", "dep:time"]
ocr-aws = ["dep:reqwest", "dep:base64", "dep:image", "dep:serde", "dep:serde_json", "dep:hmac", "dep:sha2", "dep:time"]
ocr-azure = ["dep:reqwest", "dep:base64", "dep:image", "dep:serde", "dep:serde_json"]
ocr-cloud = ["ocr-mistral", "ocr-google", "ocr-aws", "ocr-azure"]
ocr-onnx = ["dep:pdf-ocr"]
full = ["parallel", "xfa", "ocr", "ocr-onnx", "ocr-cloud"]
# Research spikes — not compiled in normal CI.  Build explicitly with `--features spike`.
spike = []

[[example]]
name = "chunk_dump"
required-features = ["spike"]

[[example]]
name = "logical_compare"
required-features = ["spike"]

[[example]]
name = "structtree_measure"
required-features = ["spike"]

[[example]]
name = "structtree_spike"
required-features = ["spike"]

[[example]]
name = "structtree_table"
required-features = ["spike"]

[[example]]
name = "structured_demo"
required-features = ["spike"]

[[example]]
name = "table_audit"
required-features = ["spike"]

[[example]]
name = "table_dump"
required-features = ["spike"]

[dev-dependencies]
image = { workspace = true }
lopdf = { workspace = true }
serde_json = { workspace = true }
# Dev-only pdfium reference comparator for the render-profiling milestone.
# Binds at runtime to a local libpdfium (e.g. from pypdfium2); the native lib is
# never committed. Used only by examples/pdfium_compare.rs.
pdfium-render = "0.8"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
