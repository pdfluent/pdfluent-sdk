[package]
name = "docx-extract"
version = "1.1.0"
edition.workspace = true
# publish = false: MVP (epic pdfluent-internal#636). The block mapping is not
# settled yet, so the crate stays out of the publish set until then.
publish = false
# AGPLv3-or-later, or the PDFluent Commercial Licence. See LICENSE.
license = "AGPL-3.0-only OR LicenseRef-PDFluent-Commercial"
repository.workspace = true
homepage = "https://pdfluent.com"
documentation = "https://pdfluent.com/docs"
description = "DOCX to engine-block extraction: Word documents as pdf-engine Block/BlockKind"
keywords = ["docx", "ooxml", "extraction", "word"]
categories = ["text-processing", "parser-implementations"]

[dependencies]
pdf-engine = { path = "../pdf-engine", version = "=1.1.0" }
thiserror.workspace = true
# zip 2.x is MIT (https://github.com/PrusaOwners/zip) — allowed by the epic
# (MIT, Apache-2.0 or BSD only). Same pinned shape as pdf-docx.
zip = { version = "2", default-features = false, features = ["deflate"] }
# quick-xml 0.37 is MIT (https://github.com/tafia/quick-xml) — allowed by the
# epic (MIT, Apache-2.0 or BSD only). Same version as pdf-docx.
quick-xml = "0.37"

[dev-dependencies]
# Fixture builder in tests/ writes the .docx zips itself (no network).
zip = { version = "2", default-features = false, features = ["deflate"] }
