[package]
edition = "2021"
name = "pdfluent-cff"
version = "0.2.1"
authors = [
    "Evgeniy Reizner <razrfalcon@gmail.com>",
    "Jeff Muizelaar <jrmuizel@gmail.com>",
]
description = "A parser for the Compact Font Format (CFF) — extended fork used by PDFluent"
readme = "README.md"
keywords = [
    "cff",
    "font",
    "adobe",
]
categories = ["parser-implementations"]
license = "MIT OR Apache-2.0"
repository = "https://pdfluent.com/source"
homepage = "https://pdfluent.com"
documentation = "https://pdfluent.com/docs"

[lib]
name = "cff_parser"
path = "src/lib.rs"

[[example]]
name = "dump"
path = "examples/dump.rs"

[[example]]
name = "tounicode"
path = "examples/tounicode.rs"

[dependencies]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
