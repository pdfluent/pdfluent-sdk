[package]
name = "pdf-redact"
version = "1.0.0-beta.8"
edition.workspace = true
license-file = "LICENSE"
readme = "README.md"
repository.workspace = true
homepage = "https://pdfluent.com"
documentation = "https://pdfluent.com/docs"
description = "GDPR-compliant PDF redaction: permanent content removal"

[dependencies]
lopdf.workspace = true
pdf-extract = { package = "pdfluent-extract", path = "../pdf-extract", version = "=1.0.0-beta.9" }
pdf-manip = { path = "../pdf-manip", default-features = false, version = "=1.0.0-beta.8" }
regex = "1"
thiserror.workspace = true
flate2 = "1"

[dev-dependencies]
tempfile = "3"
# pdf-font CMap parser for the M8-REDACT-03 stub-compatibility smoke test.
# Used only in tests to verify that the stub /ToUnicode CMap we produce on
# redacted pages is accepted by the same parser pdf-extract / pdf-manip use.
pdf-font = { path = "../pdf-font", version = "=1.0.0-beta.4" }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
