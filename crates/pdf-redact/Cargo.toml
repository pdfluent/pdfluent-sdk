[package]
name = "pdf-redact"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "GDPR-compliant PDF redaction: permanent content removal"

[dependencies]
lopdf.workspace = true
pdf-extract = { package = "pdfluent-extract", path = "../pdf-extract", version = "=1.0.0-beta.1" }
pdf-manip = { path = "../pdf-manip", default-features = false, version = "=1.0.0-beta.1" }
regex = "1"
thiserror.workspace = true
flate2 = "1"

[dev-dependencies]
tempfile = "3"
# pdf-font CMap parser for the M8-REDACT-03 stub-compatibility smoke test.
# Used only in tests to verify that the stub /ToUnicode CMap we produce on
# redacted pages is accepted by the same parser pdf-extract / pdf-manip use.
pdf-font = { path = "../pdf-font", version = "=1.0.0-beta.1" }
