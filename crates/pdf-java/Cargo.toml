[package]
name = "pdf-java"
version = "1.0.0-beta.1"
edition = "2021"
# publish = false: Java JNI bindings are distributed via Maven/JVM ecosystem, not crates.io.
# Also has stale MIT license — fix license-file before enabling publish.
publish = false
# AGPLv3-or-later, or the PDFluent Commercial Licence. See LICENSE.
license = "AGPL-3.0-or-later"
description = "Java JNI bindings for the XFA PDF engine."

[lib]
name = "pdfluent_java"
crate-type = ["cdylib"]

[dependencies]
pdf-engine = { path = "../pdf-engine", version = "=1.0.0" }
pdf-forms = { package = "pdfluent-forms", path = "../pdf-forms", version = "=1.0.0" }
pdf-annot = { path = "../pdf-annot", version = "=1.0.0" }
pdf-redact = { path = "../pdf-redact", version = "=1.0.0" }
pdf-manip = { path = "../pdf-manip", version = "=1.0.0" }
pdf-compliance = { path = "../pdf-compliance", version = "=1.0.0" }
pdf-syntax = { path = "../pdf-syntax", version = "=0.5.6" }
pdfluent = { path = "../pdfluent", version = "=1.0.0" }
lopdf = { package = "pdfluent-lopdf", path = "../lopdf", version = "=0.39.5" }
jni = "0.21"
