[package]
name = "pdf-pptx"
version.workspace = true
edition.workspace = true
# AGPLv3-or-later, or the PDFluent Commercial Licence. See LICENSE.
license = "AGPL-3.0-only OR LicenseRef-PDFluent-Commercial"
repository.workspace = true
description = "PDF to PowerPoint PPTX conversion"
readme = "README.md"

[dependencies]
lopdf.workspace = true
thiserror.workspace = true
pdf-extract = { package = "pdfluent-extract", path = "../pdf-extract", version = "=1.0.0" }
quick-xml = { version = "0.37", features = ["serialize"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
