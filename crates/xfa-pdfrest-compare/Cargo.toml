[package]
name = "xfa-pdfrest-compare"
version = "0.1.0"
edition = "2021"
rust-version = "1.80.0"
description = "Visual comparison harness for PDFluent vs pdfRest renders."
# Internal-only harness — never published. License set explicitly to satisfy
# `cargo metadata` / `cargo deny` (workspace inherits MIT for internal crates).
# AGPLv3-or-later, or the PDFluent Commercial Licence. See LICENSE.
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
pdf-xfa = { path = "../pdf-xfa", version = "=1.0.0" }
pdf-engine = { path = "../pdf-engine", features = ["xfa"], version = "=1.0.0" }
lopdf = "0.34"
rusqlite = { version = "0.31", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
image = "0.25"
sha2 = "0.10"
rayon = "1.10"
walkdir = "2"
regex = "1"
anyhow = "1"
thiserror = "2"

[[bin]]
name = "xfa-pdfrest-compare"
path = "src/main.rs"
