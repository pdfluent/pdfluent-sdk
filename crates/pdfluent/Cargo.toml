[package]
name = "pdfluent"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
authors = ["PDFluent Contributors <team@pdfluent.com>"]
# AGPLv3-or-later, or the PDFluent Commercial Licence. See LICENSE.
license = "AGPL-3.0-only OR LicenseRef-PDFluent-Commercial"
repository = "https://github.com/pdfluent/pdfluent-sdk"
homepage = "https://pdfluent.com"
documentation = "https://pdfluent.com/docs"
readme = "README.md"
description = "Pure-Rust PDF SDK with PDF/A, digital signatures, WASM, and experimental (feature-gated) XFA support."
keywords = ["pdf", "xfa", "acroform", "pdf-forms", "pades"]
categories = ["rendering", "text-processing", "parser-implementations", "encoding"]

# The integration suite drives the repository fixture tree by relative path
# and cannot run from a published crate. Excluded so those paths do not
# ship; the unit tests in src/ still travel with the package.
exclude = ["tests/"]

[features]
default = ["signing", "pdfa", "redaction", "font-subset"]
async-tokio = ["dep:tokio"]

# Embedding a caller-supplied Unicode font for text replacement, so a
# replacement can contain scripts the document itself never had. Forwards to
# pdf-manip rather than being re-implemented here.
font-subset = ["pdf-manip/font-subset"]

# Capability feature families (see RFC 0001 §10 D8)
signing = []
pdfa = ["dep:pdf-compliance"]
redaction = []
ocr-tesseract = []
ocr-paddle = []
html-to-pdf = []
docx-export = []
xlsx-export = []
pptx-export = []
xfa-flatten = []
wasm = []
internal-legacy = []
tracing = ["dep:tracing"]

[dependencies]
# Epic 2 wiring: underlying PDF crates.
# pdf-engine provides read-side (parse, page_count, text extraction, render).
# lopdf provides write-side (save, save_to, page tree operations).
# pdf-manip provides page-level operations (rotate, merge, split, extract,
# encrypt, permissions).
# pdf-sign provides PAdES signing + signature validation.
# pdf-redact provides content redaction (search + region).
pdf-engine = { path = "../pdf-engine", version = "=1.0.0", features = ["xfa"] }
# Diagnostics (load-recovery leniency events + interpreter warnings) read from
# `pdf-syntax`/`pdf-interpret` directly. These are lightweight (no vello/zip/fs)
# and compile on wasm32, so they live in the all-target dependency block —
# unlike `pdf-render` (native-only, see below), which formerly re-exported them
# and broke the wasm32 build.
pdf-syntax = { path = "../pdf-syntax", version = "=0.5.6" }
pdf-interpret = { path = "../pdf-interpret", version = "=0.5.8" }
lopdf = { package = "pdfluent-lopdf", path = "../lopdf", version = "=0.39.5", default-features = false }
pdf-manip = { path = "../pdf-manip", version = "=1.0.0" }
pdf-sign = { package = "pdfluent-sign", path = "../pdf-sign", version = "=1.0.0" }
pdf-redact = { path = "../pdf-redact", version = "=1.0.0" }
pdf-annot = { path = "../pdf-annot", version = "=1.0.0" }
pdf-forms = { package = "pdfluent-forms", path = "../pdf-forms", version = "=1.0.0" }
pdf-compliance = { path = "../pdf-compliance", version = "=1.0.0", optional = true }

# Signed-payload activation: Ed25519 verification + payload parsing live
# in the xfa-license crate. The umbrella consumes the verifier API only
# (no signing key dependency at runtime).
xfa-license = { path = "../xfa-license", version = "=1.0.0" }
tokio = { version = "1", features = ["rt", "fs"], optional = true }
tracing = { version = "0.1", optional = true }

# Office export works on every target, wasm32 included.
#
# These three used to sit in the non-wasm block beside pdf-render, under a
# comment about "filesystem / zip / vello stacks we do not compile on wasm32".
# That reason is true of pdf-render (vello) and was never true of these: they
# touch no filesystem and depend only on pdf-extract, quick-xml, zip (deflate)
# and log — all of which build for wasm32. Checked 23-08-2026 by building all
# three for wasm32-unknown-unknown.
#
# The cost of the mistake was not theoretical: the browser SDK could not export
# to Word, Excel or PowerPoint, and the facade returned UnsupportedOnWasm for a
# capability the /features/ page sells.
pdf-docx = { path = "../pdf-docx", version = "=1.0.0" }
pdf-xlsx = { path = "../pdf-xlsx", version = "=1.0.0" }
pdf-pptx = { path = "../pdf-pptx", version = "=1.0.0" }

# pdf-render stays native-only: vello does not compile for wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pdf-render = { path = "../pdf-render", version = "=1.0.0" }
# Image encoding for `to_images` — PNG via the `png` crate, JPEG via
# `image`'s JpegEncoder. Both are already transitively present via
# `pdf-render`; we pin direct versions so the `to_images` code is
# robust against transitive churn.
png = "0.17"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

# WASM target: getrandom needs the `js` feature to resolve its backend on
# wasm32-unknown-unknown. pdf-sign / pdf-redact pull it in transitively
# via rand/crypto primitives. This target-specific entry unblocks
# `cargo check --target wasm32-unknown-unknown` without affecting native
# builds.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
zip = { version = "7", default-features = false, features = ["deflate"] }
# Bootstrap tests run as integration tests under tests/web_examples/.
# Form-mutation integration tests (3C-1 / #1245) construct small in-memory
# PDF fixtures directly via lopdf rather than shipping binary fixtures
# for every field-type permutation.
lopdf = { package = "pdfluent-lopdf", path = "../lopdf", version = "=0.39.5", default-features = false }
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

# Signed-payload tests need the `signing` feature of xfa-license so the
# integration test can build test fixtures (keypair generation + payload
# signing) at runtime, in-memory, without committing private key bytes
# to the repo.
xfa-license = { path = "../xfa-license", version = "=1.0.0", features = ["signing"] }

[[bench]]
name = "facade"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
