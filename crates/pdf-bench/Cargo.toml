[package]
name = "pdf-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
pdf-syntax = { path = "../pdf-syntax", features = ["std", "images"], version = "=0.5.6" }
pdf-engine = { path = "../pdf-engine", version = "=1.0.0" }
pdf-compliance = { path = "../pdf-compliance", version = "=1.0.0" }
pdf-extract = { package = "pdfluent-extract", path = "../pdf-extract", version = "=1.0.0" }
pdf-manip = { path = "../pdf-manip", version = "=1.0.0" }
pdf-forms = { package = "pdfluent-forms", path = "../pdf-forms", version = "=1.0.0" }
pdf-xfa.workspace = true
xfa-dom-resolver.workspace = true
formcalc-interpreter.workspace = true
xfa-layout-engine.workspace = true
lopdf.workspace = true

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
libc = "0.2"

[[bin]]
name = "gen-corpus"
path = "src/corpus_gen.rs"

[[bin]]
name = "cold-start"
path = "src/cold_start.rs"

[[bin]]
name = "idle-rss"
path = "src/idle_rss.rs"

[[bin]]
name = "merge-once"
path = "src/merge_once.rs"

[[bin]]
name = "extract-once"
path = "src/extract_once.rs"

[[bench]]
name = "pdf_parse"
harness = false

[[bench]]
name = "xfa_operations"
harness = false

[[bench]]
name = "sdk_operations"
harness = false

[[bench]]
name = "pdf_benchmarks"
harness = false

[[bench]]
name = "comparison"
harness = false
