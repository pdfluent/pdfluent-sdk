[package]
authors = [
    "Junfeng Liu <china.liujunfeng@gmail.com>",
    "Emulator <emulator@hotmail.it>",
]
categories = ["text-processing"]
description = "A Rust library for PDF document manipulation."
documentation = "https://pdfluent.com/docs"
edition = "2024"
homepage = "https://pdfluent.com"
keywords = ["pdf", "editing", "manipulation", "merge"]
license = "MIT"
readme = "README.md"
name = "pdfluent-lopdf"
repository = "https://github.com/pdfluent"
version = "0.39.1"
rust-version = "1.85"

[dependencies]
aes = "0.8.4"
bitflags = "2.8.0"
cbc = "0.1.2"
chrono = { version = "0.4", optional = true, default-features = false, features = [
    "std",
    "clock",
] }
ecb = "0.1.2"
encoding_rs = "0.8.32"
flate2 = "1.0"
hayro-ccitt = { package = "pdfluent-ccitt", path = "../hayro-ccitt", optional = true, version = "=0.2.0" }
hayro-jbig2 = { package = "pdfluent-jbig2", path = "../hayro-jbig2", optional = true, version = "=0.2.0" }
hayro-jpeg2000 = { package = "pdfluent-jpeg2000", path = "../hayro-jpeg2000", optional = true, default-features = false, version = "=0.3.2" }
image = { version = "0.25", optional = true }
indexmap = "2.2.3"
itoa = "1.0"
jiff = { version = "0.2", optional = true }
getrandom = "0.3"
log = "0.4"
md-5 = "0.10"
nom = "8.0"
nom_locate = "5.0"
rand = { version = "0.9" }
rangemap = "1.5"
rayon = { version = "1.6", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
sha2 = "0.10.8"
stringprep = "0.1.5"
thiserror = "2.0.3"
time = { version = "0.3", features = [
    "formatting",
    "parsing",
], optional = true }
tokio = { version = "1", features = ["fs", "io-util"], optional = true }
weezl = "0.1"
ttf-parser = "0.25.1"

[dev-dependencies]
env_logger = "0.11"
tempfile = "3.3"

[features]
async = ["tokio/rt-multi-thread", "tokio/macros"]
chrono = ["dep:chrono"]
default = ["chrono", "jiff", "rayon", "time"]
embed_image = ["image", "hayro-ccitt", "hayro-jbig2", "hayro-jpeg2000"]
jiff = ["dep:jiff"]
wasm_js = ["getrandom/wasm_js"]
serde = ["dep:serde"]
time = ["dep:time"]
