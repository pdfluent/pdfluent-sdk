[package]
name = "pdfluent-sign"
version = "1.1.0"
edition = "2021"
# AGPLv3-or-later, or the PDFluent Commercial Licence. See LICENSE.
license = "AGPL-3.0-only OR LicenseRef-PDFluent-Commercial"
readme = "README.md"
description = "PDF digital signature validation — PAdES, CMS, certificate chain, DocMDP/FieldMDP, LTV."
repository = "https://github.com/pdfluent/pdfluent-sdk"
homepage = "https://pdfluent.com"
documentation = "https://pdfluent.com/docs"
keywords = ["pdf", "signature", "pades", "cms", "pkcs7"]
categories = ["authentication", "cryptography"]
# Tests do not travel. They read fixtures from the repository, three directories
# up, which are not in the tarball -- so they cannot build outside this
# workspace, and what they do carry into a published crate is a path into a tree
# the reader does not have. `pdfluent` and `pdf-xfa` have kept them out for that
# reason since they were first published; this one had not (#358).
exclude = ["tests/"]

[dependencies]
pdf-syntax = { path = "../pdf-syntax", version = "=0.6.0" }
log = "0.4"
sha2 = "0.10"
sha1 = { version = "0.10", features = ["oid"] }
digest = "0.10"
rsa = { version = "0.9", default-features = false, features = ["sha2"] }
ecdsa = { version = "0.16", default-features = false }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8"] }
p384 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8"] }
spki = "0.7"
der = "0.7"
signature = "2.2"
thiserror = { workspace = true }
p12 = "0.6"
pkcs8 = "0.10"
ureq = { version = "2", optional = true }

# lopdf: full-featured on native, wasm_js backend (no rayon) on wasm32.
# Direct path used (not workspace = true) to allow default-features = false override.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lopdf = { package = "pdfluent-lopdf", path = "../lopdf", version = "=0.39.6" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
lopdf = { package = "pdfluent-lopdf", path = "../lopdf", default-features = false, features = ["wasm_js"], version = "=0.39.6" }
# `SystemTime::now()` panics on wasm32-unknown-unknown; the browser clock is
# read through js-sys instead. See src/clock.rs.
js-sys = "0.3"

[features]
default = []
tsa = ["ureq"]

[dev-dependencies]
test-skip = { path = "../test-skip" }
