[package]
name = "xfa-api-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "HTTP API server exposing XFA form processing and PDF rendering."
publish = false

[[bin]]
name = "xfa-api-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
roxmltree.workspace = true
indexmap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid = { version = "1", features = ["v4"] }

# Internal crates
pdf-xfa = { path = "../pdf-xfa", version = "=1.0.0-beta.2" }
lopdf = { package = "pdfluent-lopdf", path = "../lopdf", version = "=0.39.0" }
xfa-json = { path = "../xfa-json", version = "=1.0.0-beta.1" }
xfa-layout-engine = { path = "../xfa-layout-engine", version = "=1.0.0-beta.1" }
xfa-dom-resolver = { path = "../xfa-dom-resolver", version = "=1.0.0-beta.1" }
