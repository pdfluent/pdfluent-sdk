[package]
name = "pdf-capi"
version = "1.0.0-beta.8"
edition = "2021"
# publish = false: license field is stale (MIT) and the crate has never been
# published. Fix license-file + metadata before enabling publish.
publish = false
license-file = "LICENSE"
description = "C-compatible API for the PDF engine (PDFium-compatible interface)."

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
pdf-engine = { path = "../pdf-engine", version = "=1.0.0-beta.8" }
pdf-compliance = { path = "../pdf-compliance", version = "=1.0.0-beta.8" }
pdf-forms = { package = "pdfluent-forms", path = "../pdf-forms", version = "=1.0.0-beta.8" }
pdf-manip = { path = "../pdf-manip", version = "=1.0.0-beta.8" }
pdf-redact = { path = "../pdf-redact", version = "=1.0.0-beta.8" }
pdf-sign = { package = "pdfluent-sign", path = "../pdf-sign", version = "=1.0.0-beta.8" }
pdf-extract = { package = "pdfluent-extract", path = "../pdf-extract", version = "=1.0.0-beta.8" }
pdfluent = { path = "../pdfluent", version = "=1.0.0-beta.8" }
lopdf = { package = "pdfluent-lopdf", path = "../lopdf", version = "=0.39.2" }
