[package]
name = "pdf-capi"
version = "1.0.0-beta.1"
edition = "2021"
license = "MIT"
description = "C-compatible API for the PDF engine (PDFium-compatible interface)."

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
pdf-engine = { path = "../pdf-engine", version = "=1.0.0-beta.1" }
pdf-compliance = { path = "../pdf-compliance", version = "=1.0.0-beta.1" }
pdf-forms = { package = "pdfluent-forms", path = "../pdf-forms", version = "=1.0.0-beta.1" }
pdf-manip = { path = "../pdf-manip", version = "=1.0.0-beta.1" }
pdf-redact = { path = "../pdf-redact", version = "=1.0.0-beta.1" }
pdf-sign = { package = "pdfluent-sign", path = "../pdf-sign", version = "=1.0.0-beta.1" }
pdf-extract = { package = "pdfluent-extract", path = "../pdf-extract", version = "=1.0.0-beta.1" }
lopdf = { package = "pdfluent-lopdf", path = "../lopdf", version = "=0.39.0" }
