[package]
name = "pdf-capi"
version = "1.0.0-beta.1"
edition = "2021"
license = "MIT"
description = "C-compatible API for the PDF engine (PDFium-compatible interface)."

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
pdf-engine = { path = "../pdf-engine" }
pdf-compliance = { path = "../pdf-compliance" }
pdf-forms = { path = "../pdf-forms" }
pdf-manip = { path = "../pdf-manip" }
pdf-redact = { path = "../pdf-redact" }
pdf-sign = { path = "../pdf-sign" }
pdf-extract = { path = "../pdf-extract" }
lopdf = { path = "../lopdf" }
