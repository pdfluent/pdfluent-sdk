[package]
name = "pdf-capi"
version = "1.0.0-beta.18"
edition = "2021"
# publish = false: the C ABI is distributed as a tarball via
# scripts/release/package_cabi.sh (with the bundled commercial LICENSE), not via
# crates.io. license-file points to the PDFluent Commercial License (see ./LICENSE).
publish = false
license-file = "LICENSE"
description = "C-compatible API for the PDF engine (PDFium-compatible interface)."

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
pdf-engine = { path = "../pdf-engine", version = "=1.0.0-beta.18" }
pdf-compliance = { path = "../pdf-compliance", version = "=1.0.0-beta.18" }
pdf-forms = { package = "pdfluent-forms", path = "../pdf-forms", version = "=1.0.0-beta.18" }
pdf-manip = { path = "../pdf-manip", version = "=1.0.0-beta.18" }
pdf-redact = { path = "../pdf-redact", version = "=1.0.0-beta.18" }
pdf-sign = { package = "pdfluent-sign", path = "../pdf-sign", version = "=1.0.0-beta.18" }
pdf-extract = { package = "pdfluent-extract", path = "../pdf-extract", version = "=1.0.0-beta.18" }
pdfluent = { path = "../pdfluent", version = "=1.0.0-beta.18" }
serde = { workspace = true }
serde_json = { workspace = true }
lopdf = { package = "pdfluent-lopdf", path = "../lopdf", version = "=0.39.4" }
