[package]
name = "xfa-license-gen"
version.workspace = true
edition.workspace = true
# publish = false: internal tool for generating signed license tokens, not part of public SDK.
publish = false
license.workspace = true
repository.workspace = true
description = "Internal tooling to generate signed PDFluent SDK license tokens."

[[bin]]
name = "xfa-license-gen"
path = "src/main.rs"

[dependencies]
xfa-license = { workspace = true, features = ["signing"] }
clap.workspace = true
hex = "0.4"
anyhow.workspace = true
serde_json.workspace = true
