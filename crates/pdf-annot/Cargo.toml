[package]
name = "pdf-annot"
version = "1.0.0-beta.3"
edition = "2021"
license-file = "LICENSE"
readme = "README.md"
description = "PDF annotation engine — parsing and typed access to all annotation types per ISO 32000-2 §12.5."
repository = "https://github.com/pdfluent"
homepage = "https://pdfluent.com"
documentation = "https://pdfluent.com/docs"

[dependencies]
pdf-syntax = { path = "../pdf-syntax", version = "=0.5.0" }
lopdf = { workspace = true, optional = true }
log = "0.4"
thiserror = { workspace = true }

[features]
default = ["write"]
write = ["dep:lopdf"]
