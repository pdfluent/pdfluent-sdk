[package]
name = "pdf-annot"
version = "1.0.0"
edition = "2021"
# AGPLv3-or-later, or the PDFluent Commercial Licence. See LICENSE.
license = "AGPL-3.0-only"
readme = "README.md"
description = "PDF annotation engine — parsing and typed access to all annotation types per ISO 32000-2 §12.5."
repository = "https://pdfluent.com/source"
homepage = "https://pdfluent.com"
documentation = "https://pdfluent.com/docs"

[dependencies]
pdf-syntax = { path = "../pdf-syntax", version = "=0.5.6" }
lopdf = { workspace = true, optional = true }
log = "0.4"
thiserror = { workspace = true }

[features]
default = ["write"]
write = ["dep:lopdf"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
