[package]
name = "xfa-test-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "xfa-test-runner"
path = "src/main.rs"

[features]
default = []
pdfium-oracle = ["dep:pdfium-ffi-bridge"]
paddle-ocr = ["dep:pdf-ocr"]

[dependencies]
# Workspace crates
pdf-syntax = { path = "../pdf-syntax" }
pdf-xfa = { path = "../pdf-xfa" }
pdf-docx = { path = "../pdf-docx" }
pdf-xlsx = { path = "../pdf-xlsx" }
pdf-invoice = { path = "../pdf-invoice" }
zip = { version = "2", default-features = false, features = ["deflate"] }
pdf-engine = { path = "../pdf-engine" }
pdf-forms = { path = "../pdf-forms" }
pdf-annot = { path = "../pdf-annot" }
pdf-sign = { path = "../pdf-sign" }
pdf-extract = { path = "../pdf-extract" }
pdf-compliance = { path = "../pdf-compliance" }
pdf-manip = { path = "../pdf-manip" }
pdf-redact = { path = "../pdf-redact" }

# PDFium oracle (optional)
pdfium-ffi-bridge = { path = "../pdfium-ffi-bridge", features = ["pdfium"], optional = true }
# image is required for render-page subcommand (always enabled).
image = { workspace = true }

# OCR (optional, requires ONNX Runtime)
pdf-ocr = { path = "../pdf-ocr", features = ["paddle"], optional = true }

# External PDF parsing (used by pdf-extract APIs)
lopdf = { workspace = true }

# Infrastructure
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rayon = "1.10"
# Replace glibc malloc with jemalloc to control heap fragmentation (#461).
# Processing thousands of PDFs with lopdf creates many small allocations;
# glibc malloc retains freed pages in its sbrk free-list indefinitely, causing
# anon-rss to grow ~10 MB/PDF. jemalloc returns unused arenas to the OS via
# madvise(MADV_FREE), keeping steady-state RSS bounded.
tikv-jemallocator = "0.6"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
num_cpus = "1.16"
indicatif = "0.17"
walkdir = "2"
strsim = "0.11"
regex-lite = "0.1"
# RLIMIT_AS: cap child virtual address space in process-pool mode (Linux only).
libc = "0.2"
