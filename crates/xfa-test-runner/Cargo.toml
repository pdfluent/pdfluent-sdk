[package]
name = "xfa-test-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "xfa-test-runner"
path = "src/main.rs"

[features]
default = []
paddle-ocr = ["dep:pdf-ocr"]
# Pure-Rust ocrs backend — enable with --features ocr
ocr = ["pdf-engine/ocr"]
ocr-mistral = ["pdf-engine/ocr-mistral"]
ocr-onnx = ["pdf-engine/ocr-onnx"]

[dependencies]
# Workspace crates
pdf-syntax = { path = "../pdf-syntax", version = "=0.5.0" }
pdf-xfa = { path = "../pdf-xfa", version = "=1.0.0-beta.1" }
pdf-docx = { path = "../pdf-docx", version = "=1.0.0-beta.1" }
pdf-pptx = { path = "../pdf-pptx", version = "=1.0.0-beta.1" }
pdf-xlsx = { path = "../pdf-xlsx", version = "=1.0.0-beta.1" }
pdf-invoice = { path = "../pdf-invoice", version = "=1.0.0-beta.1" }
zip = { version = "2", default-features = false, features = ["deflate"] }
pdf-engine = { path = "../pdf-engine", version = "=1.0.0-beta.1" }
pdf-forms = { path = "../pdf-forms", version = "=1.0.0-beta.1" }
pdf-annot = { path = "../pdf-annot", version = "=1.0.0-beta.1" }
pdf-sign = { path = "../pdf-sign", version = "=1.0.0-beta.1" }
pdf-extract = { path = "../pdf-extract", version = "=1.0.0-beta.1" }
pdf-compliance = { path = "../pdf-compliance", version = "=1.0.0-beta.1" }
pdf-manip = { path = "../pdf-manip", version = "=1.0.0-beta.1" }
pdf-redact = { path = "../pdf-redact", version = "=1.0.0-beta.1" }

# image is required for render-page subcommand (always enabled).
image = { workspace = true }

# OCR (optional, requires ONNX Runtime)
pdf-ocr = { path = "../pdf-ocr", features = ["paddle"], optional = true, version = "=1.0.0-beta.1" }

# External PDF parsing (used by pdf-extract APIs)
lopdf = { workspace = true }

# Infrastructure
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rayon = "1.10"
# Replace glibc malloc with jemalloc to control heap fragmentation (#461).
# Processing thousands of PDFs with lopdf creates many small allocations;
# glibc malloc retains freed pages in its sbrk free-list indefinitely, causing
# anon-rss to grow ~10 MB/PDF. jemalloc returns unused arenas to the OS via
# madvise(MADV_FREE), keeping steady-state RSS bounded.
tikv-jemallocator = "0.6"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
num_cpus = "1.16"
indicatif = "0.17"
walkdir = "2"
strsim = "0.11"
regex-lite = "0.1"
# RLIMIT_AS: cap child virtual address space in process-pool mode (Linux only).
libc = "0.2"
# LLM vision oracle (render_llm_review test).
reqwest.workspace = true
base64.workspace = true
