[package]
name = "pdfluent-forms"
version = "1.0.0-beta.18"
edition = "2021"
license-file = "LICENSE"
readme = "README.md"
description = "AcroForm engine for PDF interactive forms."
repository = "https://pdfluent.com/source"
homepage = "https://pdfluent.com"
documentation = "https://pdfluent.com/docs"
keywords = ["pdf", "forms", "acroform", "fields", "interactive"]
categories = ["parser-implementations"]

# The corpus-driven examples and gate test read and write an internal
# AcroForm corpus through repo-relative paths and feed a validator script
# that does not ship. They cannot run from a published crate, and cargo
# auto-discovers them into the generated manifest, which put internal
# corpus paths in the tarball (flagged by the prepublish audit).
exclude = [
    "examples/corpus_gate.rs",
    "examples/gen_acroform_corpus.rs",
    "examples/fill_acroform_corpus.rs",
    "tests/corpus_gate.rs",
]

[dependencies]
pdf-syntax = { path = "../pdf-syntax", version = "=0.5.6" }
thiserror = { workspace = true }
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lopdf = { package = "pdfluent-lopdf", path = "../lopdf", version = "=0.39.4" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
lopdf = { package = "pdfluent-lopdf", path = "../lopdf", default-features = false, features = ["wasm_js"], version = "=0.39.4" }

[dev-dependencies]
