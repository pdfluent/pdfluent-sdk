[package]
name = "pdfluent-forms"
version = "1.0.0-beta.1"
edition = "2021"
license = "MIT"
description = "AcroForm engine for PDF interactive forms."
repository = "https://github.com/jasperdew/xfa-native-rust"
homepage = "https://pdfluent.com"

[dependencies]
pdf-syntax = { path = "../pdf-syntax", version = "=0.5.0" }
thiserror = { workspace = true }
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lopdf = { package = "pdfluent-lopdf", path = "../lopdf", version = "=0.39.0" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
lopdf = { package = "pdfluent-lopdf", path = "../lopdf", default-features = false, features = ["wasm_js"], version = "=0.39.0" }

[dev-dependencies]
