[package]
name = "pdfluent-forms"
version = "1.0.0-beta.16"
edition = "2021"
license-file = "LICENSE"
readme = "README.md"
description = "AcroForm engine for PDF interactive forms."
repository = "https://pdfluent.com/source"
homepage = "https://pdfluent.com"
documentation = "https://pdfluent.com/docs"
keywords = ["pdf", "forms", "acroform", "fields", "interactive"]
categories = ["parser-implementations"]

[dependencies]
pdf-syntax = { path = "../pdf-syntax", version = "=0.5.4" }
thiserror = { workspace = true }
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lopdf = { package = "pdfluent-lopdf", path = "../lopdf", version = "=0.39.4" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
lopdf = { package = "pdfluent-lopdf", path = "../lopdf", default-features = false, features = ["wasm_js"], version = "=0.39.4" }

[dev-dependencies]
