[package]
name = "pdfluent-forms"
version = "1.0.0"
edition = "2021"
# AGPLv3-or-later, or the PDFluent Commercial Licence. See LICENSE.
license = "AGPL-3.0-only OR LicenseRef-PDFluent-Commercial"
readme = "README.md"
description = "AcroForm engine for PDF interactive forms."
repository = "https://pdfluent.com/source"
homepage = "https://pdfluent.com"
documentation = "https://pdfluent.com/docs"
keywords = ["pdf", "forms", "acroform", "fields", "interactive"]
categories = ["parser-implementations"]

# Ship the library, licence and docs. The corpus-driven examples and gate
# test read and write an internal AcroForm corpus through repo-relative
# paths and feed a validator script that does not ship, so they cannot run
# from a published crate. `include` rather than `exclude`: an exclude list
# would itself have to name those files, which puts the same internal paths
# back into the packaged manifest.
include = ["src/**/*", "LICENSE", "README.md", "CHANGELOG.md", "LICENSE-AGPL", "LICENSE-COMMERCIAL"]

[dependencies]
pdf-syntax = { path = "../pdf-syntax", version = "=0.5.6" }
thiserror = { workspace = true }
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lopdf = { package = "pdfluent-lopdf", path = "../lopdf", version = "=0.39.5" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
lopdf = { package = "pdfluent-lopdf", path = "../lopdf", default-features = false, features = ["wasm_js"], version = "=0.39.5" }

[dev-dependencies]
