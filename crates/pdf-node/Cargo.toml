[package]
name = "pdf-node"
version = "1.0.0-beta.1"
edition = "2021"
license = "MIT"
description = "Node.js bindings for the PDF engine via napi-rs."

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["async", "serde-json", "napi9"] }
napi-derive = "2"
pdf-engine = { path = "../pdf-engine", version = "=1.0.0-beta.1" }
pdf-forms = { path = "../pdf-forms", version = "=1.0.0-beta.1" }
pdf-annot = { path = "../pdf-annot", version = "=1.0.0-beta.1" }
pdf-sign = { path = "../pdf-sign", version = "=1.0.0-beta.1" }
pdf-compliance = { path = "../pdf-compliance", version = "=1.0.0-beta.1" }
pdf-syntax = { path = "../pdf-syntax", version = "=0.5.0" }
pdf-manip = { path = "../pdf-manip", default-features = false, version = "=1.0.0-beta.1" }
pdf-redact = { path = "../pdf-redact", version = "=1.0.0-beta.1" }
lopdf.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt"] }

[build-dependencies]
napi-build = "2"
