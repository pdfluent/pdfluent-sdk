[package]
name = "pdf-node"
version = "1.0.0-beta.17"
edition = "2021"
license-file = "LICENSE"
description = "Node.js bindings for the PDF engine via napi-rs."
publish = false

[lib]
# `rlib` is added alongside `cdylib` so the crate's Rust tests (e.g. the
# canonical-DTO parity test) can be compiled and run with `cargo test`.
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "2", features = ["async", "serde-json", "napi9"] }
napi-derive = "2"
pdfluent = { path = "../pdfluent", version = "=1.0.0-beta.17.1" }
pdf-engine = { path = "../pdf-engine", version = "=1.0.0-beta.17" }
pdf-forms = { package = "pdfluent-forms", path = "../pdf-forms", version = "=1.0.0-beta.17" }
pdf-annot = { path = "../pdf-annot", version = "=1.0.0-beta.17" }
pdf-sign = { package = "pdfluent-sign", path = "../pdf-sign", version = "=1.0.0-beta.17" }
pdf-compliance = { path = "../pdf-compliance", version = "=1.0.0-beta.17" }
pdf-syntax = { path = "../pdf-syntax", version = "=0.5.6" }
pdf-manip = { path = "../pdf-manip", default-features = false, version = "=1.0.0-beta.17" }
pdf-redact = { path = "../pdf-redact", version = "=1.0.0-beta.17" }
lopdf.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt"] }

[build-dependencies]
napi-build = "2"
