[package]
name = "pdf-manip"
version = "1.0.0"
edition.workspace = true
# AGPLv3-or-later, or the PDFluent Commercial Licence. See LICENSE.
license = "AGPL-3.0-only"
readme = "README.md"
repository.workspace = true
homepage = "https://pdfluent.com"
documentation = "https://pdfluent.com/docs"
description = "PDF manipulation: pages, encryption, watermarks, optimization, bookmarks"

# This integration test reaches a sibling fixture crate by relative path, so
# it cannot run from a published crate. Keep the reason generic: naming the
# internal directory here would put that path straight back into the packaged
# manifest, which is what the prepublish audit flags.
exclude = ["tests/ga_integration_tests.rs"]

[dependencies]
regex = "1"
lopdf = { workspace = true, features = ["embed_image"] }
pdf-font.workspace = true
pdf-standard-fonts = { path = "../pdf-standard-fonts", version = "=1.0.0" }
thiserror.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
flate2 = "1"
sha2 = "0.10"
weezl = "0.1"
image = { workspace = true, optional = true }
subsetter = { workspace = true, optional = true }
xmp-writer = { workspace = true, optional = true }
roxmltree.workspace = true
ttf-parser = { workspace = true }
cff-parser = { workspace = true }
hayro-jbig2 = { package = "pdfluent-jbig2", path = "../hayro-jbig2", optional = true, version = "=0.2.3" }
xfa-license = { path = "../xfa-license", version = "=1.0.0" }

[features]
default = ["serde", "image-insert", "font-subset", "pdfa-convert"]
serde = ["dep:serde", "dep:serde_json"]
watermark-image = ["dep:image"]
image-insert = ["dep:image"]
font-subset = ["dep:subsetter"]
pdfa-convert = ["dep:xmp-writer", "dep:hayro-jbig2"]

# `SystemTime::now()` panics on wasm32-unknown-unknown; the browser clock is
# read through js-sys instead. See src/clock.rs.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[dev-dependencies]
tempfile = "3"
pdf-syntax = { path = "../pdf-syntax" }
pdf-sign = { package = "pdfluent-sign", path = "../pdf-sign" }
pdf-compliance = { path = "../pdf-compliance" }
pdf-engine = { path = "../pdf-engine" }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
