[package]
name = "pdf-manip"
version = "1.0.0-beta.14"
edition.workspace = true
license-file = "LICENSE"
readme = "README.md"
repository.workspace = true
homepage = "https://pdfluent.com"
documentation = "https://pdfluent.com/docs"
description = "PDF manipulation: pages, encryption, watermarks, optimization, bookmarks"

[dependencies]
lopdf = { workspace = true, features = ["embed_image"] }
pdf-font.workspace = true
thiserror.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
flate2 = "1"
weezl = "0.1"
image = { workspace = true, optional = true }
subsetter = { workspace = true, optional = true }
xmp-writer = { workspace = true, optional = true }
roxmltree.workspace = true
ttf-parser = { workspace = true }
cff-parser = { workspace = true }
hayro-jbig2 = { package = "pdfluent-jbig2", path = "../hayro-jbig2", optional = true, version = "=0.2.3" }
xfa-license = { path = "../xfa-license", version = "=1.0.0-beta.14" }

[features]
default = ["serde", "image-insert", "font-subset", "pdfa-convert"]
serde = ["dep:serde", "dep:serde_json"]
watermark-image = ["dep:image"]
image-insert = ["dep:image"]
font-subset = ["dep:subsetter"]
pdfa-convert = ["dep:xmp-writer", "dep:hayro-jbig2"]

[dev-dependencies]
tempfile = "3"
pdf-syntax = { path = "../pdf-syntax" }
pdf-compliance = { path = "../pdf-compliance" }
pdf-engine = { path = "../pdf-engine" }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
