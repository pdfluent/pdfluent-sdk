[package]
name = "xfa-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "WASM bindings for XFA form processing — parse, extract, and convert XFA PDFs in the browser"
publish = false

keywords = ["pdf", "xfa", "wasm", "browser", "forms"]
categories = ["wasm"]
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
xfa-dom-resolver.workspace = true
formcalc-interpreter.workspace = true
xfa-layout-engine.workspace = true
xfa-json.workspace = true
pdf-syntax.workspace = true
pdf-engine = { workspace = true, features = ["xfa"] }
pdf-sign.workspace = true
pdf-compliance.workspace = true
pdf-render = { path = "../pdf-render", optional = true, version = "=1.0.0-beta.1" }
pdf-annot = { path = "../pdf-annot", optional = true, version = "=1.0.0-beta.1" }
wasm-bindgen = "0.2"
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
js-sys = "0.3"
kurbo = "0.13"
pdf-manip = { path = "../pdf-manip", features = ["pdfa-convert"], version = "=1.0.0-beta.1" }

# lopdf: required for text extraction; annotate uses lopdf for mutation.
# Direct path (not workspace = true) to allow per-target default-features override.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lopdf = { package = "pdfluent-lopdf", path = "../lopdf", version = "=0.39.0" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
lopdf = { package = "pdfluent-lopdf", path = "../lopdf", default-features = false, features = ["wasm_js"], version = "=0.39.0" }
# getrandom v0.2 (transitively via p12/pdf-sign) needs "js" feature on wasm32.
getrandom = { version = "0.2", features = ["js"] }
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "CanvasWindingRule",
    "HtmlCanvasElement",
    "ImageData",
    "console",
] }

[features]
default = ["render", "annotate"]
render = ["dep:pdf-render"]
annotate = ["dep:pdf-annot"]
# wasm: browser build — includes vello_cpu render (wasm32-safe), excludes annotate (native-only).
# Use: wasm-pack build --target web --no-default-features --features wasm
wasm = ["render"]

[dev-dependencies]
wasm-bindgen-test = "0.3"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
