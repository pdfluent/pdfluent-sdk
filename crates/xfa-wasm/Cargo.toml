[package]
name = "xfa-wasm"
# Explicit version (not workspace-inherited): the @pdfluent/sdk-wasm npm package
# carries the cross-channel line, which is 1.0.0 as of the GA publish on
# 22-08-2026 (SDK_NON_XFA_PUBLISH_TRAIN_RUNBOOK.md §5 — binding channels are
# unified, the crates.io graph stays heterogeneous). wasm-pack derives the
# generated package.json version from this [package] version, and the
# [package.metadata.npm] block below must say the same thing.
version = "1.0.0"
edition.workspace = true
# AGPLv3-or-later, or the PDFluent Commercial Licence. See LICENSE.
license = "AGPL-3.0-only OR LicenseRef-PDFluent-Commercial"
repository.workspace = true
description = "PDFluent browser SDK — find and replace PDF text, edit, annotate, redact, sign, and validate PDFs (including XFA) entirely client-side via WASM"
publish = false

keywords = ["pdf", "xfa", "acroform", "pades", "wasm"]
categories = ["wasm"]
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
xfa-dom-resolver.workspace = true
formcalc-interpreter.workspace = true
xfa-layout-engine.workspace = true
xfa-json.workspace = true
pdf-syntax.workspace = true
pdf-engine = { workspace = true, features = ["xfa"] }
pdf-sign.workspace = true
pdf-compliance.workspace = true
pdf-render = { path = "../pdf-render", optional = true, version = "=1.0.0" }
pdf-annot = { path = "../pdf-annot", optional = true, version = "=1.0.0" }
wasm-bindgen = "0.2"
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
js-sys = "0.3"
kurbo = "0.13"
pdf-manip = { path = "../pdf-manip", features = ["pdfa-convert"], version = "=1.0.0" }
pdf-redact = { path = "../pdf-redact", version = "=1.0.0" }
pdf-forms = { workspace = true }
pdfluent = { path = "../pdfluent", version = "=1.0.0" }
pdf-text-format = { path = "../pdf-text-format", version = "=1.0.0" }

# lopdf: required for text extraction; annotate uses lopdf for mutation.
# Direct path (not workspace = true) to allow per-target default-features override.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lopdf = { package = "pdfluent-lopdf", path = "../lopdf", version = "=0.39.5" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
lopdf = { package = "pdfluent-lopdf", path = "../lopdf", default-features = false, features = ["wasm_js"], version = "=0.39.5" }
# getrandom v0.2 (transitively via p12/pdf-sign) needs "js" feature on wasm32.
getrandom = { version = "0.2", features = ["js"] }
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "CanvasWindingRule",
    "HtmlCanvasElement",
    "ImageData",
    "console",
] }

[features]
default = ["render", "annotate"]
render = ["dep:pdf-render"]
annotate = ["dep:pdf-annot"]
# wasm: browser build — includes vello_cpu render AND annotations. The
# lopdf wasm_js feature (set per-target above) carries the mutation paths
# needed by pdf-annot, pdf-manip, pdf-redact, pdf-forms.
# Use: wasm-pack build --target web --no-default-features --features wasm
wasm = ["render", "annotate"]

[dev-dependencies]
wasm-bindgen-test = "0.3"

# Used by tests/edit_handle.rs to synthesise minimal PDFs with known
# extractable text runs (avoids dependency on specific corpus encoding).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
lopdf = { package = "pdfluent-lopdf", path = "../lopdf", version = "=0.39.5" }

# npm package identity — set by scripts/release/transform-wasm-pkg.sh at
# publish time. Cargo workspace version and npm version are independent.
[package.metadata.npm]
name = "@pdfluent/sdk-wasm"
version = "1.0.0"

[package.metadata.wasm-pack.profile.release]
# B3 — wasm-opt -O3 enabled after evaluation. See
# benchmarks/runs/post_beta_execution/B3_FINAL_REPORT.md for the gates
# and measurements (cold init -13.3%, median key-op runtime -7.9%,
# raw .wasm -7.0%, golden byte-identical across 34/34 outputs).
#
# The --enable-* flags below are validator allowances, not new
# optimization passes: rustc 1.95 already emits bulk-memory and SIMD ops
# on wasm32-unknown-unknown, and wasm-opt v117 refuses to parse them
# without the matching enable flags. They do not synthesize new SIMD or
# threading code.
wasm-opt = [
    "-O3",
    "--enable-bulk-memory",
    "--enable-mutable-globals",
    "--enable-nontrapping-float-to-int",
    "--enable-sign-ext",
    "--enable-reference-types",
    "--enable-simd",
]
