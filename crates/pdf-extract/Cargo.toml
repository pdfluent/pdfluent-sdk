[package]
name = "pdfluent-extract"
version.workspace = true
edition.workspace = true
license-file = "LICENSE"
readme = "README.md"
repository.workspace = true
homepage = "https://pdfluent.com"
documentation = "https://pdfluent.com/docs"
description = "PDF content extraction: images, text with positions, and full-text search"
keywords = ["pdf", "text", "extraction", "search", "document"]
categories = ["text-processing", "parser-implementations"]

[dependencies]
thiserror.workspace = true
flate2 = "1"
unicode-normalization = "0.1"

# lopdf: full-featured on native, wasm_js backend (no rayon) on wasm32.
# Direct path used (not workspace = true) to allow default-features = false override.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lopdf = { package = "pdfluent-lopdf", path = "../lopdf", version = "=0.39.1" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
lopdf = { package = "pdfluent-lopdf", path = "../lopdf", default-features = false, features = ["wasm_js"], version = "=0.39.1" }

[dev-dependencies]
tempfile = "3"
