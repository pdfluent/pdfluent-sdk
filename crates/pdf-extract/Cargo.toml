[package]
name = "pdfluent-extract"
version = "1.0.0"
edition.workspace = true
# AGPLv3-or-later, or the PDFluent Commercial Licence. See LICENSE.
license = "AGPL-3.0-or-later"
readme = "README.md"
repository.workspace = true
homepage = "https://pdfluent.com"
documentation = "https://pdfluent.com/docs"
description = "PDF content extraction: images, text with positions, and full-text search"
keywords = ["pdf", "text", "extraction", "search", "document"]
categories = ["text-processing", "parser-implementations"]

[dependencies]
thiserror.workspace = true
flate2 = "1"
unicode-normalization = "0.1"
# Re-encode raw PDF image samples into valid PNG for document export (DOCX/PPTX/XLSX).
# PNG-only + no default features to stay light and wasm-compatible.
image = { version = "0.25", default-features = false, features = ["png"] }

# lopdf: full-featured on native, wasm_js backend (no rayon) on wasm32.
# Direct path used (not workspace = true) to allow default-features = false override.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lopdf = { package = "pdfluent-lopdf", path = "../lopdf", version = "=0.39.5" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
lopdf = { package = "pdfluent-lopdf", path = "../lopdf", default-features = false, features = ["wasm_js"], version = "=0.39.5" }

[dev-dependencies]
tempfile = "3"
