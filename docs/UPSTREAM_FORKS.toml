niet_mergen = "geen forkpunt vast te stellen: 2 van 10 bestanden identiek, en aan de hele upstream-historie tegelijk, dus zonder onderscheidend vermogen (#262)"
gelijk_met = "0.2.1"
waarom = "CFF font parsing. Level with upstream, or slightly ahead."

