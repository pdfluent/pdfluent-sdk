# Deletions that reached master without a `Removes-deliberately:` trailer,
# declared afterwards (#592). A trailer can only travel on the commit that
# deletes, so these could never be declared the ordinary way, and
# deletions-declare-themselves.yml -- whose push base is the last green run --
# reported the same paths on every run and was not green once from 12-09 on.
#
# An entry counts only when its commit is in the history being checked AND
# deletes every path it lists (scripts/ci/a_deletion_declares_itself.py). This
# is for the past: a new deletion carries its trailer.
