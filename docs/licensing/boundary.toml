# Which side of the licence boundary each first-party crate is on.
#
# #220 asks for the boundary as DATA, not prose: "een lijst die CI kan lezen".
# scripts/ci/license_boundary.py reads this and fails when a crate's Cargo.toml
# stops agreeing with the side it is booked on.
#
# WHY A CRATE CAN COST MONEY BY MOVING SIDES
#
# `ours` is dual-licensed AGPLv3 + commercial after LC9. `forked` stays
# permissive: NOTICE promises those "may be used without a commercial license
# from PDFluent", and there is no revenue in them anyway -- nobody buys a
# licence for a JBIG2 decoder. The value is XFA, forms, PDF/A, signing and
# conversion.
#
# Move a forked crate to `ours` and we break that promise to people who already
# have the code. Move one of ours to `forked` and we publish the product under a
# permissive licence, which cannot be taken back. Neither shows up as a failing
# test; both show up in a lawyer's letter.
#
# THE WORKSPACE-MIT TRAP, and why `internal` exists at all
#
# The workspace root declares `license = "MIT"`. Six crates inherit it, and all
# six are `publish = false` today, so nothing has ever gone to crates.io as MIT.
# That is a coincidence of discipline, not a mechanism: add a crate, forget
# `publish = false`, and the proprietary SDK ships to crates.io declaring MIT --
# an irrevocable grant, made by omission.
#
# So `internal` carries `publish_false = true` on every row, and the gate
# refuses any crate that inherits the workspace licence without it.
#
# WHAT IS BOOKED HERE, AFTER #295
#
# Every tracked manifest, not only `crates/*/Cargo.toml`. The gate globbed one
# level deep and seven first-party crates sat outside it -- three fuzz
# directories inside forks, the top-level fuzz crate, the snippet extractor, a
# probe under scripts/quality and the Rust example -- all MIT-inheriting or
# licence-less, all `publish = false` by habit, none of them looked at. The
# bindings' own manifests (npm, PyPI, Maven, NuGet) were not looked at either.
#
# `[[crate]]` rows book a Cargo.toml by directory, wherever it is. `[[package]]`
# rows book everything else by manifest path. A fourth side, `example`, holds
# sample code: never published, and whatever it declares is recorded in
# `declares` so that a change to it is a change to this file.


# --- ours: license = "AGPL-3.0-only OR LicenseRef-PDFluent-Commercial" ---
#
# Every `ours` row that is publishable also has a row in
# docs/release/canonical_licenses.toml with license_kind = "agpl-or-commercial";
# every `forked` row has one with "open-source-derivative"; `internal` and
# `publish_false` rows have none. scripts/ci/one_licence_three_registers.py
# holds the three files to that table (#304).

