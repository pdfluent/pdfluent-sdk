# The legacy `com.xfa.pdf:xfa-pdf` pom. Superseded by bindings/java, deploy
# hard-disabled in the file itself, kept so the historic sources still compile.
# It still says MIT, which is what it was published under before; recorded
# rather than removed, because removing it would look like relicensing code
# people already hold. The gate refuses the moment the deploy skip goes.
[[package]]
manifest = "crates/pdf-java/pom.xml"
side = "internal"
declares = "MIT License"

