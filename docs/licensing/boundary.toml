# --- The other ecosystems (#295) ---
#
# What PyPI, npm, Maven Central and nuget.org actually read. `ours` here means
# the manifest carries the canonical expression, or the spelling
# docs/LICENSE_POLICY.toml [channel_representation] records for a channel that
# cannot carry it.

[[package]]
