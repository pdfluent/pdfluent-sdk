[[asset]]
url_prefix = "https://pmc-oa-opendata.s3.amazonaws.com"
what = "PubMed Central Open Access Subset on AWS Open Data — one PDF and one metadata record per article; the documents the PubTables-1M annotations are about"
used_by = "scripts/ci/loop/structured_bench.py"
licence = "per article; the fetch keeps CC0 and CC BY and refuses every other code by name"
licence_source = """
https://pmc.ncbi.nlm.nih.gov/tools/openftlist/ states two things this row is
built on. First: "License terms vary. Please refer to the license statement in
each article for specific terms of use." Second: "The PMC Cloud Service, PMC
OAI-PMH Service, E-Utilities and BioC API are the only services that may be
used for automated retrieval of PMC content. Systematic retrieval (or bulk
retrieval) of articles through any other automated process is prohibited." The
Cloud Service publishes each article's own licence code in the JSON beside its
PDF, which is that per-article statement in a form a protocol can obey.
"""
verified = "2026-09-20"
decision = """
Usable through the Cloud Service and through nothing else, per article, and
only for the codes the register allows. The fetch reads each article's metadata
BEFORE its PDF and skips anything that is not CC0 or CC BY; refusals are booked
in the manifest by name, so the corpus reads back as what was allowed rather
than as what was taken. Share-alike and no-derivatives are refused although
they permit commercial use, because where the reading is a judgement this
programme errs against itself -- the subset is large enough that a round does
not need them.

The legacy FTP tree at ftp.ncbi.nlm.nih.gov/pub/pmc is NOT a route: it is being
removed (readme, 2026-08-25) and it is not one of the four services the terms
name.
"""

