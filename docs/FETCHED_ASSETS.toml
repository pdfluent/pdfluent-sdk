# Third-party assets this software fetches over the network, and what may be
# done with them (#214).
#
# WHY THIS FILE EXISTS
#
# `license_gate.py` reads manifests: Cargo.toml, package.json, pom.xml, csproj,
# pyproject. A model downloaded at run time appears in none of them, so the whole
# ecosystem sweep steps over it -- and a set of model weights is exactly the kind
# of third-party work whose licence is not the same as the licence of the code
# that fetches it.
#
# The knowledge was already written down, in prose, in
# docs/OSS_INVENTORY_MISSING_FEATURES.md and docs/GAP_INVENTORY_1_0.md. Prose is
# not a check: nothing failed when the fetch was added, and nothing would fail if
# a second one were added tomorrow. This file is the register the guard reads.
#
# WHAT A ROW MEANS
#
# `licence` is what the SOURCE states, not what we would like it to be. Where the
# source states nothing, that is what the row says, and `decision` records what
# the owner has decided to do about it. The guard checks that every fetch has a
# row; it does not decide whether a licence is acceptable. That is not a
# machine's judgement.

