# Gates the pre-push gate runs that no pull-request workflow reaches, and why
# (#232).
#
# WHY THIS FILE EXISTS
#
# scripts/ci/local_ci_gate.sh runs on the machine of whoever pushes. An outside
# contributor never touches it: they open a pull request, and whatever runs there
# is the whole of what stands between their change and master. A guard that lives
# only in the pre-push gate is a guard that exists and does not run at the moment
# it counts -- with a stranger watching, which is exactly when it is needed.
#
# So the rule is: every gate is reachable from a pull request, or it is listed
# here with a reason. "Not got round to it" is not a reason; each entry says what
# the gate needs that a pull-request runner does not have.

[[exempt]]
gate = "no_withdrawn_object.py"
why = """
Reads the list of withdrawn objects from ~/.config/pdfluent, deliberately outside
the tree (#260: publishing the blocklist would publish where the withdrawn thing
can still be fetched). A hosted runner has no such file, so the guard would
report SKIPPED (not a pass) on every pull request -- a permanent red that teaches
people to ignore it. Its TEST does run there, so the mechanism stays covered.
"""

[[exempt]]
gate = "every_commit_since_the_cutoff_is_signed.py"
why = """
Judges the commits a PUSH adds, from the upstream ref. On a pull request that
range is a different question with a different answer, and ci.yml already carries
a sign-off job shaped for that event. Two gates answering the same question
differently is worse than one.
"""

[[exempt]]
gate = "every_label_has_a_runner.py"
why = """
Asks the GitHub API which self-hosted runners carry which labels. That needs a
token with runner scope, which a pull request from a fork must never have.
"""

[[exempt]]
gate = "run_build.sh"
why = """
ci.yml builds the workspace in its own step under its own name. This wrapper
exists to give the pre-push gate one command; it is the same build.
"""

[[exempt]]
gate = "run_clippy.sh"
why = """
Same as run_build.sh: ci.yml runs clippy in its own step. The wrapper is a
pre-push convenience, not a separate check.
"""

[[exempt]]
gate = "site_blocks_compile.py"
why = """
Builds five hundred small Rust programs -- every code block on pdfluent.com --
against the real facade, in a throwaway crate with its own target directory. It
is a cargo build, not a check, and a hosted pull-request runner would pay for it
from the minutes #333 is trying to get to zero while the repository is private.
It runs in the full local lane, on a push to master, which is the lane the heavy
gates already live in.

What a pull request does reach is the half that needs no compiler:
test_site_blocks_register.py reads the exception register in both directions and
holds the hand-over digest against the export. That is where the failure that
costs the most shows up -- an entry excusing a block that has compiled for
months, or an export that has drifted away from the site it claims to describe --
and it takes seconds. The website refuses its own build against that same digest,
so a new block cannot reach a reader before the compiler here has seen it.
"""

[[exempt]]
gate = "mirror_has_not_drifted.py"
why = """
Compares `github/master` with `origin/master`, so it needs both remotes in one
checkout. An Actions workspace has exactly one, and there the guard announces
SKIPPED (not a pass) and compares nothing -- a permanent skip that reports the
same green as a check. The one checkout that carries both is the working copy,
which is where the pre-push gate runs; it is deferred there in the fast lane and
refuses in the full one, which is the landing on master.

Added 05-09-2026 with #231, and the row is the second half of a repair rather
than a new excuse: the guard had been booked as running "on the machine that
mirrors" and was in fact called by nothing, for months. The backup was 348
commits behind and 8 commits ahead at the same time before anybody looked.
"""
