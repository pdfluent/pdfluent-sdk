#
# Rust blocks on pdfluent.com that cannot compile here, each with the reason.
#
# WHY THIS FILE EXISTS
#
# `site_blocks_compile.py` compiles every Rust program the site shows and counts
# the ones that fail. A single count answers the wrong question: some blocks
# cannot pass in this harness for a reason that has nothing to do with the
# documentation, and counting those as debt hides the blocks that really are
# wrong behind noise nobody can work off.
#
# So the rule is: **a published block either compiles, or it is named here.**
# Not a category, not a glob -- one entry per block, with what it is and why.
#
# CHECKED IN BOTH DIRECTIONS
#
# An exception list that is only read when something fails is a list that only
# grows. `site_blocks_compile.py` therefore fails on all four of:
#
#   * a block that fails to compile and is not named here;
#   * a block named here that compiles -- the reason is gone, so is the entry;
#   * an entry naming a block the export no longer carries;
#   * a `kind` outside the two below, or an entry missing `why`.
#
# The second is the one that matters, and on 05-09-2026 it earned its keep: all
# four entries that survived the regrouping had started compiling, and the gate
# said so instead of quietly excusing them.
#
# THE TWO KINDS, AND NOTHING ELSE
#
#   external-crate  The block needs a third-party crate the harness does not
#                   link. Four common ones are linked (`anyhow`, `serde_json`,
#                   `base64`, `rayon`): they are already in this workspace, so
#                   `--offline` resolves them and a reader who copies such a
#                   recipe does the same in their own manifest. What stays out
#                   is the cloud and browser graph -- `tokio`, `reqwest`,
#                   `aws_sdk_*`, `lambda_runtime`, `wasm_bindgen` -- which
#                   nobody here maintains and which would tie this gate to the
#                   network.
#   not-rust        The block is tagged Rust and is not.
#
# There were four kinds. `fragment` -- a block continuing an earlier one on the
# same page -- and `harness-bundle` -- two blocks in one unit defining the same
# item -- were both artefacts of how the export cut the site up. The export now
# groups a page section into the one program it is, so a step can see what the
# block above it opened, and both kinds lapsed on the same day: 39 entries and
# 88 uncounted failures with them. They are out of the closed list rather than
# left standing unused.
#
# NOT A PLACE TO PUT A BROKEN EXAMPLE
#
# A block that names an API that does not exist does not belong here under any
# kind. That is the thing being measured. The ratchet in `docs/SITE_BLOCKS.md`
# counts exactly the blocks that fail and are *not* named here, so moving one
# in would be moving the goalposts -- which is why the size of this file is
# capped in the script.

