#
# Rust blocks on pdfluent.com that cannot compile on their own, each with the
# reason.
#
# WHY THIS FILE EXISTS
#
# `site_blocks_compile.py` compiles every Rust block the site shows and counts
# the ones that fail. A single count answers the wrong question. On 30-08-2026
# it stood at 364 of 551, and 49 of those 364 were not a documentation defect
# at all: 42 were steps two through five of a numbered list, whose `use` lines
# and bindings sit in step one, and 7 were AWS Lambda and WebAssembly recipes
# built on crates the harness deliberately does not link. Compiled one at a
# time, in isolation, they cannot pass -- and counting them as debt hides the
# blocks that really are wrong behind noise that can never be worked off.
#
# So the rule is: **a published block either compiles, or it is named here.**
# Not a category, not a glob -- one entry per block, with what it is and why.
#
# CHECKED IN BOTH DIRECTIONS
#
# An exception list that is only read when something fails is a list that only
# grows. `site_blocks_compile.py` therefore fails on all four of:
#
#   * a block that fails to compile and is not named here;
#   * a block named here that compiles -- the reason is gone, so is the entry;
#   * an entry naming a block the export no longer carries;
#   * a `kind` outside the four below, or an entry missing `why`.
#
# The second is the one that matters. Without it this file silently accumulates
# blocks that were fixed years ago, and the count it excuses stops meaning
# anything -- the same failure mode as a test that no longer asserts.
#
# THE FOUR KINDS, AND NOTHING ELSE
#
#   fragment        The block continues an earlier block on the same page. Its
#                   imports or its bindings are there. #247 removes this whole
#                   class: once the site pulls code by key out of
#                   `crates/pdfluent/examples/site_snippets.rs`, a page is one
#                   compiling program and a step is a slice of it.
#   external-crate  The block needs a third-party crate the harness does not
#                   link (`tokio`, `aws_sdk_s3`, `wasm_bindgen`). Linking them
#                   would make this gate depend on the network and on a crate
#                   graph nobody here maintains.
#   not-rust        The block is tagged Rust and is not.
#   harness-bundle  The export bundles a whole section into one unit and two
#                   blocks in it define the same item. A defect in the export,
#                   not in the site.
#
# `fragment` and `harness-bundle` are debts, not verdicts. Both disappear when
# the export gives one unit per block and the site carries keys rather than
# prose. Neither is a reason to leave a block wrong.
#
# NOT A PLACE TO PUT A BROKEN EXAMPLE
#
# A block that names an API that does not exist does not belong here under any
# kind. That is the thing being measured. The ratchet in `docs/SITE_BLOCKS.md`
# counts exactly the blocks that fail and are *not* named here, so moving one
# in would be moving the goalposts -- which is why the size of this file is
# capped in the script.

