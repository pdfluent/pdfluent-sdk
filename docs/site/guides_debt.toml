#
# Rust programs on published copy-from pages of pdfluent.com that do not
# compile -- the how-to guides, the how-tos, and the error pages.
#
# WHY THIS FILE IS NOT THE OTHER REGISTER
#
# `blocks_exceptions.toml` names blocks that cannot compile in this harness for
# a reason outside the documentation -- a cloud crate nobody here links. Those
# are excused. Nothing in this file is excused. Every entry is a page a reader
# can open today, showing Rust that does not build, and every entry is work.
#
# WHY IT EXISTS AT ALL
#
# `docs/SITE_BLOCKS.md` holds a ceiling over the whole site: so many programs
# fail, and that number may not rise. A ceiling cannot see who carries the
# damage. `how-to-guides/pdfa.json` described `fix_pdf_a_errors` and
# `PdfAFixOptions` -- neither exists in any crate -- for months on a page in the
# sitemap, and the number never moved, because repairing something elsewhere had
# paid for it. That is what a count buys you (#499).
#
# So the three trees a reader is sent to in order to copy code --
# `public/content/en/how-to-guides/`, `public/content/en/how-to/` and
# `public/content/en/errors/` -- are judged by name. A program on a published
# page there compiles, or it is written down here.
#
# The error pages joined on 10-09-2026 (#476). They are the pages read under the
# most pressure -- a reader arrives with a stack trace and pastes the fix -- and
# two of them handed out a `?` on a `Page`, which is not a `Result`. Both sat
# inside the ceiling from the day it was drawn.
#
# Making that tree strict named seven more of them on the spot, and they are the
# first seven entries below. That is the whole point of the mechanism: they were
# not new, they were invisible, and now they cannot get worse and no eighth can
# join them quietly. What each of them asks for is on #535.
#
# CHECKED IN BOTH DIRECTIONS, AND IT MAY ONLY SHRINK
#
# `site_blocks_compile.py` fails on all four of:
#
#   * a published guide program that does not compile and is not named here --
#     the point of the file;
#   * an entry naming a program that compiles now;
#   * an entry naming a program the page no longer publishes (hidden or moved);
#   * an entry naming a program the export no longer carries.
#
# There is no way to add an entry that makes the gate quieter about anything
# other than the exact program it names, and taking a page out of the sitemap is
# a repair the gate accepts -- it costs the page.
#
# `error` is the first thing rustc said when the entry was made. It is there so
# the list can be read, not asserted on: the wording of a compiler message is
# not a contract.

