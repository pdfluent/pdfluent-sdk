# Accepted gaps in the capability register.
#
# `scripts/ci/capability_register.py --gate` fails on any gap that is not listed
# here. That is the mechanism: a gap in this file is a decision somebody wrote
# down, and a gap missing from it is a surprise. Adding an entry is cheap, which
# is fine — the cost was never meant to be the obstacle. Having to state a reason
# is, because it turns silence into a sentence someone else can disagree with.
#
# Nothing here hides anything from the generated register: docs/CAPABILITY_REGISTER.md
# still lists every gap. An exception silences the alarm, never the fact.
#
# One category has no exception mechanism at all, on purpose: a crate with tests
# that no CI job executes. That is the failure this entire system was built to
# prevent, and there is no reason worth accepting for it.

[rust_only]
# Advertised for the SDK, callable only from Rust. Real gaps, not design choices.
"PDF to Word" = "Roadmap F7.1, blocking for 1.0. pdf-docx is reachable from the Rust facade and fully tested, but no binding exports it — zero mentions of docx across all five binding sources. A Python or Node customer cannot call it at all."
"PDF to Excel" = "Roadmap F7.1, blocking for 1.0. Same as PDF to Word: wired into the facade on 2026-08-18, never into a binding."
"PDF to PowerPoint" = "Roadmap F7.1, blocking for 1.0. Same as PDF to Word."

[unreachable_crates]
# Published, and absent from the facade dependency graph entirely.
"pdf-ocr" = "Deliberate. Wiring it in would make every pdfluent user carry an OCR stack: Tesseract needs C system libraries, and PaddleOCR needs ONNX Runtime plus model weights. Opting in is the customer's decision. See crates/pdf-ocr/README.md."
"pdf-invoice" = "Roadmap: wiring job, size S. Implements ZUGFeRD/Factur-X/XRechnung embedding AND validation; the facade simply does not depend on it. Nothing to build, only to expose and test."
"pdf-text-format" = "Engine-internal text formatting, consumed by pdf-manip and the XFA layout engine rather than by callers. Published because the workspace publishes everything it builds; not intended as customer API."

[runtime_stubs]
# Methods that compile and fail when called. Each needs implementing or removing.
"add_decoration" = "PageDecoration models watermarks only; positioned headers, footers and page numbers are build item B5. Currently returns MissingDependency rather than doing nothing silently, which is the right failure."
"embed_font" = "Font embedding exists in pdf-manip (unicode_font.rs) but is not surfaced here. Deferred stub, listed in the build plan."
"flatten_forms" = "Form flattening lives in pdf-forms and behind the xfa-flatten path; the facade entry point was never connected. Deferred stub."
"linearize" = "Linearisation (fast web view) is not implemented. The read side reports linearisation status; producing it is a separate job."
"form_mut" = "Mutable form access needs the engine sync contract settled first — handing out a mutable handle while the engine holds its own copy is how the page-count layers drifted apart."

[capabilities]
# Capabilities in a state other than `shipped`. Empty is the goal.

