# =============================================================================
# CANONICAL LICENSE REGISTRY
# =============================================================================
#
# Single source of truth for the license of every publish-eligible workspace
# crate. The file is enforced by `scripts/release/license_registry_check.py`,
# which runs as a gate in `scripts/ci/local_ci_gate.sh` (and therefore in the
# pre-push hook + before every `cargo publish`), and compared with the other
# two crate registers by `scripts/ci/one_licence_three_registers.py` (#304).
#
# THIS REGISTER COVERS THE CARGO CHANNEL ONLY, and that is a rule, not a gap.
# A crate has a row here iff its Cargo.toml is publishable; the sixteen
# `publish = false` crates have none, and the comparison guard fails when a row
# and a publish flag disagree. The other channels -- npm (pdf-node, xfa-wasm),
# PyPI (pdf-python), NuGet, Maven -- are not crates and have no `[[crate]]`
# shape; they are declared per manifest in `docs/LICENSE_POLICY.toml` under
# `[own_packages]` and `[channel_representation]`, read by
# `scripts/ci/license_gate.py`, and carry the same canonical expression or a
# recorded per-channel spelling of it with the reason.
#
# Why this registry exists
# ------------------------
# 1. A crate's license is set BEFORE first publish and CANNOT be changed
#    afterward without a yank + bump + republish (which is painful for
#    downstream consumers). So mistakes are very expensive.
# 2. Hayro-derived crates inherit upstream Apache-2.0/MIT obligations and
#    CANNOT be relicensed under a proprietary licence. Treating them as
#    "ours" would be a real legal exposure.
# 3. PDFluent-original IP must NOT accidentally ship under an open-source
#    licence (e.g. by template copy-paste) — every commercial line of
#    revenue depends on this not happening.
#
# How the gate works
# ------------------
# For each `[[crate]]` entry the check script verifies:
#   1. `crates/<workspace_dir>/Cargo.toml` declares the EXACT `license_decl`
#      with the EXACT `license_value` from the registry.
#   2. Every file in `required_files` exists in `crates/<workspace_dir>/`.
#   3. If `license_first_line_check` is set, the first non-blank line of
#      the named file matches the expected string (literal or contains).
#   4. The workspace has no `publish = true` crate missing from this
#      registry (catches "I added a new crate and forgot the license").
#
# How to change a registry entry
# ------------------------------
# Each registry change is a SEPARATE, focused commit. The commit message
# must explain WHY the licence is being assigned/changed and what audit
# was performed. See `docs/release/PUBLISH_PROTOCOL.md`.
#
# Fields
# ------
# - published_name : the [package].name in Cargo.toml — the name that appears
#                    on crates.io (renamed via `package = "..."` if needed).
# - workspace_dir  : directory under `crates/` (basename only).
# - license_kind   : "agpl-or-commercial" | "open-source-derivative". Must
#                    translate to the crate's `side` in docs/licensing/boundary.toml
#                    (ours / forked); scripts/ci/one_licence_three_registers.py
#                    compares the two, together with the manifest (#304).
# - license_decl   : "license" or "license-file" — the Cargo.toml field name.
# - license_value  : the exact value that must follow `=` in Cargo.toml.
# - required_files : list of file basenames that MUST live in the crate root.
# - license_first_line_check : optional — verify a specific file's first line.
# - forbidden_change : informative — registries cannot be changed without
#                      explicit governance.
# - heritage       : human-readable note on copyright lineage.
#
# Schema version
# --------------
schema_version = "1"


# =============================================================================
# PDFluent-original crates (AGPL-3.0-only OR PDFluent Commercial)
# =============================================================================
# These crates contain only PDFluent-authored code. Reverse-license-audit
# (grep for hayro/Stampfl/Laurenz attribution in src/) returns zero hits.
# Since #257 they are published under ONE expression on every channel:
# `AGPL-3.0-only OR LicenseRef-PDFluent-Commercial`. They are `ours` on the
# licence boundary, and MUST NOT be published under a permissive licence.

[[crate]]
published_name = "xfa-dom-resolver"
workspace_dir  = "xfa-dom-resolver"
license_kind   = "agpl-or-commercial"
license_decl   = "license"
license_value  = "AGPL-3.0-only OR LicenseRef-PDFluent-Commercial"
required_files = ["LICENSE", "LICENSE-COMMERCIAL"]
license_first_line_check = { file = "LICENSE", literal = "                    GNU AFFERO GENERAL PUBLIC LICENSE" }
forbidden_change = true
heritage = "PDFluent original. XFA template/data DOM with SOM-path resolution."

