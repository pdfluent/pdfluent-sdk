# Exported error classes, seeded from the pinned
# black box (PyMuPDF 1.28.2, names and base-class names only).
# Tiers arrive from specs/api/usage.json via
# scripts/compat/apply_usage.py.
class: exceptions
rust_path: pdfluent::compat
names: {python: pdfluent.compat, node: pdfluent-compat, java: com.pdfluent.compat, dotnet: Pdfluent.Compat}
members:
  # bases, as read from __mro__ names: FileDataError, RuntimeError, Exception, BaseException, object.
  - name: EmptyFileError
    kind: property
    signature: "()"
    names: {python: EmptyFileError, node: EmptyFileError, java: EmptyFileError, dotnet: EmptyFileError}
    rust: "ErrorKind::EmptyFile"
    tier: T2
    lane: P0
    status: missing
    tests: [p0-exceptions-emptyfileerror]
  # bases, as read from __mro__ names: RuntimeError, Exception, BaseException, object.
  - name: FileDataError
    kind: property
    signature: "()"
    names: {python: FileDataError, node: FileDataError, java: FileDataError, dotnet: FileDataError}
    rust: "ErrorKind::UnreadableFile"
    tier: T2
    lane: P0
    status: missing
    tests: [p0-exceptions-filedataerror]
  # bases, as read from __mro__ names: RuntimeError, Exception, BaseException, object.
  - name: FileNotFoundError
    kind: property
    signature: "()"
    names: {python: FileNotFoundError, node: FileNotFoundError, java: FileNotFoundError, dotnet: FileNotFoundError}
    rust: "ErrorKind::MissingFile"
    tier: T3
    lane: P0
    status: missing
    tests: [p0-exceptions-filenotfounderror]
  # bases, as read from __mro__ names: DeprecationWarning, Warning, Exception, BaseException, object.
  - name: FitzDeprecation
    kind: property
    signature: "()"
    names: {python: FitzDeprecation, node: FitzDeprecation, java: FitzDeprecation, dotnet: FitzDeprecation}
