# Module-level constants, seeded from the pinned
# black box (PyMuPDF 1.28.2, names read at runtime). Tiers arrive
# from specs/api/usage.json via scripts/compat/apply_usage.py.
#
# Left out on purpose: reference message text (messages are our
# own), mutable runtime state (load caches, live counters, warning
# logs), build identity (version and toolchain marks: our build
# reports itself), and internal sentinels and tables that hold
# callables rather than values.
