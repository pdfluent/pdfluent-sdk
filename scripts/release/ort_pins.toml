# The ONNX Runtime 1.23.2 pin table: the single source for the five runtime
# libraries `pdfluent models install` ships (one per platform).
#
# Every library comes from the OFFICIAL microsoft/onnxruntime v1.23.2 GitHub
# release assets below -- never from a wheel, never from a CDN mirror. The
# archive digests were cross-checked against the release API's own `digest`
# fields (all five match); the library digests are over the extracted member
# bytes that the release workflow stages. `fetch_ort_libs.py` reads this file,
# verifies both digests, and refuses on any mismatch.
#
# Platform keys and `asset` names mirror `OrtLibrary` in
# crates/pdfluent-cli/src/cmd_models.rs (`platform`, `remote`) exactly; the
# test holds the two to the same five pairs.
