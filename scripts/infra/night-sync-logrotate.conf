# Logrotate voor de nachtelijke corpusoverdracht.
#
# Installeren als /etc/logrotate.d/night-sync op de WSL-desktop.
#
# Dit log leeft op de virtuele schijf van WSL, en die groeit wel maar krimpt
# nooit: elke MB die hier blijft staan is een MB die van C: af gaat en pas bij
# de weekelijkse compactie terugkomt. Vandaar een korte bewaartermijn.
/var/log/night-sync.log {
    # Zonder deze regel weigert logrotate te roteren omdat /var/log op Ubuntu
    # 775 root:syslog is -- en het meldt dat alleen in debug-uitvoer, dus het
    # log zou stilzwijgend eeuwig doorgroeien. Dezelfde regel staat in Ubuntu's
    # eigen /etc/logrotate.conf.
    su root syslog
    weekly
    rotate 4
    compress
    delaycompress
    missingok
    notifempty
    maxsize 20M
    copytruncate
}
