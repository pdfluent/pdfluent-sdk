#
# Guards that run on the GitLab mirror and nowhere else, each with the reason
# it stays there.
#
# GitHub has been the main remote since 25-08-2026 and GitLab a nightly copy of
# it. A job declared only in .gitlab-ci.yml therefore runs after the night, on a
# backup, against a branch nobody is merging. It cannot block anything, and a
# red job on a mirror is read by nobody -- which is worse than no job at all,
# because a check by that name still appears to exist.
#
# Two cases had already cost something by the time they were counted. The real
# PDF/A gate converts a thousand documents against a stored baseline and ran on
# the mirror alone, while what stood before a merge on GitHub was a second,
# broken gate that could not fail (#286). The advisory scan was on GitHub but
# used a Docker action on a runner without docker, and four vulnerabilities sat
# behind it for months (#287).
#
# `every_guard_has_a_job.py` reads this file in both directions:
#
#   * a guard that runs only on the mirror and is not named here fails the
#     build -- the decision has to be written down, not assumed;
#   * an entry naming a guard that now runs on GitHub fails too, and so does an
#     entry naming a script that no longer exists -- otherwise the reason
#     outlives the situation it describes and goes on reading as current.
#
# Fields, all required:
#   script  the file in scripts/ci/, by name
#   reason  one of: corpus, runner, covered-elsewhere, credentials
#   why     what would break if this ran in GitHub Actions
#   issue   where it was decided

# --- corpus ----------------------------------------------------------------
# The corpus machine is not registered as a GitHub runner (#276) and does not
# see master (#284). Until it is, these cannot stand before a merge on GitHub
# without being permanently skipped, and a permanent skip reports the same
# green as a pass.

[[guard]]
script = "pdfa_conformance_gate.py"
reason = "corpus"
issue = "#286"
why = """Converts a thousand holdout documents and compares conformance against \
a stored baseline. It needs the corpus disk and a veraPDF install, and it runs \
for tens of minutes. The offline half now runs on GitHub instead: \
test_pdfa_gate_label.py holds the gate to naming the sample its number came \
from, and test_retention_report.py holds the retention arithmetic to counting \
only numbers. A gate whose parser stops understanding its own output therefore \
fails before a merge, even though the measurement itself does not."""

[[guard]]
script = "text_replace_corpus_gate.py"
reason = "corpus"
issue = "#276"
why = """Measures text replacement across the corpus on the `pdfluent-xfa-corpus` \
runner. Same reason as the PDF/A gate: the corpus is not reachable from a GitHub \
runner. What it passes on to that runner is checked on GitHub by \
test_text_replace_gate.py -- the failure that mattered was an argument the gate \
never had, which made the job exit in under a second for months."""

[[guard]]
script = "corpus_preflight.sh"
reason = "corpus"
issue = "#276"
why = """Checks the corpus is mounted and readable before a corpus job spends an \
hour finding out it is not. On a machine without the corpus it can only report \
absence, every single run. Its behaviour without a corpus -- and against a disk \
that answers stat but not read -- is tested on GitHub by test_corpus_preflight.py."""

# --- runner ----------------------------------------------------------------
# These do not check the change under review. They check the machine, and they
# are wired into the GitLab jobs as before_script or as maintenance. Running
# them as a GitHub gate would fail merges over a full disk, which is an
# operations problem and not a property of anyone's branch.

[[guard]]
script = "desktop_env.sh"
reason = "runner"
issue = "#288"
why = """Sourced, not executed: it puts the per-user Rust toolchain on PATH and \
points CARGO_TARGET_DIR at the runner's warm cache. Both facts are about one \
machine. A GitHub runner sets its own toolchain up and has no warm cache to \
find, so there is nothing here for a hosted job to assert."""

[[guard]]
script = "runner_disk_guard.sh"
reason = "runner"
issue = "#288"
why = """Runs as before_script in six GitLab jobs and refuses to start a build \
that cannot finish. It reports on that machine's root filesystem and its \
storage mount. GitHub has its own answer to the same question in \
disk_headroom.py, which runs in orchestration-guard on every pull request."""

[[guard]]
script = "runner_cleanup_report.sh"
reason = "runner"
issue = "#288"
why = """Reports what is consuming disk on the build machine. Maintenance, not a \
verdict on a change: it is allow_failure on the mirror for exactly that reason, \
and a job that may fail is not a gate wherever it is declared."""

[[guard]]
script = "runner_cleanup_safe.sh"
reason = "runner"
issue = "#288"
why = """Deletes caches and stale build directories on the build machine. It \
touches paths that only exist there, and the protected list it honours \
(corpus, golden, reference, storage box) names that machine's mounts. There is \
nothing to run and nothing to protect on a hosted runner."""

# --- covered-elsewhere -----------------------------------------------------
# The check exists on GitHub; the GitLab wrapper script does not. Moving the
# script would add a second way to ask a question already being asked before a
# merge.

# run_build.sh, run_clippy.sh and run_test.sh stood here until 06-09-2026, each
# excused as "covered-elsewhere" because ci-ephemeral.yml ran the same three
# cargo lines. That workflow's Hetzner provider was cancelled on 24-08 and the
# workflow was disabled by hand; its last run of any kind was 02-09, and every
# one of the last forty was cancelled. So the place these three were covered had
# stopped existing, and the register went on saying they were covered -- which is
# the exact shape #231 found on the mirror gate.
#
# ci.yml's `workspace` job then ran these three scripts themselves on every push
# to master (#343). That job is gone since 06-09-2026 (#350) and the workspace
# build is back in ci-ephemeral.yml, which is not disabled and whose provider
# was never gone -- measured over all 318 runs of that workflow, 104 succeeded,
# the last on 01-09, a week after the VPS cancellation. What killed it was
# cancel-in-progress against forty to ninety landings a day, and it runs on a
# two-hourly schedule now.
#
# They are still not mirror-only, and their rows stay out: they run on GitHub,
# in a wave rather than on the push, and they are booked as such in
# docs/GATES_REACHABLE_FROM_A_PULL_REQUEST.toml -- which is the register that
# asks the question this one does not, namely whether the boundary reaches them.

[[guard]]
script = "run_audit.sh"
reason = "covered-elsewhere"
issue = "#287"
why = """A one-line wrapper around `cargo audit`. security-audit.yml runs the \
advisory scan on every pull request. That workflow is the one from #287: it \
existed and used a Docker action on a runner without docker, so the port is \
only worth anything now that it runs the binary directly."""

[[guard]]
script = "tests_actually_ran.py"
reason = "covered-elsewhere"
issue = "#636"
why = """Wraps a binding's test command and refuses to call zero tests a success. \
Its callers are capi-ephemeral.yml and ci-ephemeral.yml's `clitest` job, both \
firing on workflow_dispatch alone, so nothing it finds reaches a pull request. \
The CLI half still runs on every landing in the local gate's landing lane \
(`crate_gate clitest`), which is the blocking verdict; the part that can go \
wrong on its own, the parsers, is held before a merge by \
test_tests_actually_ran.py in ci.yml."""

[[guard]]
script = "classify_render_outcome.sh"
reason = "covered-elsewhere"
issue = "#276"
why = """Not a guard: a shell function crash-guard.yml sources to decide whether \
one render was ok, a crash, or a hang. Its only caller is crash-guard.yml, which \
is dispatch-only and gated behind a `parked` job, because no runner carries the \
`xfa-corpus` label.

It was moved out of the workflow precisely so something could run it. \
test_classify_render_outcome.py drives the real function over twelve outcomes \
and stands before every merge in ci.yml, and it also checks that crash-guard.yml \
still calls it and still keeps the exit code -- so this file cannot drift away \
from its caller without turning that suite red. Un-parks with the corpus \
workflows the day the runner exists."""

# --- credentials -----------------------------------------------------------

[[guard]]
script = "mr_staleness.py"
reason = "credentials"
issue = "#288"
why = """Reads GitLab merge requests over the GitLab API and needs a token for \
that project. GitHub is where merges happen now, and pr_staleness.py asks the \
same question there -- it runs in orchestration-guard with the workflow token \
and fails on a pull request left to rot. Keeping this one on the mirror keeps \
the GitLab side honest for as long as branches still land there."""

# --- covered-elsewhere: the wave, since 06-09-2026 (#350) -------------------
# Four suites and the workspace build left the desktop on 06-09-2026: they run
# in a two-hourly wave of ci-ephemeral.yml, on a Hetzner instance bought per
# wave and thrown away, because the one self-hosted runner had twenty-nine runs
# queued on four cores with the oldest master commit under test two hours old.
#
# `every_guard_has_a_job.py` counts that wave as a job -- a schedule firing at
# least twelve times a day reaches master's head within one interval without
# anybody typing anything. The five rows below are what the wave does NOT reach,
# and they are here rather than fixed because each one is about the desktop's
# own state or about a shape the wave deliberately does not use.

[[guard]]
script = "run_build.sh"
reason = "covered-elsewhere"
issue = "#350"
why = """`cargo check` over the workspace, with the flags in one place so the \
landing lane and the full lane cannot drift apart. The wave in ci-ephemeral.yml \
runs the cargo lines directly rather than through this wrapper -- its own \
excludes differ, and rewriting them to match is a change to what master \
compiles, not a change to where it compiles. So on GitHub this script stands in \
the pre-push and landing lanes, and on GitLab it has a job. What that costs is \
named rather than hidden: the flags now live in two shapes, and only the mirror \
runs this one."""

[[guard]]
script = "run_clippy.sh"
reason = "covered-elsewhere"
issue = "#350"
why = """The same wrapper one lint further, and the same reason: the wave runs \
`cargo clippy --workspace --exclude pdf-desktop -- -D warnings` itself. See \
run_build.sh."""

[[guard]]
script = "run_excluded_dependents.sh"
reason = "covered-elsewhere"
issue = "#623"
why = """The native check and tests of the crates the workspace build excludes (xfa-wasm). It compiles, so it stands where run_test.sh stands: the landing lane runs it for the crates a change reaches, and the scheduled and tag pipeline runs it for all of them."""

[[guard]]
script = "run_test.sh"
reason = "covered-elsewhere"
issue = "#350"
why = """The same wrapper, and the most expensive of the three: the wave runs \
`cargo test --workspace --exclude pdf-desktop --no-fail-fast` itself, on a \
machine bought for it. See run_build.sh."""

[[guard]]
script = "cargo_target_health.sh"
reason = "runner"
issue = "#350"
why = """Answers whether the PERSISTENT build directory is there and undamaged \
-- gone, dead or unwritable -- before a build spends forty minutes finding out. \
It is about one machine's disk, and after #350 no job that compiles on that \
machine is reachable from a push: the compiling jobs are on throwaway instances \
whose build directory did not exist ten minutes ago. What still calls it are the \
dispatch-only workflows that do use the desktop, and the mirror. Its own test, \
test_cargo_target_health.sh, runs in ci.yml on every push and holds the \
behaviour."""

[[guard]]
script = "shared_build_dir_is_there.sh"
reason = "runner"
issue = "#350"
why = """The other half of the same question and the same machine: which of \
gone, dead or unwritable the shared build directory is. Same reason it is not \
on a push after #350 -- there is no longer a compiling job on that machine for \
it to run in front of -- and the same mirror job keeps it exercised."""

[[guard]]
script = "a_gate_image_answers_ssh.py"
reason = "credentials"
issue = "#482"
why = """It buys instances from a candidate image and asks each of them the question a gate asks -- a non-interactive command over ssh -- so it needs the Hetzner token and it spends money every time it runs. Neither belongs on a pull request. It is named in the step that runs it, the last job of gate-snapshot-refresh.yml, which is the nightly schedule and a dispatch; the branch it publishes from is pinned to the default branch. What it protects against is an image nobody booted: the one published on 09-09-2026 was available and refused every command, which cost four gate runs a local compile before anybody looked."""

[[guard]]
script = "refresh_the_gate_snapshot.py"
reason = "covered-elsewhere"
issue = "#474"
why = """The last job of gate-snapshot-refresh.yml, which is a nightly schedule and a dispatch by design: what it does is buy a machine, image it and delete it, and a job that spends money on every pull request is not a guard, it is a bill. Pinning it to the default branch is also what keeps unmerged code off the desktop, the rule orchestration_stays_hosted.py enforces. Its behaviour is held by test_refresh_the_gate_snapshot.py, which runs in ci.yml on every push and in the fast lane of the local gate: the two failures that matter -- keeping the instance, and publishing an image of a half-built target directory -- are properties of the code, and both are driven there against a recorder rather than against Hetzner."""

