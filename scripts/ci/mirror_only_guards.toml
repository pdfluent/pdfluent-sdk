# --- covered-elsewhere: the compiling binding suites (#636) ------------------
# Each suite builds its binding from the tree and runs it for real: maturin
# develop, a napi build, cargo builds of the cdylibs, mvn, dotnet. Minutes on
# a cold target dir, not the seconds of file scanning a push job promises.
#
# Until m722 they stood in ci.yml's binding-suites job, compiling the engine
# on the persistent desktop on every push to master -- the heavy work
# heavy_work_leaves_the_desktop.py, orchestration_stays_hosted.py and
# persistent_builds_check_their_build_dir.py all refuse there (#267, #350).
# They moved to the `binding-suites` job of binding-suites.yml: dispatch-only,
# on ubuntu-latest, where a dispatch is a decision and may cost. A push job
# cannot carry them back: on the desktop the three guards above refuse any
# compile, and on hosted runners minutes on a push are refused while the
# repository is private (#333). The same scripts ride the landing lane beside
# the workflow (officext, xtractpy, xtractjs, balbind, r4py, r4node, r4java,
# r4dotnet and r4capi in scripts/ci/local_ci_gate.sh), which is the blocking
# verdict on every landing.

[[guard]]
script = "run_office_tests.sh"
reason = "covered-elsewhere"
issue = "#636"
why = """Its only workflow caller is the `binding-suites` job of binding-suites.yml, \
which fires on workflow_dispatch alone (m722): it builds the pdf-python \
extension from the tree (maturin develop) and runs the extract_office suite \
against it. A push job cannot carry a debug engine build -- the desktop \
refuses any compile on a push and hosted minutes on a push are refused -- so \
the same script runs on every landing in the local gate's landing lane \
(`officext`), which is the blocking verdict."""

