# ---------------------------------------------------------------------------
# Bans — duplicate crate versions and forbidden crates
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = []

# ---------------------------------------------------------------------------
# Sources — registry and git source allow-listing
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
