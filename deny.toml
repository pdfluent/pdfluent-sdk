# cargo-deny configuration — PDFluent workspace license enforcement
# Policy: MIT / Apache-2.0 / BSD-2/3-Clause / Zlib / ISC / Unicode-DFS-2016
# GPL / AGPL / LGPL-strong are RELEASE BLOCKERS (absent from allow list → rejected).
# Run: cargo deny check licenses bans sources

[graph]
targets = []
all-features = false

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# Advisories — security vulnerability tracking
# ---------------------------------------------------------------------------
[advisories]
# THE SAME LIST AS `.cargo/audit.toml`, and that is checked rather than trusted.
#
# cargo-audit and cargo-deny read different files, so one decision has to be
# written twice -- and on 02-09-2026 it was written once: audit.toml accepted
# five advisories and this list was empty, so `cargo-deny check advisories`
# failed on exactly the advisories cargo-audit had been told to accept. The job
# had been red since 28-08 and the recorded reason was a toolchain error, which
# was masking this one.
#
# Two registers of one decision drift apart; that is not a risk, it is what
# happened. scripts/ci/the_advisory_lists_agree.py compares them, so the next
# person to accept an advisory in one file is told about the other.
#
# Every entry says which crate, which path into the tree, and why the risk is
# accepted rather than fixed. An id without that is not an acceptance; it is a
# suppression, and the next reader cannot tell the two apart.
ignore = [
    # ------------------------------------------------------------------ FIXED
    # Not listed, because they are gone from the tree rather than accepted:
    #   RUSTSEC-2026-0190 (anyhow, unsound `Error::downcast_mut`)  -> 1.0.104
    #   RUSTSEC-2026-0204 (crossbeam-epoch, invalid pointer deref) -> 0.9.21
    #   RUSTSEC-2026-0187 (lopdf 0.34, stack overflow on nested arrays)
    #       -> the dependency was declared by xfa-pdfrest-compare and used by
    #          nothing in it; removed rather than bumped.
    #   RUSTSEC-2026-0049/0098/0099/0104 (rustls-webpki) were accepted here
    #       until 08-09-2026; the tree now carries a patched version, so the
    #       four entries described nothing and cargo-deny said so
    #       ("advisory was not encountered"). An ignore that matches no crate
    #       is not a decision on the record, it is a decision nobody can check.
    #
    # ----------------------------------------------------- ACCEPTED, WITH WHY
    # rsa 0.9.x -- Marvin Attack timing side-channel (RUSTSEC-2023-0071).
    # Transitively via pdf-sign -> cms -> rsa. No upstream patch; our signing is
    # offline, so the timing channel is not network-observable.
    "RUSTSEC-2023-0071",

    # quick-xml -- two denial-of-service advisories against the READER:
    # quadratic time on duplicate attribute names (RUSTSEC-2026-0194) and
    # unbounded namespace-declaration allocation in `NsReader`
    # (RUSTSEC-2026-0195). Fixed in >= 0.41.0, which is two semver-breaking
    # releases away from the 0.37 our crates pin.
    #
    # Measured before accepting, because "we only write XML" is the kind of
    # claim that is true until it is not: the workspace holds eight
    # `quick_xml::Reader` call sites and every one of them is inside a
    # `#[cfg(test)]` module reading back a document the test just wrote
    # (pdf-docx, pdf-xlsx, pdf-pptx). pdf-invoice uses `Writer` only. No
    # shipped code path hands attacker-controlled XML to quick-xml's reader.
    # The second copy, 0.39.4, arrives under tauri -> plist and parses the
    # desktop app's own Info.plist at build time.
    #
    # The migration to 0.41 is a code change with its own tests, not a lockfile
    # bump, so it is not being done inside a CI repair. (#448)
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",

    # ttf-parser 0.25 -- unmaintained (RUSTSEC-2026-0192). A direct dependency
    # of pdf-compliance, and the only one of these that is ours to choose. The
    # successor is skrifa, which this workspace already builds against
    # elsewhere, so the replacement is a real piece of work with real tests
    # rather than a version bump.
    "RUSTSEC-2026-0192",

    # fxhash 0.2.1 -- unmaintained (RUSTSEC-2025-0057). Via
    # selectors -> scraper -> pdfluent-snippet-extract, the tool that reads
    # code samples out of the website. A hasher, in a build-time tool.
    "RUSTSEC-2025-0057",

    # number_prefix 0.4.0 -- unmaintained (RUSTSEC-2025-0119). Via
    # indicatif -> xfa-test-runner: it formats "1.2 MB" in a progress bar.
    "RUSTSEC-2025-0119",

    # paste 1.0.15 -- unmaintained, archived by its author (RUSTSEC-2024-0436).
    # Via rav1e -> ravif -> image. A proc-macro that pastes identifiers; it does
    # not run in the built product at all.
    "RUSTSEC-2024-0436",

    # proc-macro-error 1.0.4 -- unmaintained (RUSTSEC-2024-0370). Via
    # glib-macros -> glib -> the gtk3 stack below. Also build-time only.
    "RUSTSEC-2024-0370",

    # unic-* 0.9.0 -- five unmaintained crates, one family
    # (RUSTSEC-2025-0075/0080/0081/0098/0100). Via
    # urlpattern -> tauri-utils -> tauri. Unicode character tables.
    "RUSTSEC-2025-0075",
    "RUSTSEC-2025-0080",
    "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0098",
    "RUSTSEC-2025-0100",

    # The gtk3-rs bindings -- ten crates, one deprecation
    # (RUSTSEC-2024-0411 through 0420). atk, gdk, gdkwayland, gdkx11, gtk and
    # their -sys and -macros siblings, all under tauri -> pdf-desktop, which is
    # the only crate in this workspace that draws a window. gtk4-rs is the
    # maintained successor and tauri 2 does not use it; the version of this
    # decision that matters is tauri's, not ours. `pdf-desktop` is excluded
    # from every build in CI (`--exclude pdf-desktop`), so none of this reaches
    # the SDK or the CLI.
    "RUSTSEC-2024-0411",
    "RUSTSEC-2024-0412",
    "RUSTSEC-2024-0413",
    "RUSTSEC-2024-0414",
    "RUSTSEC-2024-0415",
    "RUSTSEC-2024-0416",
    "RUSTSEC-2024-0417",
    "RUSTSEC-2024-0418",
    "RUSTSEC-2024-0419",
    "RUSTSEC-2024-0420",
]

# ---------------------------------------------------------------------------
# Licenses
# ---------------------------------------------------------------------------
[licenses]
# Confidence threshold for SPDX expression matching against license file text.
confidence-threshold = 0.8

# All third-party licenses must be in this list.
# Any license NOT listed here is rejected (implicit deny).
# GPL / AGPL / LGPL are absent → they are BLOCKED.
allow = [
    # Core policy tier:
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",

    # PDFluent proprietary crates (each manifest declares the SPDX expression itself).
    # These are our own workspace crates, not third-party dependencies.
    "LicenseRef-PDFluent-Commercial",
    # After LC9 (#221) our own crates declare AGPL-3.0-only and offer a
    # commercial licence beside it. This ref is how the policy names that pair.
    # It is deliberately NOT a bare AGPL expression: neither "AGPL-3.0-only"
    # nor "AGPL-3.0-or-later" may appear here, because either must stay absent from
    # this list, because a third-party AGPL DEPENDENCY would reach the whole
    # product, and the allow-list is about the graph rather than about what we
    # ourselves publish.
    "LicenseRef-PDFluent-Dual",

    # Additional permissive licenses present in the resolved dependency tree
    # (confirmed via `cargo license --avoid-build-deps --avoid-dev-deps`).
    # None impose copyleft obligations on the whole project.
    "BSL-1.0",          # ryu — Boost License, fully permissive
    "0BSD",             # adler2 — zero-clause BSD, public-domain style
    "MIT-0",            # dunce — MIT without attribution clause
    "CC0-1.0",          # imgref, dunce — Creative Commons Zero (public domain)
    "NCSA",             # libfuzzer-sys — Univ. of Illinois/NCSA (= 3-clause BSD style)
    "Unlicense",        # aho-corasick, byteorder, memchr, walkdir, winapi-util
    "BSD-1-Clause",     # fiat-crypto — OR expression alternative

    # MPL-2.0: file-level weak copyleft only (NOT project-level copyleft).
    # Present via Servo HTML-parsing stack: cssparser, selectors, dtoa-short,
    # option-ext, cssparser-macros.  Modifications to those files must be
    # shared under MPL; surrounding PDFluent engine code is unaffected.
    "MPL-2.0",

    # CDLA-Permissive-2.0: Community Data License Agreement Permissive 2.0.
    # Present via webpki-roots (Mozilla CA certificate bundle, pulled in by
    # reqwest's rustls-tls feature). It is a data license, fully permissive
    # — no copyleft obligation on the consuming project — and is the
    # license Mozilla uses for the public NSS root cert bundle. CDLA-2.0
    # explicitly states: "The Data Recipient is free to use, modify, and
    # distribute the Data" (§2). Equivalent permissivity to MIT/Apache-2.0
    # for data assets. Not on the SPDX-approved deny.toml default list
    # because it's a data-license, not a source-code license.
    "CDLA-Permissive-2.0",

    # OFL-1.1 is intentionally NOT in this global list.
    # Permitted only for the bundled Liberation font asset crate
    # (xfa/font-bundled-liberation, not merged at rc1).  Add a per-crate
    # exception when that branch merges; do NOT add OFL-1.1 here globally.
]

# Per-crate exceptions for OR-compound expressions that contain a non-allowed
# license where we exercise only the permitted branch.
# NOTE: must be before [licenses.private] due to TOML section scoping.
exceptions = [
    # r-efi: "Apache-2.0 OR LGPL-2.1-or-later OR MIT"
    # We select the Apache-2.0/MIT branch.  The LGPL variant is an alternative
    # we never exercise.
    { allow = ["LGPL-2.1-or-later"], crate = "r-efi" },
]

# Ignore workspace crates that declare publish = false (our own internal tools).
[licenses.private]
ignore = true
