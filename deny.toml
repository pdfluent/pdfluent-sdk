# cargo-deny configuration — PDFluent workspace license enforcement
# Policy: MIT / Apache-2.0 / BSD-2/3-Clause / Zlib / ISC / Unicode-DFS-2016
# GPL / AGPL / LGPL-strong are RELEASE BLOCKERS (absent from allow list → rejected).
# Run: cargo deny check licenses bans sources

[graph]
targets = []
all-features = false

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# Advisories — security vulnerability tracking
# ---------------------------------------------------------------------------
[advisories]
# THE SAME FIVE AS `.cargo/audit.toml`, and that is checked rather than trusted.
#
# cargo-audit and cargo-deny read different files, so one decision has to be
# written twice -- and on 02-09-2026 it was written once: audit.toml accepted
# these five and this list was empty, so `cargo-deny check advisories` failed
# on exactly the advisories cargo-audit had been told to accept. The job had
# been red since 28-08 and the recorded reason was a toolchain error, which was
# masking this one.
#
# Two registers of one decision drift apart; that is not a risk, it is what
# happened. scripts/ci/the_advisory_lists_agree.py compares them, so the next
# person to accept an advisory in one file is told about the other.
ignore = [
    # rsa 0.9.x -- Marvin Attack timing side-channel (RUSTSEC-2023-0071).
    # Transitively via pdf-sign -> cms -> rsa. No upstream patch; our signing is
    # offline, so the timing channel is not network-observable.
    "RUSTSEC-2023-0071",
    # rustls-webpki 0.103.x -- four certificate-validation advisories. Via
    # pdf-sign -> rustls for timestamp/OCSP. Patched in >= 0.103.10; accepted
    # until the dependency tree is updated.
    "RUSTSEC-2026-0104",
    "RUSTSEC-2026-0049",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
]

# ---------------------------------------------------------------------------
# Licenses
# ---------------------------------------------------------------------------
[licenses]
# Confidence threshold for SPDX expression matching against license file text.
confidence-threshold = 0.8

# All third-party licenses must be in this list.
# Any license NOT listed here is rejected (implicit deny).
# GPL / AGPL / LGPL are absent → they are BLOCKED.
allow = [
    # Core policy tier:
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",

    # PDFluent proprietary crates (each manifest declares the SPDX expression itself).
    # These are our own workspace crates, not third-party dependencies.
    "LicenseRef-PDFluent-Commercial",
    # After LC9 (#221) our own crates declare AGPL-3.0-only and offer a
    # commercial licence beside it. This ref is how the policy names that pair.
    # It is deliberately NOT a bare AGPL expression: neither "AGPL-3.0-only"
    # nor "AGPL-3.0-or-later" may appear here, because either must stay absent from
    # this list, because a third-party AGPL DEPENDENCY would reach the whole
    # product, and the allow-list is about the graph rather than about what we
    # ourselves publish.
    "LicenseRef-PDFluent-Dual",

    # Additional permissive licenses present in the resolved dependency tree
    # (confirmed via `cargo license --avoid-build-deps --avoid-dev-deps`).
    # None impose copyleft obligations on the whole project.
    "BSL-1.0",          # ryu — Boost License, fully permissive
    "0BSD",             # adler2 — zero-clause BSD, public-domain style
    "MIT-0",            # dunce — MIT without attribution clause
    "CC0-1.0",          # imgref, dunce — Creative Commons Zero (public domain)
    "NCSA",             # libfuzzer-sys — Univ. of Illinois/NCSA (= 3-clause BSD style)
    "Unlicense",        # aho-corasick, byteorder, memchr, walkdir, winapi-util
    "BSD-1-Clause",     # fiat-crypto — OR expression alternative

    # MPL-2.0: file-level weak copyleft only (NOT project-level copyleft).
    # Present via Servo HTML-parsing stack: cssparser, selectors, dtoa-short,
    # option-ext, cssparser-macros.  Modifications to those files must be
    # shared under MPL; surrounding PDFluent engine code is unaffected.
    "MPL-2.0",

    # CDLA-Permissive-2.0: Community Data License Agreement Permissive 2.0.
    # Present via webpki-roots (Mozilla CA certificate bundle, pulled in by
    # reqwest's rustls-tls feature). It is a data license, fully permissive
    # — no copyleft obligation on the consuming project — and is the
    # license Mozilla uses for the public NSS root cert bundle. CDLA-2.0
    # explicitly states: "The Data Recipient is free to use, modify, and
    # distribute the Data" (§2). Equivalent permissivity to MIT/Apache-2.0
    # for data assets. Not on the SPDX-approved deny.toml default list
    # because it's a data-license, not a source-code license.
    "CDLA-Permissive-2.0",

    # OFL-1.1 is intentionally NOT in this global list.
    # Permitted only for the bundled Liberation font asset crate
    # (xfa/font-bundled-liberation, not merged at rc1).  Add a per-crate
    # exception when that branch merges; do NOT add OFL-1.1 here globally.
]

# Per-crate exceptions for OR-compound expressions that contain a non-allowed
# license where we exercise only the permitted branch.
# NOTE: must be before [licenses.private] due to TOML section scoping.
exceptions = [
    # r-efi: "Apache-2.0 OR LGPL-2.1-or-later OR MIT"
    # We select the Apache-2.0/MIT branch.  The LGPL variant is an alternative
    # we never exercise.
    { allow = ["LGPL-2.1-or-later"], crate = "r-efi" },
]

# Ignore workspace crates that declare publish = false (our own internal tools).
[licenses.private]
ignore = true
