[workspace]
members = [
    # --- Forked from hayro (MIT + Apache-2.0) ---
    "crates/pdf-syntax",
    "crates/pdf-interpret",
    "crates/pdf-font",
    "crates/pdf-render",
    "crates/hayro-jbig2",
    "crates/hayro-jpeg2000",
    "crates/hayro-ccitt",

    # --- New engine crates ---
    "crates/pdf-engine",
    "crates/pdf-forms",
    "crates/pdf-annot",
    "crates/pdf-sign",
    "crates/pdf-compliance",
    "crates/pdf-capi",

    # --- XFA engine (existing, wrapped) ---
    "crates/pdf-xfa",
    "crates/xfa-dom-resolver",
    "crates/formcalc-interpreter",
    "crates/xfa-layout-engine",
    "crates/xfa-json",

    # --- Bindings & tools ---
    # pdf-python: excluded — PyO3 requires matching Python. Build via maturin.
    "crates/pdf-node",
    "crates/pdf-java",
    "crates/xfa-wasm",
    "crates/xfa-cli",

    # --- Existing support crates ---
    "crates/xfa-api-server",
    "crates/xfa-license",
    "crates/xfa-license-gen",

    # --- PDF manipulation ---
    "crates/pdf-manip",

    # --- Desktop application (Fase 4) ---
    "crates/pdf-desktop",

    # --- Content intelligence (Fase N) ---
    "crates/pdf-extract",
    "crates/pdf-redact",
    "crates/pdf-ocr",

    # --- Conversions (Fase 3) ---
    "crates/pdf-docx",
    "crates/pdf-xlsx",
    "crates/pdf-pptx",

    # --- Data exchange + EU compliance (Fase O) ---
    "crates/pdf-invoice",

    # --- Visual comparison ---
    "crates/pdf-diff",

    # --- Test infrastructure ---
    "crates/xfa-test-runner",
    "crates/xfa-pdfrest-compare",

    # --- Benchmarks ---
    "crates/pdf-bench",

    # --- Forked dependencies ---
    "crates/lopdf",
    "crates/cff-parser",
]
resolver = "2"

[workspace.package]
version = "1.0.0-beta.1"
edition = "2021"
rust-version = "1.80.0"
license = "MIT"
repository = "https://github.com/jasperdew/xfa-native-rust"

[workspace.dependencies]
roxmltree = "0.20"
lopdf = { path = "crates/lopdf", version = "=0.39.0" }
thiserror = "2"
image = "0.25"
pixelmatch = "0.1"
anyhow = "1"
reqwest = { version = "0.12", features = ["blocking"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
ttf-parser = "0.25"
cff-parser = { path = "crates/cff-parser", version = "0.2" }
subsetter = "0.2"
xmp-writer = "0.3"

# Internal crates (existing XFA)
xfa-dom-resolver = { path = "crates/xfa-dom-resolver", version = "=1.0.0-beta.1" }
formcalc-interpreter = { path = "crates/formcalc-interpreter", version = "=1.0.0-beta.1" }
xfa-layout-engine = { path = "crates/xfa-layout-engine", version = "=1.0.0-beta.1" }
xfa-json = { path = "crates/xfa-json", version = "=1.0.0-beta.1" }
xfa-license = { path = "crates/xfa-license", version = "=1.0.0-beta.1" }

# Forked crates
pdf-syntax = { path = "crates/pdf-syntax", version = "=0.5.0" }
pdf-interpret = { path = "crates/pdf-interpret", version = "=0.5.0" }
pdf-font = { path = "crates/pdf-font", version = "=1.0.0-beta.1" }
pdf-render = { path = "crates/pdf-render", version = "=1.0.0-beta.1" }

# New engine crates
pdf-forms = { path = "crates/pdf-forms", version = "=1.0.0-beta.1" }
pdf-annot = { path = "crates/pdf-annot", version = "=1.0.0-beta.1" }
pdf-xfa = { path = "crates/pdf-xfa", version = "=1.0.0-beta.1" }
pdf-sign = { path = "crates/pdf-sign", version = "=1.0.0-beta.1" }
pdf-engine = { path = "crates/pdf-engine", version = "=1.0.0-beta.1" }
pdf-compliance = { path = "crates/pdf-compliance", version = "=1.0.0-beta.1" }
pdf-manip = { path = "crates/pdf-manip", version = "=1.0.0-beta.1" }
pdf-invoice = { path = "crates/pdf-invoice", version = "=1.0.0-beta.1" }
pdf-extract = { path = "crates/pdf-extract", version = "=1.0.0-beta.1" }
pdf-redact = { path = "crates/pdf-redact", version = "=1.0.0-beta.1" }
pdf-ocr = { path = "crates/pdf-ocr", version = "=1.0.0-beta.1" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
opt-level = "z"

[profile.release-speed]
inherits = "release"
opt-level = 3
strip = "symbols"
