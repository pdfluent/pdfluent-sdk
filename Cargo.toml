[workspace]
members = [
    # --- Forked from hayro (MIT + Apache-2.0) ---
    "crates/pdf-syntax",
    "crates/pdf-interpret",
    "crates/pdf-font",
    "crates/pdf-render",
    "crates/hayro-jbig2",
    "crates/hayro-jpeg2000",
    "crates/hayro-ccitt",

    # --- New engine crates ---
    "crates/pdf-engine",
    "crates/pdf-forms",
    "crates/pdf-annot",
    "crates/pdf-sign",
    "crates/pdf-compliance",
    "crates/pdf-capi",

    # --- XFA engine (existing, wrapped) ---
    "crates/pdf-xfa",
    "crates/xfa-dom-resolver",
    "crates/formcalc-interpreter",
    "crates/xfa-layout-engine",
    "crates/xfa-json",

    # --- Bindings & tools ---
    # pdf-python: excluded — PyO3 requires matching Python. Build via maturin.
    "crates/pdf-node",
    "crates/pdf-java",
    "crates/xfa-wasm",
    "crates/xfa-cli",

    # --- Existing support crates ---
    "crates/xfa-api-server",
    "crates/xfa-license",
    "crates/xfa-license-gen",

    # --- PDF manipulation ---
    "crates/pdf-manip",

    # --- Desktop application (Fase 4) ---
    "crates/pdf-desktop",

    # --- Content intelligence (Fase N) ---
    "crates/pdf-extract",
    "crates/pdf-redact",
    "crates/pdf-ocr",

    # --- Conversions (Fase 3) ---
    "crates/pdf-docx",
    "crates/pdf-xlsx",
    "crates/pdf-pptx",

    # --- Data exchange + EU compliance (Fase O) ---
    "crates/pdf-invoice",

    # --- Visual comparison ---
    "crates/pdf-diff",

    # --- Test infrastructure ---
    "crates/xfa-test-runner",
    "crates/xfa-pdfrest-compare",

    # --- Benchmarks ---
    "crates/pdf-bench",

    # --- Forked dependencies ---
    "crates/lopdf",
    "crates/cff-parser",
    "crates/pdfluent",

    # --- Documentation drift-guard tooling (Epic 5 / Slag 2) ---
    "tools/pdfluent-snippet-extract",
]
resolver = "2"

[workspace.package]
version = "1.0.0-beta.3"
edition = "2021"
rust-version = "1.80.0"
# Workspace default license = MIT. Used by INTERNAL crates only (CLI tools,
# test runners, bindings, golden tests, etc.) that are NOT published to
# crates.io. PUBLISHED PDFluent crates override this with either:
#   - `license-file = "LICENSE"`           (proprietary, the SDK itself)
#   - `license = "MIT OR Apache-2.0"`      (forked from upstream open-source)
#   - `license = "MIT"`                    (forked from upstream MIT)
# See NOTICE in repository root for the per-crate license matrix.
license = "MIT"
repository = "https://github.com/pdfluent"
homepage = "https://pdfluent.com"
documentation = "https://pdfluent.com/docs"

[workspace.dependencies]
roxmltree = "0.20"
lopdf = { package = "pdfluent-lopdf", path = "crates/lopdf", version = "=0.39.1" }
thiserror = "2"
image = "0.25"
pixelmatch = "0.1"
anyhow = "1"
reqwest = { version = "0.12", features = ["blocking"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
ttf-parser = "0.25"
cff-parser = { package = "pdfluent-cff", path = "crates/cff-parser", version = "=0.2.0" }
subsetter = "0.2"
xmp-writer = "0.3"

# XFA proprietary crates (PDFluent Commercial License)
xfa-dom-resolver = { path = "crates/xfa-dom-resolver", version = "=1.0.0-beta.3" }
formcalc-interpreter = { path = "crates/formcalc-interpreter", version = "=1.0.0-beta.3" }
xfa-layout-engine = { path = "crates/xfa-layout-engine", version = "=1.0.0-beta.3" }
xfa-json = { path = "crates/xfa-json", version = "=1.0.0-beta.3" }
xfa-license = { path = "crates/xfa-license", version = "=1.0.0-beta.3" }

# Forked crates from hayro (open-source: MIT OR Apache-2.0)
pdf-syntax = { path = "crates/pdf-syntax", version = "=0.5.0" }
pdf-interpret = { path = "crates/pdf-interpret", version = "=0.5.1" }

# Forked crates from hayro (substantially extended; PDFluent Commercial License)
pdf-font = { path = "crates/pdf-font", version = "=1.0.0-beta.3" }
pdf-render = { path = "crates/pdf-render", version = "=1.0.0-beta.3" }

# Engine + feature crates (PDFluent Commercial License)
pdf-forms = { package = "pdfluent-forms", path = "crates/pdf-forms", version = "=1.0.0-beta.3" }
pdf-annot = { path = "crates/pdf-annot", version = "=1.0.0-beta.3" }
pdf-xfa = { path = "crates/pdf-xfa", version = "=1.0.0-beta.3" }
pdf-sign = { package = "pdfluent-sign", path = "crates/pdf-sign", version = "=1.0.0-beta.3" }
pdf-engine = { path = "crates/pdf-engine", version = "=1.0.0-beta.3" }
pdf-compliance = { path = "crates/pdf-compliance", version = "=1.0.0-beta.3" }
pdf-manip = { path = "crates/pdf-manip", version = "=1.0.0-beta.3" }
pdf-invoice = { path = "crates/pdf-invoice", version = "=1.0.0-beta.1" }
pdf-extract = { package = "pdfluent-extract", path = "crates/pdf-extract", version = "=1.0.0-beta.3" }
pdf-redact = { path = "crates/pdf-redact", version = "=1.0.0-beta.3" }
pdf-ocr = { path = "crates/pdf-ocr", version = "=1.0.0-beta.3" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
opt-level = "z"

[profile.release-speed]
inherits = "release"
opt-level = 3
strip = "symbols"
