[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/xfa-cli-{ target }-v{ version }.tar.gz"
bin-dir = "xfa-cli{ binary-ext }"

# Path-prefix remapping — strips developer filesystem paths from all build
# artefacts (WASM debug sections, rlib symbol tables, etc.).
#
# rustc uses last-match-wins semantics: when a path matches multiple prefix
# rules, the LAST matching rule in this list wins. Therefore:
#   - catch-all "/Users/jasperdewinter=/buildenv" is listed FIRST so it can
#     be overridden by the more-specific rules that follow;
#   - the most-specific rules (registry, git, source) are listed LAST so
#     they take precedence over the catch-all.
#
# Target "/buildenv" is intentionally not a real path and does not match
# the audit patterns for /Users/... or /home/... leakage.
#
# Required by the publish constitution: zero private-path strings in any
# published artefact.
#
# Release builds do not use this block: every artefact-producing step in the
# release workflows sources scripts/release/release_rustflags.sh (musl cdylibs
# via scripts/release/musl_cdylib_rustflags.sh), which computes the same
# mapping from the builder's own paths. This literal block is for local dev
# builds on the Mac only.
[build]
rustflags = [
  "--remap-path-prefix", "/Users/jasperdewinter=/buildenv",
  "--remap-path-prefix", "/Users/jasperdewinter/Documents/XFA=/src",
  "--remap-path-prefix", "/Users/jasperdewinter/.cargo/git=/git",
  "--remap-path-prefix", "/Users/jasperdewinter/.cargo/registry=/registry",
]

# WASM SIMD: vello_cpu's rasterizer (via fearless_simd) selects its 128-bit SIMD
# path on wasm32 ONLY when the target is compiled with `simd128` enabled — at
# compile time. Without it, fearless_simd's `Level::new()` returns the scalar
# fallback, so the browser/Node WASM SDK runs the rasterizer scalar. Enabling
# `simd128` activates the `WasmSimd128` path. `bulk-memory` is already on by
# default for wasm32 but is listed explicitly for clarity.
#
# IMPORTANT: cargo uses target-specific `rustflags` *instead of* `[build]`
# rustflags (they are NOT merged). The four `--remap-path-prefix` flags above
# MUST therefore be repeated here, or wasm32 artefacts would lose the private-
# path scrubbing required by the publish constitution.
#
# simd128 is supported by all current evergreen browsers (Chrome/Firefox/Safari)
# and Node >= 16. Byte/visual fidelity vs the scalar path must be confirmed by
# the WASM browser golden harness (QR-10) before this is relied on for a shipped
# artefact; see the follow-up task in the milestone report.
[target.wasm32-unknown-unknown]
rustflags = [
  "--remap-path-prefix", "/Users/jasperdewinter=/buildenv",
  "--remap-path-prefix", "/Users/jasperdewinter/Documents/XFA=/src",
  "--remap-path-prefix", "/Users/jasperdewinter/.cargo/git=/git",
  "--remap-path-prefix", "/Users/jasperdewinter/.cargo/registry=/registry",
  "-C", "target-feature=+simd128,+bulk-memory",
]

# Cross-compile linkers for the `package:cli-cross-platform` CI job. These
# linker names match the Ubuntu 24.04 mingw-w64 + musl-tools packages
# installed on the self-hosted runner (`pdfluent-vps-ci`); without them
# `cargo build --target x86_64-pc-windows-gnu` invokes plain `cc` /
# `ld.bfd`, which cannot produce PE32+ Windows binaries (fails on
# x86_64-w64-mingw32-dlltool lookup), and `--target x86_64-unknown-linux-musl`
# cannot link against musl-libc statically.
#
# Same `--remap-path-prefix` block as [build] for private-path scrubbing
# (target-specific rustflags REPLACE [build] rustflags, not merge).
#
# NO `-C target-feature=-crt-static` here, on either musl triple. rustc cannot
# produce a `cdylib` for musl under the default static CRT, so the musl
# `.so`/`.node` builds source `scripts/release/musl_cdylib_rustflags.sh`,
# which exports that flag together with the remap block (env RUSTFLAGS replace
# the config's flags outright, so the helper repeats them). Kept in the helper
# rather than here because this file cannot tell a cdylib from a binary: with
# the flag here the musl CLI came out dynamically linked, and the Docker image
# (Debian, no ld-musl) plus every "runs anywhere" user broke. Held by
# scripts/release/test_musl_crt_split.py.
[target.x86_64-unknown-linux-musl]
linker = "musl-gcc"
rustflags = [
  "--remap-path-prefix", "/Users/jasperdewinter=/buildenv",
  "--remap-path-prefix", "/Users/jasperdewinter/Documents/XFA=/src",
  "--remap-path-prefix", "/Users/jasperdewinter/.cargo/git=/git",
  "--remap-path-prefix", "/Users/jasperdewinter/.cargo/registry=/registry",
]

# aarch64 musl: same remap block (target flags replace, not merge), no CRT
# flag either — see above. No `linker` line: every aarch64 musl build goes
# through cargo-zigbuild/maturin --zig, which supplies zig cc; a plain cargo
# build would need an aarch64 musl-gcc the runners don't have.
[target.aarch64-unknown-linux-musl]
rustflags = [
  "--remap-path-prefix", "/Users/jasperdewinter=/buildenv",
  "--remap-path-prefix", "/Users/jasperdewinter/Documents/XFA=/src",
  "--remap-path-prefix", "/Users/jasperdewinter/.cargo/git=/git",
  "--remap-path-prefix", "/Users/jasperdewinter/.cargo/registry=/registry",
]

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
rustflags = [
  "--remap-path-prefix", "/Users/jasperdewinter=/buildenv",
  "--remap-path-prefix", "/Users/jasperdewinter/Documents/XFA=/src",
  "--remap-path-prefix", "/Users/jasperdewinter/.cargo/git=/git",
  "--remap-path-prefix", "/Users/jasperdewinter/.cargo/registry=/registry",
]
