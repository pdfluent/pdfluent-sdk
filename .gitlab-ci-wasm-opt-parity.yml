# GitLab CI lane for wasm-opt parity gate.
# Runs on the operator's self-hosted VPS runner with wasm-pack pre-installed.
# Manual trigger only — heavy gate, not for every push.

wasm-opt-parity:
  stage: quality_manual
  tags: [pdfluent-vps, pdfluent-wasm, pdfluent-rust]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - crates/xfa-wasm/**/*
        - scripts/bench/wasm-golden-compare.mjs
        - scripts/bench/wasm-bench.mjs
        - .gitlab-ci-wasm-opt-parity.yml
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_TAG'
      when: manual
  allow_failure: false
  timeout: 30m
  variables:
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: '1'
  # No before_script install chain — the VPS runner pre-installs:
  #   rustup + wasm32-unknown-unknown target, wasm-pack, nodejs 22.x, jq, python3.
  # See benchmarks/runs/ga_hardening_plan/ci/CI2_VPS_RUNNER_DESIGN.md §3.
  script:
    - |
      cp crates/xfa-wasm/Cargo.toml crates/xfa-wasm/Cargo.toml.bak
      python3 -c "
      import re, pathlib, tomllib, sys
      p = pathlib.Path('crates/xfa-wasm/Cargo.toml')
      t = p.read_text()
      # wasm-opt is a MULTI-LINE array since B3 enabled -O3 with validator
      # allowance flags. The old pattern (^wasm-opt = .*\$) replaced only the
      # opening 'wasm-opt = [' line and left the array elements orphaned, so
      # cargo saw '\"-O3\",' as a key with no value and every run of this job
      # died with 'error: key with no value, expected =' before building
      # anything. Match the whole array, or a plain scalar value.
      t2, n = re.subn(r'^wasm-opt\s*=\s*\[[^]]*\]', 'wasm-opt = false', t, count=1, flags=re.M)
      if n == 0:
          t2, n = re.subn(r'^wasm-opt\s*=.*\$', 'wasm-opt = false', t, count=1, flags=re.M)
      if n == 0:
          sys.exit('wasm-opt setting not found in Cargo.toml - parity job cannot build a reference')
      # Parse before writing. A malformed edit here fails several steps later
      # inside cargo, where the message says nothing about this substitution.
      tomllib.loads(t2)
      p.write_text(t2)
      "
    - wasm-pack build --release --target web --out-dir /tmp/ref/pkg
        crates/xfa-wasm -- --no-default-features --features wasm
    - mv crates/xfa-wasm/Cargo.toml.bak crates/xfa-wasm/Cargo.toml
    - wasm-pack build --release --target web --out-dir /tmp/cand/pkg
        crates/xfa-wasm -- --no-default-features --features wasm
    - node scripts/bench/wasm-golden-compare.mjs
        --ref /tmp/ref/pkg
        --cand /tmp/cand/pkg
        --fixtures benchmarks/fixtures/wasm_perf/manifest.json
        --out /tmp/golden.json
    - jq '{pass:.pass, fail:.fail, error:.error}' /tmp/golden.json
    - |
      REF=$(stat -c %s /tmp/ref/pkg/xfa_wasm_bg.wasm)
      CAND=$(stat -c %s /tmp/cand/pkg/xfa_wasm_bg.wasm)
      python3 -c "
      ref=$REF; cand=$CAND
      ratio=(cand/ref - 1)*100
      print(f'raw .wasm delta: {ratio:+.2f}%')
      assert ratio <= 5.0, f'raw .wasm regressed > 5%: {ratio:+.2f}%'
      "
  artifacts:
    when: always
    expire_in: 14d
    paths:
      - /tmp/golden.json
      - /tmp/ref/pkg/xfa_wasm_bg.wasm
      - /tmp/cand/pkg/xfa_wasm_bg.wasm
