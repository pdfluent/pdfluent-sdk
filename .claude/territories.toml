]
issues = [288, 286, 290, 276, 283, 264]

[[territory]]
id = "t3"
name = "Licensing and what may be published"
waarom = """
Licence texts, the claims register, and the guards that decide what can go public.
Shares scripts/ci/ with t2, so the filenames are carved out explicitly above --
these are the guards about publication, not about building."""
paden = [
  "LICENSE*",
  "NOTICE*",
  "THIRD_PARTY*",
  "docs/licen*",
  "docs/KWALITEITSSPOOR.md",
  "scripts/ci/*publicat*",
  "scripts/ci/contributors.toml",
  "scripts/ci/repos_staan_zoals_bedoeld.py",
  # Claimed 02-09-2026 on #310. The provenance register answers one question --
  # may this document leave the building -- which is this territory's question,
  # not a build concern. Same carve-out as the licence guards above.
  "scripts/ci/corpus_herkomst.py",
  # Claimed back 02-09-2026 on #295. The boundary guard decides which licence
  # every first-party manifest may carry -- this territory's question, and the
  # one the carve-out above ("the guards about publication") was written for.
  # It had fallen to t2's `scripts/ci/**` by not being named; #295 rewrites it
