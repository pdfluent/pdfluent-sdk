  "scripts/ci/license_boundary.py",
  "scripts/ci/test_license_boundary.py",
  # Claimed 02-09-2026 on #304. Three registers describe the licence of one
  # crate and nothing compared all three; this guard does, and it is a
  # publication question. Carved out of t2's scripts/ci/** like the others.
  "scripts/ci/one_licence_three_registers.py",
  "scripts/ci/test_one_licence_three_registers.py",
  # t1's claim for #308, taken over rather than duplicated: the overlap check
  # compares literal patterns, so the same path cannot sit in two lists. Held
