# Not a territory. #272 (the 1051-file branch) and #257/#258 (owner decisions)
# cut across all of them and stay with the coordinating terminal.

# The commands allowed to declare themselves a mechanical sweep.
#
# The guard re-runs them and requires an empty diff. This list exists so that a
# `Generated-by:` trailer is not a way to run arbitrary code from a commit
# message: the command has to be here first, and it is read from the BASE, not
# from the branch asking for permission.
[sweeps]
toegestaan = [
  "python3 scripts/ci/header_sweep.py --write",
]

# Registers the whole tree writes into.
#
# These files live in one territory and every territory has to add rows to them:
# a t1 branch that adds a fixture needs a provenance line, and that line is in a
# t3 file. Without an exemption the map forces a two-pull-request dance for every
# new document, and the order is unpleasant either way -- register first and the
# document guard refuses (a row naming a file that is not there), add first and
# the register guard refuses (a file with no row).
#
# So a branch may edit one of these from outside its territory when the same diff
# adds the file the new row names. That is checked, not promised: the added line
# carries a path, and the path has to be among the files the branch adds. The
# exemption therefore opens exactly the case it was opened for and nothing else.
#
# Read from the base, like [sweeps].toegestaan: a branch that could declare its
# own target shared would be granting itself permission.
[registers]
gedeeld = [
  "scripts/ci/corpus_herkomst.py",
  "docs/licensing/boundary.toml",
  "docs/PUBLIC_TREE.toml",
  "docs/FETCHED_ASSETS.toml",
]
