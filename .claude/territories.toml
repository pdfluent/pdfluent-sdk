# Who owns which paths, so several terminals can work at once without colliding.
#
# The unit of ownership is a PATH, not an issue. Two terminals can hold different
# issues and still edit the same file, which is how the collisions actually
# happen -- so allocating issues is not enough on its own.
#
# A branch declares its territory through its name: `t2/ci-guards-on-github` is
# in territory t2. scripts/ci/territories_do_not_overlap.py checks two things:
# that no two territories claim the same path, and that a branch has not edited
# outside the one it named.
#
# Overlaps are not forbidden by accident of writing; they are impossible by
# construction, because the guard refuses them.
#
# To take on work in another territory: change the file, in a commit, so it comes
# past review. Never edit outside your territory quietly.
#
# EXCEPTION, and only this one: a sweep generated by a guard. A change like the
# licence header touches every territory at once, and claiming eight hundred
# paths to make the map agree would say nothing about who owns what -- it would
# only be the map getting out of the way of itself.
#
# Such a sweep is allowed outside a territory on three conditions, all of which
# the reviewer can check without reading the files:
#
#   1. it is ONE commit, and nothing in it was typed by hand;
#   2. the commit names the command that produced it;
#   3. the reviewer re-runs that command and gets an empty diff.
#
# Condition 3 is the whole of it. It replaces reading eight hundred files with
# one command, and it is what makes the exception safe: a hand edit hidden among
# the generated ones shows up as a diff that does not reproduce. The owner
# decision is on #292; the first use is #301.
#
# It does NOT cover the guard itself. The tool that generates the sweep is a
# normal file with a normal owner, and it is the half that needs reading.

