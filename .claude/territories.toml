# Who owns which paths, so several terminals can work at once without colliding.
#
# The unit of ownership is a PATH, not an issue. Two terminals can hold different
# issues and still edit the same file, which is how the collisions actually
# happen -- so allocating issues is not enough on its own.
#
# A branch declares its territory through its name: `t2/ci-guards-on-github` is
# in territory t2. scripts/ci/territories_do_not_overlap.py checks two things:
# that no two territories claim the same path, and that a branch has not edited
# outside the one it named.
#
# Overlaps are not forbidden by accident of writing; they are impossible by
# construction, because the guard refuses them.
#
# To take on work in another territory: change the file, in a commit, so it comes
# past review. Never edit outside your territory quietly.

[[territory]]
id = "t1"
name = "Forks and the engine"
waarom = """
The forked crates and their upstream register. Kept separate because an upstream
merge rewrites whole files, and any other terminal touching them at the same time
turns a three-way merge into a four-way one."""
paden = [
  "crates/hayro-*/**",
  "crates/pdf-syntax/**",
  "crates/pdf-interpret/**",
  "crates/pdf-render/**",
  "crates/pdf-font/**",
  "crates/lopdf/**",
  "docs/UPSTREAM_FORKS.toml",
  "docs/FORKDIVERGENTIE.md",
  # Claimed 01-09-2026 for `embed_font` (#292). The owner decision was to turn
  # lopdf's `font_embedding` on and wire it through to `PdfDocument::embed_font`.
  # lopdf is t1, the two crates the wiring passes through are not, and splitting
  # the change across an ownership line would have meant landing a feature flag
  # here and the thing that uses it somewhere else -- with the SDK returning Ok
  # in between. The whole path is one change or it is a lie.
  "crates/pdf-manip/src/embed_font.rs",
  "crates/pdf-manip/tests/embed_font.rs",
  # Two guards about the fork register, which is t1's file. Carved out of t2's
  # scripts/ci/** below, the same way t3's licence guards are -- the mechanism
  # already exists, so this is not a new kind of exception.
  #
  # Their *wiring* is not claimed: local_ci_gate.sh and .github/workflows/ci.yml
  # stay with t2, and the lines that call these two are handed over on #292
  # rather than taken. Until t2 adds them the guards run nowhere, which is said
  # out loud in the pull request instead of being left to look finished.
  "scripts/ci/een_fork_zonder_forkpunt_wordt_niet_gemerged.py",
  "scripts/ci/de_gedeelde_config_breekt_geen_worktrees.py",
  "scripts/ci/the_fork_register_is_verifiable.py",
  "scripts/ci/een_forkpunt_wordt_op_inhoud_gecontroleerd.py",
  # T3's file, held by t1 only to carry the fix for two findings t1 raised in
  # review of #1650. The T3 session ended 02-09-2026 around 00:55Z with the
  # findings open, and a review finding nobody can act on is not a review. The
  # commit changes nothing else: the suffix allowlist becomes a binary skiplist,
  # and the read becomes encoding-aware. Hand back on T3's return.
  "scripts/ci/internal_stays_internal.py",
  # Claimed 02-09-2026, narrowly and visibly, for #308. The register guards'
  # safety regression (`test_de_registerwachters_raken_de_echte_repo_niet.py`)
  # is t1's, and a guard that runs nowhere is worse than no guard: it leaves
  # `every_guard_has_a_job.py` reporting an orphan on every CI run while the
  # regression itself never executes. Wiring it means two lines in t2's files,
  # so the claim is here rather than in the diff alone.
  #
  # This is the map's own mechanism for reaching outside a territory, not a way
  # around t2: it comes past review, and t2 can take these back at their next
  # ci.yml change if they want the step elsewhere.
  # `.github/workflows/ci.yml` and `scripts/ci/local_ci_gate.sh` were here too,
  # for #308. That landed and the issue is closed; t3 holds the two files now,
  # for one step each (see t3), and hands them to t2 the same way. The map
  # compares patterns literally, so one literal spelling has one owner.
  "scripts/ci/test_de_registerwachters_raken_de_echte_repo_niet.py",
  # The commit-msg wiring, claimed 02-09-2026 because t2 was the bottleneck
  # (holdout, three re-reviews, two fixes, a PR) and this work is t1's finding:
  # the hook HERKOMST.md has claimed since 26-08 does not exist. t2 reviews it.
  # Hand back with the rest of the CI wiring.
  ".githooks/commit-msg",
  ".githooks/pre-push",
  "scripts/git-hooks/commit-msg",
  "scripts/git-hooks/install.sh",
  "scripts/ci/no_ai_attribution.py",
  "scripts/ci/test_no_ai_attribution.py",
  "scripts/ci/the_commit_msg_hook_is_wired.py",
  "docs/HERKOMST.md",
]
# NOT claimed, and worth saying so: `crates/pdfluent/src/document.rs` and the two
# parity tests are edited by this change but stay with whoever owns the SDK
# facade. The edit is the delegation itself -- eight lines calling the function
# above -- so an owner reading it does not have to reconstruct the reasoning.
issues = [262, 256, 255, 210]

[[territory]]
id = "t2"
name = "CI, runners and gates"
waarom = """
Workflows and the guard scripts. The one place where a careless edit stops every
other terminal from being able to verify anything, so it gets a single owner."""
paden = [
  # The policy itself. `docs/licen*` is t3's and is lowercase, so this file --
  # the one the whole licence policy is written in -- matched no territory at
  # all until today. A map that covers the guard but not the thing it reads
  # leaves the argument about which is authoritative to whoever notices first.
  "docs/LICENSE_POLICY.toml",
  # Claimed 03-09-2026 for #276, and it is a loan rather than a move. This file
  # says which fifty documents the SSIM gate is calibrated on; the gate is CI
  # wiring and the fifty are being recovered into the runner snapshot, so the
  # manifest and the step that reads it move together or not at all.
  #
  # It fell to t4 and t5 only through their `**`, and neither session exists --
  # which is not the same as unclaimed, so it is claimed here in writing instead
  # of edited quietly. It returns to whoever owns `corpus/` the moment there is
  # a t4 or t5 again.
  "corpus/SSIM_GATE_MANIFEST.json",
  ".claude/**",
  ".github/workflows/**",
  ".gitlab-ci.yml",
  "scripts/ci/**",
  "docs/ci/**",
]
uitgezonderd = [
  # Not t2's, on purpose. Declaring a feature-gated test as deliberately not
  # running used to mean editing a t2 python file, so on 01-09-2026 T1 removed
  # a feature flag rather than declare it. A guard whose only escape hatch is
  # behind another terminal's door is a guard people route around. Unclaimed,
  # so anyone adding a feature flag can declare its gap in their own change.
  "scripts/ci/feature_gaps.toml",
  # Claimed BACK by t2 on 02-09-2026, so no longer excepted here. T3's session
  # ended, and the licence-policy guard has become CI wiring like the rest of
  # scripts/ci: it is the file that says what the policy IS, and it is
  # maintained where the wiring lives. It returns to t3 the moment that session
  # exists again and opens a pull request of its own.
  #
  # Found by the territory guard refusing my own #1656, hours after I had been
  # editing these files: it could not say so until today, because it ran on a
  # depth-1 checkout and its branch half skipped in silence. The two repairs I
  # made to that guard are what let it stop me.
  "scripts/ci/*publicat*",
  # Claimed BACK by t2 on 02-09-2026, so no longer excepted here. T3's session
  # ended and this guard has become CI wiring: it runs from the commit-msg hook
  # and from the message-guard job, and #1660 gives it a base-revision route, so
  # it is maintained where that wiring lives. It returns to t3 the moment there
  # is a t3 again. Written down rather than left implicit, because this map says
  # taking on work in another territory is a commit and not a silent edit.
  "scripts/ci/contributors.toml",
  "scripts/ci/repos_staan_zoals_bedoeld.py",
  # t3: the licence boundary and its test, claimed back on #295 (see t3).
  "scripts/ci/license_boundary.py",
  "scripts/ci/test_license_boundary.py",
  # t3: the document provenance register, claimed on #310.
  "scripts/ci/corpus_herkomst.py",
  # t3: the guard that puts the three licence registers side by side (#304).
  "scripts/ci/one_licence_three_registers.py",
  "scripts/ci/test_one_licence_three_registers.py",
  # t1: guards whose subject is docs/UPSTREAM_FORKS.toml and the worktrees this
  # repository is checked out into. Same carve-out as the licence guards above.
  "scripts/ci/een_fork_zonder_forkpunt_wordt_niet_gemerged.py",
  "scripts/ci/de_gedeelde_config_breekt_geen_worktrees.py",
  # Handed to t1 on #292 because the runner had no upstream clone and it exited 3
  # on every run. It reads the same register as the two above.
  "scripts/ci/the_fork_register_is_verifiable.py",
  "scripts/ci/een_forkpunt_wordt_op_inhoud_gecontroleerd.py",
  # t3: the document register guard, its test and its workflow, claimed on
  # 02-09-2026 (see t3 below).
  "scripts/ci/every_document_is_registered.py",
  "scripts/ci/test_every_document_is_registered.py",
  ".github/workflows/document-register.yml",
  # Taken back by t2 on 02-09-2026, as t3's own note said it would be: the
  # commit that retires the ALLOWED entry (a2ee809d) is on master, so the narrow
  # claim has done what it was for. Left standing it would be a register that
  # outlives its subject -- the class this map keeps catching elsewhere -- and it
